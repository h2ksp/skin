<div id="my-page">

<style>
  /* 1. 웹페이지 기본 설정 (정직한 좌측/자연스러운 마진) */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    position: relative;
  }

  /* 2. 로그인 폼 구조 (디자인 없는 기본 배치, 좌우 와일드하게 넓힘) */
  #my-page {
    width: 460px;
    margin: 30px auto;
    padding: 12px 20px;
    text-align: left !important;
    font-family: sans-serif;
    box-sizing: border-box;
    position: relative;
    z-index: 20;
  }

  #my-page .field-wrap {
    margin-bottom: 8px;
  }

  #my-page label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 2px;
  }

  #my-page input {
    width: 100%;
    padding: 6px 10px;
    font-size: 14px;
    box-sizing: border-box;
  }

  #my-page .btn-wrap {
    margin-top: 10px;
    margin-bottom: 10px;
  }

  #my-page button {
    width: 100%;
    padding: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-sizing: border-box;
  }

  #my-page .sns-wrap {
    margin-top: 6px;
  }

  #my-page .sns-btn {
    width: 100%;
    padding: 7px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-sizing: border-box;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    border: 1px solid #000000;
  }

  #my-page .sns-btn svg {
    width: 16px;
    height: 16px;
    margin-right: 10px;
    flex-shrink: 0;
  }

  #my-page hr {
    border: none;
    border-top: 1px solid #000000;
    margin: 12px 0;
  }

  #login-msg {
    margin-top: 8px;
    font-size: 13px;
    font-weight: bold;
  }

  #my-page .footer-wrap {
    margin-top: 12px;
    font-size: 13px;
    margin-bottom: 20px; /* 기존 배경 여백 제거 후 기본 여백으로 수정 */
  }
</style>

<!-- 로그인 폼 -->
<form id="loginForm">
    <div class="field-wrap">
        <label for="username">이메일</label>
        <input type="text" id="username" name="username" required>
    </div>

    <div class="field-wrap">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div class="btn-wrap">
        <button type="submit">로그인</button>
    </div>
</form>

<hr>

<!-- SNS 로그인 영역 -->
<div class="sns-wrap">
    <!-- 카카오 버튼 -->
    <button type="button" id="kakaoLoginBtn" class="sns-btn">
        <svg viewBox="0 0 24 24" fill="#000000"><path d="M12 3C6.48 3 2 6.58 2 11c0 2.85 1.84 5.35 4.6 6.75l-.99 3.65c-.1.38.31.69.64.48l4.31-2.82c.14.02.29.04.44.04 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/></svg>
        카카오 로그인
    </button>

    <!-- 구글 버튼 -->
    <button type="button" id="googleLoginBtn" class="sns-btn">
        <svg viewBox="0 0 24 24" fill="#000000"><path d="M12 5c1.6 0 3 .5 4.1 1.5l3.1-3.1C17.2 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5zm6.5 7c0-.4 0-.8-.1-1.2H12v2.3h3.6c-.2 1-.8 1.8-1.7 2.4l2.7 2.1c1.6-1.5 2.7-3.7 2.7-6.6zM4.3 14.7c-.2-.8-.3-1.7-.3-2.7s.1-1.9.3-2.7L.6 6.4C-.2 8.1-.5 10-.5 12s.3 3.9 1.1 5.6l3.7-2.9zM12 19c-3.1 0-5.8-2.1-6.7-5.1L1.6 16.8C3.5 20.4 7.4 23 12 23c2.8 0 5.2-.9 7-2.5l-3.2-2.5c-.9.6-2 1-3.8 1z"/></svg>
        구글 로그인
    </button>

    <!-- 네이버 버튼 -->
    <button type="button" id="naverLoginBtn" class="sns-btn">
        <svg viewBox="0 0 24 24" fill="#000000"><path d="M16.5 13.3L7.5 3H2v18h5.5V10.7l9 10.3H22V3h-5.5v10.3z"/></svg>
        네이버 로그인
    </button>
</div>

<div id="login-msg"></div>

<div class="footer-wrap">
    <a href="#" id="toggleMode">회원가입</a>
</div>

</div>

<script>
    // 블로그스팟 단독 렌더링 틀 유지
    const page = document.getElementById('my-page');
    if (page) {
        document.body.replaceChildren(page);
        document.body.appendChild(page);
    }

    // FastAPI 백엔드 연동 및 비동기 처리
    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('login-msg');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault(); 

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        loginMsg.textContent = '처리 중...';

        try {
            const response = await fetch('http://localhost:8000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                loginMsg.textContent = '성공';
            } else {
                loginMsg.textContent = data.detail || '실패';
            }
        } catch (error) {
            loginMsg.textContent = '서버 오류';
        }
    });

    // SNS 소셜 로그인 연동
    document.getElementById('kakaoLoginBtn').addEventListener('click', function() {
        const REST_API_KEY = 'YOUR_KAKAO_REST_API_KEY';
        const REDIRECT_URI = 'https://your-blogspot-url.blogspot.com';
        window.location.href = `https://kauth.kakao.com/oauth/authorize?client_id=${REST_API_KEY}&redirect_uri=${REDIRECT_URI}&response_type=code`;
    });

    document.getElementById('googleLoginBtn').addEventListener('click', function() {
        const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID';
        const REDIRECT_URI = 'https://your-blogspot-url.blogspot.com';
        window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=code&scope=email profile`;
    });

    document.getElementById('naverLoginBtn').addEventListener('click', function() {
        const CLIENT_ID = 'YOUR_NAVER_CLIENT_ID';
        const REDIRECT_URI = 'https://your-blogspot-url.blogspot.com';
        window.location.href = `https://nid.naver.com/oauth2.0/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=code`;
    });
</script>
