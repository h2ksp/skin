<div id="print-container">
    <div id="title">1-5-2 산업안전보건관리비('04, '06, '12, '20, '23년 보완)</div>

    <table class="tbl-note">
        <tr>
            <td style="vertical-align: top;">1.&nbsp;</td>
            <td>건설공사현장에서 산업재해 예방에 필요한 비용인 산업안전보건관리비는 산업안전보건법 제72조제1항의 규정에 의거 공사금액에 계상하여야 한다.</td>
        </tr>
        <tr>
            <td style="vertical-align: top;">2.&nbsp;</td>
            <td>공사금액에 계상된 산업안전보건관리비는 고용노동부가 고시한 “건설업 산업안전보건관리비 계상 및 사용기준” 에 따라 사용하여야 한다.</td>
        </tr>
        <tr>
            <td style="vertical-align: top;">3.&nbsp;</td>
            <td>산업안전보건기준에관한규칙 제146조 및 제241조의2에서 정하고 있는 타워크레인 신호업무담당자, 화재감시자의 인건비는 공사도급 내역서에 반영할 수 있다.</td>
        </tr>
    </table>
</div>
