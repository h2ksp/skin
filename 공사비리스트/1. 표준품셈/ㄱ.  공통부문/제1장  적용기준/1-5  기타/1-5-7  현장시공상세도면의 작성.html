    <table class="tbl-note">
        <tr>
            <td style="vertical-align: top;">1.&nbsp;</td>
            <td>공사의 시공을 위하여 시공상세도면(입체도면 포함)을 작성하는 경우에는 이에 필요한 인건비, 소모품비 등 소요비용을 별도 계상하며, 엔지니어링진흥법 제31조제2항에 따른
                ｢엔지니어링사업대가의 기준｣을 적용할 수 있다.
            </td>

            <td>공사진행단계별로 작성할 시공상세도면의 목록은 건설기술진흥법 시행규칙 제42조 규정에 의하여 발주청에서 공사시방서에 명시하여야한다.</td>
        </tr>
