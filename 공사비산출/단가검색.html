                this.filteredItems = this.allItems.filter(item => {
                    const val = item[searchKey] || item.prdctClsfcNoNm || item.품명;
                    return val && String(val).toLowerCase().includes(query);
                });

                if (this.filteredItems.length === 0) {
                    this.statusMessage = `'${query}' 검색 결과가 없어.`;
                    return;
                }

                this.statusMessage = `총 ${this.filteredItems.length}건 출력 완료 (전체 ${this.allItems.length}건 중)`;
            },

            // 하위 아이템 가져오기
            getSubItems(item) {
                if (!item) return [];
                const possibleSubKeys = ["일위대가상세", "etcCntnts"];
                for (const key of possibleSubKeys) {
                    if (item[key]) {
                        if (Array.isArray(item[key]) && item[key].length > 0) return item[key];
                        if (typeof item[key] === 'object' && Object.keys(item[key]).length > 0) return [item[key]];
                        if (typeof item[key] === 'string') {
                            return item[key].replace(/\\r\\n|\\n|\r\n?/g, '\n').split(/\n|(?=\s*\d+\.\s)/).map(line => line.trim()).filter(Boolean).map(line => ({ prdctClsfcNoNm: line }));
                        }
                    }
                }
                for (const k in item) {
                    if (Array.isArray(item[k]) && item[k].length > 0) return item[k];
                }
                return [];
            },

            // 행 토글 (확장/축소)
            toggleRow(idx) {
                if (this.currentApi.hasSub) {
                    const pos = this.expandedIndexes.indexOf(idx);
                    if (pos > -1) {
                        this.expandedIndexes.splice(pos, 1);
                    } else {
                        this.expandedIndexes.push(idx);
                    }
                }
            },

            // 최종 아이템 등록
            registerFinalItem(item) {
                const title = item.prdctClsfcNoNm || item.품명 || item.명칭 || '해당 자재';
                const spec = (item.krnPrdctNm || item.규격) ? ` (${item.krnPrdctNm || item.규격})` : '';
                let registrationMode = this.currentResultMode?.tableMode === 'breakdown' ? '재료비/노무비/경비 세부 내역' : '합계 금액';

                if (confirm(`'${title}${spec}' 자재를 [${registrationMode}] 방식으로 등록하시겠습니까?`)) {
                    alert(`'${title}' 항목이 등록되었습니다!`);
                }
            }
        }));
    });
</script>
