<style>
    .bottom-love-bar {
        visibility: visible;
        opacity: 1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1e293b;
    }

    #status {
        margin: 10px 0;
        font-size: 0.9rem;
        font-weight: 500;
        color: #475569;
    }

    .search-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    .table-container {
        overflow-x: auto;
    }

    .sub-table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        margin-top: 8px;
        overflow: hidden;
    }

    .sub-table th {
        font-size: 0.85rem;
        font-weight: 500;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        padding: 8px;
    }

    .sub-table td {
        border: 1px solid #e2e8f0;
        font-size: 0.85rem;
        padding: 8px 4px;
    }

    .cell-center {
        text-align: center;
    }

    .cell-left {
        text-align: left;
    }

    .cell-right {
        text-align: right;
    }

    select,
    input,
    button {
        padding: 5px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-size: 0.9rem;
    }

    button.action-btn {
        background: #3b82f6;
        color: white;
        border: none;
        cursor: pointer;
    }

    button.action-btn:hover {
        background: #2563eb;
    }

    button.action-btn:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    .radio-title {
        font-weight: 600;
        margin-right: 8px;
    }
</style>

<div id="search_item">
    <div class="bottom-love-bar">
        <div x-data="materialSearch">

            <!-- 1) 상단 검색 툴바 영역 (조달청 가격정보 분류 선택 + 품명 검색) -->
            <div x-show="showSearchBar" class="search-toolbar">
                <label for="apiSelect">분류:</label>
                <select id="apiSelect" x-model="selectedApiId" @change="loadData()">
                    <template x-for="api in apiList" :key="api.id">
                        <option :value="api.id" x-text="api.name"></option>
                    </template>
                </select>

                <label for="searchNm">품명:</label>
                <input type="text" id="searchNm" placeholder="검색어 입력" x-model="searchNm" @keyup.enter="filterItems()">

                <button type="button" class="action-btn" @click="filterItems()" :disabled="loading">검색하기</button>
            </div>

            <!-- 2) 응답결과 모드 선택 바 (라디오 버튼) -->
            <div x-show="shouldShowRadioBar()" style="margin-bottom: 10px;">
                <span class="radio-title">응답결과:</span>
                <template x-for="mode in currentApi.resultModes" :key="mode.id">
                    <label style="margin-right: 12px; cursor: pointer;">
                        <input type="radio" :name="'reg_type_' + currentApi.id" :value="mode.id"
                            :checked="currentRegType === mode.id" @change="setRegType(mode.id)">
                        <span x-text="mode.label"></span>
                    </label>
                </template>
            </div>

            <!-- 3) 상태 메시지 -->
            <div id="status" x-text="statusMessage"></div>

            <!-- 4) 메인 결과 목록 테이블 -->
            <div class="table-container" x-show="filteredItems.length > 0">
                <table class="sub-table">
                    <thead>
                        <tr>
                            <template x-for="(head, hIdx) in getHeaders()" :key="hIdx">
                                <th :style="head.width ? 'width:' + head.width : ''" x-text="head.label"></th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(item, idx) in filteredItems" :key="idx">
                            <tr class="clickable-row" @click="registerFinalItem(item)" style="cursor: pointer;">
                                <template x-for="(cell, cIdx) in getMaterialRow(item)" :key="cIdx">
                                    <td :class="cell.class" x-text="cell.val"></td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>


<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('materialSearch', () => ({
            showSearchBar: true,
            selectedApiId: "civil1",
            searchNm: "",

            selectedRegTypes: {},
            statusMessage: "데이터 로딩 중...",
            loading: false,
            allItems: [],
            filteredItems: [],

            // 조달청 시설공통자재 4가지 데이터만 남김
            apiList: [
                {
                    id: "civil1", name: "1. 토목 시설공통자재",
                    url: "https://raw.githubusercontent.com/h2ksp/skin/refs/heads/main/data/%EC%A1%B0%EB%8B%AC%EC%B2%AD%20%EA%B0%80%EA%B2%A9%EC%A0%95%EB%B3%B4%ED%98%84%ED%99%A9/1.%EC%8B%9C%EC%84%A4%EA%B3%B5%ED%86%B5%EC%9E%90%EC%9E%AC(%ED%86%A0%EB%AA%A9)%EA%B0%80%EA%B2%A9%EC%A0%95%EB%B3%B4.json",
                    hasSub: false,
                    searchKey: "prdctClsfcNoNm", defaultResultMode: "all",
                    resultModes: [
                        {
                            id: "all", label: "전체 보기", tableMode: "material",
                            columns: [
                                { key: "nticeDt", label: "공고일" },
                                { key: "prdctClsfcNoNm", label: "품명" },
                                { key: "krnPrdctNm", label: "규격" },
                                { key: "unit", label: "단위", width: "60px" },
                                { key: "prce", label: "가격(원)", width: "100px", class: "cell-right" },
                                { key: "vatYnNm", label: "부가세 여부" },
                                { key: "prceDiv", label: "가격구분" },
                                { key: "dlvryCndtnNm", label: "납품조건" }
                            ]
                        },
                                                {
                            id: "aㅇㅇl2", label: "ㅁㄴㅇㄹ보기", tableMode: "material",
                            columns: [
                                { key: "nticeDt", label: "공고일" },

                                { key: "prce", label: "가격(원)", width: "100px", class: "cell-right" },
                                { key: "vatYnNm", label: "부가세 여부" },
                                { key: "prceDiv", label: "가격구분" },
                                { key: "dlvryCndtnNm", label: "납품조건" }
                            ]
                        }
                    ]
                },
                {
                    id: "civil2", name: "2. 건축 시설공통자재",
                    url: "https://raw.githubusercontent.com/h2ksp/skin/refs/heads/main/data/%EC%A1%B0%EB%8B%AC%EC%B2%AD%20%EA%B0%80%EA%B2%A9%EC%A0%95%EB%B3%B4%ED%98%84%ED%99%A9/2.%EC%8B%9C%EC%84%A4%EA%B3%B5%ED%86%B5%EC%9E%90%EC%9E%AC(%EA%B1%B4%EC%B6%95)%EA%B0%80%EA%B2%A9%EC%A0%95%EB%B3%B4.json",
                    hasSub: false,
                    searchKey: "prdctClsfcNoNm", defaultResultMode: "all",
                    resultModes: [{ id: "all", label: "전체 보기", tableMode: "material", columns: [{ key: "nticeDt", label: "공고일" }, { key: "prdctClsfcNoNm", label: "품명" }, { key: "krnPrdctNm", label: "규격" }, { key: "unit", label: "단위", width: "60px" }, { key: "prce", label: "가격(원)", width: "100px", class: "cell-right" }, { key: "vatYnNm", label: "부가세 여부" }, { key: "prceDiv", label: "가격구분" }, { key: "dlvryCndtnNm", label: "납품조건" }] }]
                },
                {
                    id: "civil3", name: "3. 기계설비 시설공통자재",
                    url: "https://raw.githubusercontent.com/h2ksp/skin/refs/heads/main/data/%EC%A1%B0%EB%8B%AC%EC%B2%AD%20%EA%B0%80%EA%B2%A9%EC%A0%95%EB%B3%B4%ED%98%84%ED%99%A9/3.%EC%8B%9C%EC%84%A4%EA%B3%B5%ED%86%B5%EC%9E%90%EC%9E%AC(%EA%B8%B0%EA%B3%84%EC%84%A4%EB%B9%84)%EA%B0%80%EA%B2%A9%EC%A0%95%EB%B3%B4.json",
                    hasSub: false, searchKey: "prdctClsfcNoNm", defaultResultMode: "all",
                    resultModes: [{ id: "all", label: "전체 보기", tableMode: "material", columns: [{ key: "nticeDt", label: "공고일" }, { key: "prdctClsfcNoNm", label: "품명" }, { key: "krnPrdctNm", label: "규격" }, { key: "unit", label: "단위", width: "60px" }, { key: "prce", label: "가격(원)", width: "100px", class: "cell-right" }, { key: "vatYnNm", label: "부가세 여부" }, { key: "prceDiv", label: "가격구분" }, { key: "dlvryCndtnNm", label: "납품조건" }] }]
                },
                {
                    id: "civil4", name: "4. 전기, 정보통신 시설공통자재",
                    url: "https://raw.githubusercontent.com/h2ksp/skin/refs/heads/main/data/%EC%A1%B0%EB%8B%AC%EC%B2%AD%20%EA%B0%80%EA%B2%A9%EC%A0%95%EB%B3%B4%ED%98%84%ED%99%A9/4.%EC%8B%9C%EC%84%A4%EA%B3%B5%ED%86%B5%EC%9E%90%EC%9E%AC(%EC%A0%84%EA%B8%B0%2C%EC%A0%95%EB%B3%B4%ED%86%B5%EC%8B%A0)%EA%B0%80%EA%B2%A9%EC%A0%95%EB%B3%B4.json",
                    hasSub: false, searchKey: "prdctClsfcNoNm", defaultResultMode: "all",
                    resultModes: [{ id: "all", label: "전체 보기", tableMode: "material", columns: [{ key: "nticeDt", label: "공고일" }, { key: "prdctClsfcNoNm", label: "품명" }, { key: "krnPrdctNm", label: "규격" }, { key: "unit", label: "단위", width: "60px" }, { key: "prce", label: "가격(원)", width: "100px", class: "cell-right" }, { key: "vatYnNm", label: "부가세 여부" }, { key: "prceDiv", label: "가격구분" }, { key: "dlvryCndtnNm", label: "납품조건" }] }]
                }
            ],

            init() {
                this.loadData();
            },

            get currentApi() {
                return this.apiList.find(api => api.id === this.selectedApiId) || this.apiList[0];
            },

            get currentRegType() {
                return this.selectedRegTypes[this.currentApi.id]
                    || this.currentApi.defaultResultMode
                    || this.currentApi.resultModes[0]?.id;
            },

            get currentResultMode() {
                return this.currentApi.resultModes.find(mode => mode.id === this.currentRegType)
                    || this.currentApi.resultModes[0];
            },

            setRegType(type) {
                this.selectedRegTypes[this.currentApi.id] = type;
            },

            shouldShowRadioBar() {
                return this.showSearchBar && this.currentApi.resultModes.length > 0;
            },

            getHeaders() {
                return this.currentResultMode?.columns || [];
            },

            getMaterialRow(item) {
                const mode = this.currentResultMode;
                if (mode?.tableMode === 'material') {
                    return mode.columns.map(column => {
                        let val = column.getValue ? column.getValue(item) : item[column.key];
                        if (column.key === 'nticeDt') {
                            val = val ? String(val).split(' ')[0] : '';
                        } else if (column.key === 'prce') {
                            const price = Number(val);
                            val = (val === undefined || val === null || val === '' || isNaN(price)) ? (val || '') : price.toLocaleString('ko-KR');
                        } else {
                            val = val ?? '';
                        }
                        return { class: column.class || '', val };
                    });
                }
                return [];
            },

            async loadData() {
                const api = this.currentApi;
                if (!api || !api.url) return;

                this.loading = true;
                this.statusMessage = "데이터 요청 중...";
                this.filteredItems = [];

                const cleanUrl = encodeURI(decodeURI(api.url));
                const targetUrl = `${cleanUrl}?v=${new Date().getTime()}`;

                try {
                    const response = await fetch(targetUrl);
                    if (!response.ok) throw new Error(`HTTP 에러! 상태 코드: ${response.status}`);

                    const jsonObj = await response.json();
                    let rawItems = jsonObj?.response?.body?.items || jsonObj || [];

                    if (!rawItems || (Array.isArray(rawItems) && rawItems.length === 0)) {
                        this.statusMessage = "데이터가 비어있거나 불러올 수 없어.";
                        this.loading = false;
                        return;
                    }

                    this.allItems = Array.isArray(rawItems) ? rawItems : [rawItems];

                    if (this.searchNm.trim() !== "") {
                        this.filterItems();
                    } else {
                        this.statusMessage = "데이터 준비 완료";
                    }
                } catch (error) {
                    console.error("오류 발생:", error);
                    this.statusMessage = "데이터 로드 실패: " + error.message;
                } finally {
                    this.loading = false;
                }
            },

            filterItems() {
                if (this.allItems.length === 0) return;
                const query = this.searchNm.trim().toLowerCase();

                if (!query) {
                    this.filteredItems = [];
                    this.statusMessage = "검색어를 입력해줘.";
                    return;
                }

                const searchKey = this.currentApi.searchKey;
                this.filteredItems = this.allItems.filter(item => {
                    const val = item[searchKey] || item.prdctClsfcNoNm || item.품명;
                    return val && String(val).toLowerCase().includes(query);
                });

                if (this.filteredItems.length === 0) {
                    this.statusMessage = `'${query}' 검색 결과가 없어.`;
                    return;
                }

                this.statusMessage = `총 ${this.filteredItems.length}건 출력 완료 (전체 ${this.allItems.length}건 중)`;
            },

            registerFinalItem(item) {
                const title = item.prdctClsfcNoNm || item.품명 || item.명칭 || '해당 자재';
                const spec = (item.krnPrdctNm || item.규격) ? ` (${item.krnPrdctNm || item.규격})` : '';

                if (confirm(`'${title}${spec}' 자재를 등록하시겠습니까?`)) {
                    alert(`'${title}' 항목이 등록되었습니다!`);
                }
            }
        }));
    });
</script>
