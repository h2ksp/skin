<div x-data="projectManager()" id="print-container">

    <h1>새 프로젝트</h1>

    <!-- 현재 활성 프로젝트 표시 -->
    <div class="active-box">
        <span>현재 활성: </span>
        <span id="activeDisplay" x-text="option.activeProject || '선택된 프로젝트 없음'"></span>
    </div>

    <!-- 프로젝트 입력 폼 및 샘플 추가 버튼 -->
    <div class="input-row" x-data="{ newName: '' }">
        <input type="text" x-model="newName" @keyup.enter="addProject(newName); newName = '';"
            placeholder=" 새 프로젝트 이름 입력..." autocomplete="off">
        <button @click="addProject(newName); newName = '';">추가</button>
        <!-- 💡 샘플 프로젝트 추가 버튼 -->
        <button @click="addSampleProject()">샘플프로젝트</button>
    </div>

    <!-- 프로젝트 목록 테이블 -->
    <div style="margin-top: 50px;">
        <div class="tbl-text">프로젝트 목록</div>
        <table id="projectTable">
            <tbody id="projectList">
                <template x-for="(project, index) in option.projectList" :key="project">
                    <tr>
                        <!-- 1. 순번 -->
                        <td class="tbl-num" x-text="(index + 1) + '.'"></td>

                        <!-- 2. 프로젝트 이름 -->
                        <td>
                            <div class="tbl-text" :class="{ 'is-active-project': project === option.activeProject }"
                                x-text="project"></div>
                        </td>

                        <!-- 3. 선택, 편집, 삭제 버튼 -->
                        <td style="width: 170px; text-align: right;">
                            <div class="btn-group">
                                <button @click="setActive(project)">선택</button>
                                <button @click="editProject(project)">편집</button>
                                <button @click="deleteProject(project)">삭제</button>
                            </div>
                        </td>

                        <!-- 4. 위아래(▲, ▼) 버튼 -->
                        <td style="width: 90px; text-align: right;">
                            <div class="btn-group">
                                <button @click="moveUp(index)" :disabled="index === 0">▲</button>
                                <button @click="moveDown(index)"
                                    :disabled="index === option.projectList.length - 1">▼</button>
                            </div>
                        </td>
                    </tr>
                </template>

                <!-- 등록된 프로젝트가 없을 때 -->
                <template x-if="option.projectList.length === 0">
                    <tr>
                        <td colspan="4" style="color: gray; font-size: 17px; padding: 6px 2px;">등록된 프로젝트가 없습니다.</td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

</div>

<style>
    #main {
        position: relative;
        left: -70px;
    }

    .active-box {
        margin: 18px 0;
    }

    #activeDisplay {
        font-weight: bold;
    }

    .input-row {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
    }

    .input-row input {
        width: 40%;
        outline: none;
    }

    .input-row button {
        padding: 5px 12px;
        font-size: 13px;
        cursor: pointer;
    }

    #projectTable {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }

    #projectTable td {
        border: none;
        padding: 0 2px;
        vertical-align: middle;
    }

    .tbl-num {
        width: 30px;
        color: #666;
        text-align: left;
    }

    .is-active-project {
        font-weight: bold;
    }

    table button {
        cursor: pointer;
    }

    .btn-group {
        display: inline-flex;
        gap: 4px;
        white-space: nowrap;
        justify-content: flex-end;
        width: 100%;
    }
</style>

<script>
    function projectManager() {
        return {
            option: JSON.parse(localStorage.getItem('option')) || {
                projectList: [],
                activeProject: null
            },

            costData: JSON.parse(localStorage.getItem('cost')) || {},

            init() {
                const allKeys = Object.keys(this.costData);
                let currentList = this.option.projectList;

                if (currentList.length > 0) {
                    currentList = currentList.filter(name => this.costData[name]);
                    allKeys.forEach(name => {
                        if (!currentList.includes(name)) currentList.push(name);
                    });
                    this.option.projectList = currentList;
                } else {
                    this.option.projectList = allKeys;
                }

                if (!this.option.activeProject || !this.costData[this.option.activeProject]) {
                    this.option.activeProject = this.option.projectList.length > 0 ? this.option.projectList[0] : null;
                }

                this.saveAll();
            },

            saveAll() {
                localStorage.setItem('option', JSON.stringify(this.option));
                localStorage.setItem('cost', JSON.stringify(this.costData));
            },

            addProject(inputName) {
                const rawData = JSON.parse(localStorage.getItem('api_data')) || {};
                const fuelArray = rawData?.data?.oil?.fuelPrices || [];
                const oil = (name) => {
                    const found = fuelArray.find(item => item.fuelType === name);
                    return found ? found.price : '';
                };

                const name = (inputName || '').trim();
                if (!name) return alert('프로젝트 이름을 입력해줘!');
                if (this.costData[name]) return alert('이미 존재하는 프로젝트야!');

                this.costData[name] = {
                    공종별내역서: [],
                    일위대가: [],
                    중기단가산출근거: [],
                    적용기준: {
                        환율: {
                            달러: 1350,
                            엔: 990
                        },
                        유류단가: {
                            휘발유: oil('휘발유'),
                            경유: oil('자동차용경유'),
                            선박용경유: '',
                            중유: ''
                        }
                    },
                    옵션: {
                        그룹명: ['건축', '토목', '전기', '기계', '조경', '소방', '통신', '기타']
                    }
                };

                this.option.projectList.push(name);
                if (!this.option.activeProject) this.option.activeProject = name;
                this.saveAll();
            },

            // 💡 깃허브에서 샘플 프로젝트 다운받아서 추가하는 함수
            async addSampleProject() {
                try {
                    const res = await fetch('https://raw.githubusercontent.com/h2ksp/skin/refs/heads/main/data/sample_Project.json');
                    if (!res.ok) throw new Error('샘플 데이터 로드 실패');

                    const sampleData = await res.json();

                    Object.keys(sampleData).forEach(sampleName => {
                        let targetName = sampleName;
                        let counter = 1;
                        while (this.costData[targetName]) {
                            targetName = `${sampleName}_(${counter})`;
                            counter++;
                        }

                        // 데이터 병합
                        this.costData[targetName] = sampleData[sampleName];

                        // 목록에 없으면 추가
                        if (!this.option.projectList.includes(targetName)) {
                            this.option.projectList.push(targetName);
                        }
                    });

                    // 활성 프로젝트가 없다면 첫 번째로 지정
                    if (!this.option.activeProject && this.option.projectList.length > 0) {
                        this.option.activeProject = this.option.projectList[0];
                    }

                    this.saveAll();
                } catch (err) {
                    console.error('샘플 프로젝트 로드 에러:', err);
                }
            },

            editProject(oldName) {
                const newName = prompt('변경할 프로젝트 이름을 입력해줘:', oldName);
                if (!newName) return;

                const trimmedName = newName.trim();
                if (!trimmedName || trimmedName === oldName) return;
                if (this.costData[trimmedName]) return alert('이미 존재하는 프로젝트 이름이야!');

                this.costData[trimmedName] = this.costData[oldName];
                delete this.costData[oldName];

                this.option.projectList = this.option.projectList.map(name => name === oldName ? trimmedName : name);
                if (this.option.activeProject === oldName) this.option.activeProject = trimmedName;
                this.saveAll();
            },

            deleteProject(name) {
                if (!confirm(`"${name}" 프로젝트를 삭제할래?`)) return;

                delete this.costData[name];
                this.option.projectList = this.option.projectList.filter(p => p !== name);

                if (this.option.activeProject === name) {
                    this.option.activeProject = this.option.projectList.length > 0 ? this.option.projectList[0] : null;
                }
                this.saveAll();
            },

            moveUp(index) {
                if (index <= 0) return;
                const list = this.option.projectList;
                const temp = list[index];
                list[index] = list[index - 1];
                list[index - 1] = temp;
                this.saveAll();
            },

            moveDown(index) {
                const list = this.option.projectList;
                if (index >= list.length - 1) return;
                const temp = list[index];
                list[index] = list[index + 1];
                list[index + 1] = temp;
                this.saveAll();
            },

            setActive(name) {
                this.option.activeProject = name;
                this.saveAll();
            }
        };
    }
</script>
