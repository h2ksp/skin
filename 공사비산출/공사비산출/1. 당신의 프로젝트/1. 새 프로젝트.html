<div x-data id="print-container">

    <h1>새 프로젝트</h1>

    <div class="tbl-text"
        style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 400; font-style: italic; color: #666666; margin-bottom: 12px; line-height: 1.6;">
        "프로젝트를 추가 할 수 있고 순서를 바꾸거나 이름을 편집하거나 삭제할 수 있습니다."
    </div>

    <!-- 현재 활성 프로젝트 표시 (option 안에서 가져옴) -->
    <div class="active-box" x-data>
        <span>현재 활성: </span>
        <span id="activeDisplay" x-text="$store.dbStore.option.activeProject || '선택된 프로젝트 없음'"></span>
    </div>

    <!-- 프로젝트 입력 폼 -->
    <div class="input-row" x-data="{ newName: '' }">
        <input type="text" x-model="newName" @keyup.enter="$store.dbStore.addProject(newName); newName = '';"
            placeholder=" 새 프로젝트 이름 입력..." autocomplete="off">
        <button @click="$store.dbStore.addProject(newName); newName = '';">추가</button>
    </div>

    <!-- 프로젝트 목록 테이블 -->
    <div style="margin-top: 50px;" x-data>
        <div class="tbl-text">프로젝트 목록</div>
        <table id="projectTable">
            <tbody id="projectList">
                <template x-for="(project, index) in $store.dbStore.option.projectList" :key="project">
                    <tr>
                        <!-- 1. 순번 -->
                        <td class="tbl-num" x-text="(index + 1) + '.'"></td>

                        <!-- 2. 프로젝트 이름 -->
                        <td>
                            <div class="tbl-text"
                                :class="{ 'is-active-project': project === $store.dbStore.option.activeProject }"
                                x-text="project"></div>
                        </td>

                        <!-- 3. 선택, 편집, 삭제 버튼 -->
                        <td style="width: 170px; text-align: right;">
                            <div class="btn-group">
                                <button @click="$store.dbStore.setActive(project)">선택</button>
                                <button @click="$store.dbStore.editProject(project)">편집</button>
                                <button @click="$store.dbStore.deleteProject(project)">삭제</button>
                            </div>
                        </td>

                        <!-- 4. 위아래(▲, ▼) 버튼 -->
                        <td style="width: 90px; text-align: right;">
                            <div class="btn-group">
                                <button @click="$store.dbStore.moveUp(index)" :disabled="index === 0">▲</button>
                                <button @click="$store.dbStore.moveDown(index)"
                                    :disabled="index === $store.dbStore.option.projectList.length - 1">▼</button>
                            </div>
                        </td>
                    </tr>
                </template>

                <!-- 등록된 프로젝트가 없을 때 -->
                <template x-if="$store.dbStore.option.projectList.length === 0">
                    <tr>
                        <td colspan="4" style="color: gray; font-size: 17px; padding: 6px 2px;">등록된 프로젝트가 없습니다.</td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

</div>

<style>
    #main {
        position: relative;
        left: -70px;
    }

    .active-box {
        margin: 18px 0;
    }

    #activeDisplay {
        font-weight: bold;
    }

    .input-row {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
    }

    .input-row input {
        width: 50%;
        outline: none;
    }

    .input-row button {
        padding: 5px 12px;
        font-size: 13px;
        cursor: pointer;
    }

    #projectTable {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }

    #projectTable td {
        border: none;
        padding: 0 2px;
        vertical-align: middle;
    }

    .tbl-num {
        width: 30px;
        color: #666;
        text-align: left;
    }

    .is-active-project {
        font-weight: bold;
    }

    table button {
        cursor: pointer;
    }

    .btn-group {
        display: inline-flex;
        gap: 4px;
        white-space: nowrap;
        justify-content: flex-end;
        width: 100%;
    }

    .project-manager-app table button {
        cursor: pointer;
        text-align: center;
    }

    .project-manager-app table button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
</style>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('dbStore', {
            cost: JSON.parse(localStorage.getItem('cost')) || {},

            // 💡 프로젝트 리스트와 활성 프로젝트를 option 객체 하나로 묶음!
            option: JSON.parse(localStorage.getItem('option')) || {
                projectList: [],
                activeProject: null
            },

            // 초기화 메서드
            initStore() {
                const costData = this.cost;
                const allKeys = Object.keys(costData);
                let currentList = this.option.projectList;

                if (currentList.length > 0) {
                    // 기존 데이터 정합성 맞추기 (삭제된 프로젝트 제거, 새로 생긴 프로젝트 추가)
                    currentList = currentList.filter(name => costData[name]);
                    allKeys.forEach(name => {
                        if (!currentList.includes(name)) {
                            currentList.push(name);
                        }
                    });
                    this.option.projectList = currentList;
                } else {
                    this.option.projectList = allKeys;
                }
                this.saveOption();

                // 활성 프로젝트 세팅
                if (this.option.activeProject && costData[this.option.activeProject]) {
                    // 유효함
                } else if (this.option.projectList.length > 0) {
                    this.option.activeProject = this.option.projectList[0];
                    this.saveOption();
                } else {
                    this.option.activeProject = null;
                    this.saveOption();
                }
            },

            // 저장 메서드 (option 객체 통째로 저장)
            saveCost() {
                localStorage.setItem('cost', JSON.stringify(this.cost));
            },
            saveOption() {
                localStorage.setItem('option', JSON.stringify(this.option));
            },

            // 액션 메서드들
            addProject(inputName) {
                const name = (inputName || '').trim();
                if (!name) {
                    alert('프로젝트 이름을 입력해줘!');
                    return;
                }

                if (this.cost[name]) {
                    alert('이미 존재하는 프로젝트야!');
                    return;
                }

                // 기본 구조 생성
                this.cost[name] = {
                    공종별내역서: [
                    
                    ],
                    일위대가: [],
                    중기단가산출근거: [],
                    적용기준: {
                        환율: { 달러: '', 엔: '' },
                        유류단가: { 휘발유: '', 경유: '', 선박용경유: '', 중유: '' },
                    },
                    옵션: {
                        그룹명: ['건축', '토목', '전기', '기계', '조경', '소방', '통신', '기타']
                    }
                };
                this.saveCost();

                this.option.projectList.push(name);
                this.saveOption();

                if (!this.option.activeProject) {
                    this.setActive(name);
                }
            },

            editProject(oldName) {
                const newName = prompt('변경할 프로젝트 이름을 입력해줘:', oldName);
                if (!newName) return;

                const trimmedName = newName.trim();
                if (!trimmedName) {
                    alert('유효한 이름을 입력해줘!');
                    return;
                }

                if (trimmedName === oldName) return;

                if (this.cost[trimmedName]) {
                    alert('이미 존재하는 프로젝트 이름이야!');
                    return;
                }

                this.cost[trimmedName] = this.cost[oldName];
                delete this.cost[oldName];
                this.saveCost();

                this.option.projectList = this.option.projectList.map(name => name === oldName ? trimmedName : name);
                this.saveOption();

                if (this.option.activeProject === oldName) {
                    this.setActive(trimmedName);
                }
            },

            deleteProject(name) {
                if (!confirm(`"${name}" 프로젝트를 삭제할래?`)) return;

                delete this.cost[name];
                this.saveCost();

                this.option.projectList = this.option.projectList.filter(p => p !== name);
                this.saveOption();

                if (this.option.activeProject === name) {
                    this.option.activeProject = this.option.projectList.length > 0 ? this.option.projectList[0] : null;
                    this.saveOption();
                }
            },

            moveUp(index) {
                if (index <= 0) return;
                const list = this.option.projectList;
                const temp = list[index];
                list[index] = list[index - 1];
                list[index - 1] = temp;
                this.saveOption();
            },

            moveDown(index) {
                const list = this.option.projectList;
                if (index >= list.length - 1) return;
                const temp = list[index];
                list[index] = list[index + 1];
                list[index + 1] = temp;
                this.saveOption();
            },

            setActive(name) {
                this.option.activeProject = name;
                this.saveOption();
            }
        });

        // 초기화 실행
        Alpine.store('dbStore').initStore();
    });
</script>
