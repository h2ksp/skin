<style>
    .project-select-wrap {
        margin-top: 35px;
    }

    .project-select-wrap label {
        margin-right: 8px;
    }

    #projectSelect {
        width: 280px;
        padding: 4px;
    }

    .group-title {
        margin-top: 14px;
        margin-bottom: 4px;
    }

    .sub-box {
        padding-left: 15px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 25px;
    }

    .input-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 350px;
        padding: 0;
        margin: 0;
        line-height: 1;
    }
</style>

<div x-data="standardsApp()" x-init="init()" id="print-container">
    <h1>적용기준 관리</h1>

    <!-- 프로젝트 선택 콤보박스 (activeProject와 양방향 바인딩) -->
    <div class="project-select-wrap">
        <label for="projectSelect" class="tbl-text">프로젝트 선택:</label>
        <select id="projectSelect" x-model="activeProject" @change="onProjectChange()">
            <template x-for="name in projectList" :key="name">
                <option :value="name" x-text="name"></option>
            </template>
            <template x-if="projectList.length === 0">
                <option value="">등록된 프로젝트 없음</option>
            </template>
        </select>
    </div>

    <!-- 컨텐츠 영역 (활성 프로젝트가 있을 때만 노출) -->
    <div id="contentArea" x-show="activeProject && standards">
        <div id="projectTitle" class="tbl-text" style="margin-top: 30px;" x-text="`[${activeProject}] _ 적용기준`"></div>
        
        <div id="standardsContainer">
            <template x-for="(groupEntry, groupIndex) in Object.entries(standards || {})" :key="groupEntry[0]">
                <div style="margin-bottom: 6px;">
                    <!-- 그룹 타이틀 -->
                    <div class="tbl-text group-title" x-text="`${groupIndex + 1}. ${groupEntry[0]}`"></div>

                    <!-- 서브 박스 -->
                    <div class="sub-box">
                        <!-- 객체 형태일 때 (예: 환율, 유류단가 등) -->
                        <template x-if="typeof groupEntry[1] === 'object' && groupEntry[1] !== null">
                            <template x-for="subEntry in Object.entries(groupEntry[1])" :key="subEntry[0]">
                                <div class="input-row">
                                    <span class="tbl-text" x-text="subEntry[0]"></span>
                                    <input type="text" autocomplete="off"
                                        :value="formatNumber(subEntry[1])"
                                        @input="updateStandardValue(groupEntry[0], subEntry[0], $event)">
                                </div>
                            </template>
                        </template>

                        <!-- 단일 값 형태일 때 -->
                        <template x-if="typeof groupEntry[1] !== 'object' || groupEntry[1] === null">
                            <div class="input-row">
                                <span class="tbl-text">기준</span>
                                <input type="text" autocomplete="off"
                                    :value="formatNumber(groupEntry[1])"
                                    @input="updateStandardValue(groupEntry[0], null, $event)">
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
    function standardsApp() {
        return {
            // 로컬스토리지에서 데이터 바로 가져오기
            projectList: [],
            activeProject: null,
            costData: JSON.parse(localStorage.getItem('cost')) || {},

            get standards() {
                if (!this.activeProject) return null;
                return this.costData[this.activeProject]?.적용기준 || null;
            },

            init() {
                const optionData = JSON.parse(localStorage.getItem('option')) || {
                    projectList: [],
                    activeProject: null
                };

                const allKeys = Object.keys(this.costData);
                let currentList = optionData.projectList || [];

                if (currentList.length > 0) {
                    currentList = currentList.filter(name => this.costData[name]);
                    allKeys.forEach(name => {
                        if (!currentList.includes(name)) {
                            currentList.push(name);
                        }
                    });
                    this.projectList = currentList;
                } else {
                    this.projectList = allKeys;
                }

                if (optionData.activeProject && this.costData[optionData.activeProject]) {
                    this.activeProject = optionData.activeProject;
                } else if (this.projectList.length > 0) {
                    this.activeProject = this.projectList[0];
                } else {
                    this.activeProject = null;
                }

                this.saveOption();
            },

            // 옵션(프로젝트 목록 및 활성 프로젝트) 로컬스토리지 저장
            saveOption() {
                const option = {
                    projectList: this.projectList,
                    activeProject: this.activeProject
                };
                localStorage.setItem('option', JSON.stringify(option));
            },

            // 비용(적용기준 등) 데이터 로컬스토리지 저장
            saveCost() {
                localStorage.setItem('cost', JSON.stringify(this.costData));
            },

            onProjectChange() {
                this.saveOption();
            },

            formatNumber(value) {
                if (value === undefined || value === null || value === '') return '';
                const cleaned = value.toString().replace(/[^\d.]/g, '');
                const parts = cleaned.split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                return parts.join('.');
            },

            updateStandardValue(groupKey, subKey, event) {
                const rawValue = event.target.value.replace(/,/g, '');
                event.target.value = this.formatNumber(rawValue);

                if (!this.activeProject) return;

                if (this.costData[this.activeProject] && this.costData[this.activeProject].적용기준) {
                    if (subKey !== null) {
                        this.costData[this.activeProject].적용기준[groupKey][subKey] = rawValue;
                    } else {
                        this.costData[this.activeProject].적용기준[groupKey] = rawValue;
                    }
                    this.saveCost();
                }
            }
        }
    }
</script>
