<style>
    .unit-price-list {
        color: #333;
        font-size: 13px;
        text-align: right;
    }

    .unit-price-list .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0;
        padding: 8px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background-color: rgba(249, 249, 249, 0.9);
    }

    .unit-price-list select {
        min-width: 180px;
        padding: 5px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: white;
        font-size: 13px;
    }

    .unit-price-list .status-bar {
        display: flex;
        align-items: center;
        margin: 12px 0;
    }

    .unit-price-list .status {
        color: #6b7280;
        font-weight: 500;
    }

    .unit-price-list .view-options {
        display: flex;
        gap: 16px;
        margin-left: 50px;
        align-items: center;
    }

    .unit-price-list .view-options label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-size: 13px;
        color: #374151;
    }

    .unit-price-list .table-container {
        overflow-x: auto;
        margin-top: 10px;
    }

    .unit-price-list table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
    }

    .unit-price-list td {
        text-align: left;
        white-space: nowrap;
    }

    .unit-price-list thead th,
    .unit-price-list thead td {
        text-align: center !important;
    }

    .unit-price-list input[type="text"] {
        border: none;
        border-bottom: 1px solid #ccc;
        background: transparent;
        font-size: 15px;
        font-style: italic;
        line-height: 1.2;
        outline: none;
        padding-left: 8px;
        box-sizing: border-box;
    }

    .unit-price-list input[type="text"]:focus {
        border-bottom: 2px solid #2563eb;
    }

    .unit-price-list input[type="text"][readonly] {
        border-bottom: 1px solid #e5e7eb;
        color: #4b5563;
    }

    .unit-price-list .text-center {
        text-align: center;
    }

    .unit-price-list .text-right {
        text-align: right;
    }

    .unit-price-list .text-left {
        text-align: left;
    }

    .unit-price-list .w-full {
        width: 90%;
    }

    .unit-price-list .w-unit {
        width: 35px;
    }

    .unit-price-list .w-read {
        width: 80px;
    }

    .unit-price-list .col-remark {
        width: 200px;
    }

    .unit-price-list .col-remark input[type="text"] {
        width: 90% !important;
    }

    .unit-price-list .edit-btn {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
    }
</style>

<div id="title">단가 목록표</div>

<div class="unit-price-list" x-data="unitPriceList()" x-init="init()">
    <div class="toolbar">
        <label for="unitPriceProject">프로젝트:</label>
        <select id="unitPriceProject" x-model="activeProject" @change="saveActiveProject()">
            <option value="">프로젝트 선택</option>
            <template x-for="project in projectList" :key="project">
                <option :value="project" x-text="project"></option>
            </template>
        </select>

        <label for="unitPriceGroup">대분류:</label>
        <select id="unitPriceGroup" x-model="activeGroup">
            <option value="">전체</option>
            <template x-for="(group, index) in groupList" :key="index">
                <option :value="String(index)" x-text="group"></option>
            </template>
        </select>

        <label for="unitPriceCost">비용 구분:</label>
        <select id="unitPriceCost" x-model="costFilter">
            <option value="">전체</option>
            <option value="자재">자재</option>
            <option value="노무">노무</option>
            <option value="경비">경비</option>
            <option value="손료">손료</option>
        </select>
    </div>

    <div class="status-bar">
        <div class="status" x-text="statusMessage"></div>
        <div class="view-options" x-show="rows.length > 0 && costFilter !== 'hand'">
            <label>
                <input type="radio" name="viewMode" value="option1" x-model="viewMode"> 금액보기
            </label>
            <label>
                <input type="radio" name="viewMode" value="option2" x-model="viewMode"> 비고
            </label>
        </div>
    </div>

    <div class="table-container" x-show="rows.length > 0 && costFilter !== 'hand'">
        <table>
            <thead>
                <tr>
                    <td>구분</td>
                    <td>품명</td>
                    <td>규격</td>
                    <td>단위</td>

                    <template x-for="col in columns" :key="col.key">
                        <td x-text="col.label"></td>
                    </template>

                    <td>중복 수</td>
                    <td>대분류 위치</td>
                </tr>
            </thead>

            <tbody>
                <template x-for="row in rows" :key="row.key">
                    <tr>
                        <td x-text="row.category"></td>

                        <td>
                            <input type="text" class="w-full" :value="row.item.name ?? ''"
                                @input="updateGroupedField(row, 'name', $event)">
                        </td>

                        <td>
                            <input type="text" class="w-full" :value="row.item.spec ?? ''"
                                @input="updateGroupedField(row, 'spec', $event)">
                        </td>

                        <td>
                            <input type="text" class="w-unit" :value="row.item.unit ?? ''"
                                @input="updateGroupedField(row, 'unit', $event)">
                        </td>

                        <template x-for="col in columns" :key="col.key">
                            <td class="cha">
                                <input type="text" class="w-full"
                                    :class="col.key === 'item9' ? 'text-left' : 'text-right'"
                                    :value="col.key === 'item9' ? row.remark : (row.item[col.key] ?? '')"
                                    @input="updateGroupedField(row, col.key, $event)" style="width: 75px;">
                            </td>
                        </template>

                        <td class="text-center" x-text="row.count > 1 ? row.count : '-'"></td>
                        <td x-text="row.locations.join(', ')"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>

<script>
    function unitPriceList() {
        return {
            projectList: [],
            activeProject: '',
            activeGroup: '',
            costFilter: '',
            store: null,
            viewMode: 'option1',

            init() {
                this.store = Alpine.store('dbStore');
                if (!this.store) {
                    throw new Error('dbStore를 찾을 수 없습니다.');
                }

                const option = JSON.parse(localStorage.getItem('option') || '{}');
                this.projectList = Array.isArray(option.projectList)
                    ? option.projectList
                    : Object.keys(this.store.cost || {});

                this.activeProject = option.activeProject || '';
                if (!this.projectList.includes(this.activeProject)) {
                    this.activeProject = this.projectList[0] || '';
                }
            },

            get groupList() {
                return this.store?.cost?.[this.activeProject]?.옵션?.그룹명 || [];
            },

            saveActiveProject() {
                const option = JSON.parse(localStorage.getItem('option') || '{}');
                option.activeProject = this.activeProject;
                localStorage.setItem('option', JSON.stringify(option));
                this.activeGroup = '';
            },

            hasCostValue(item, field) {
                const value = String(item?.[field] ?? '').replace(/,/g, '').trim();
                const number = Number(value);
                return value !== '' && Number.isFinite(number) && number !== 0;
            },

            calcRow(item, field, event) {
                if (field && event) {
                    if (field === 'name' || field === 'item9') {
                        item[field] = event.target.value;
                    } else {
                        const rawValue = event.target.value.replace(/,/g, '');
                        if (rawValue === '' || !Number.isFinite(Number(rawValue))) {
                            item[field] = '';
                            event.target.value = '';
                        } else {
                            item[field] = Number(rawValue).toLocaleString('ko-KR');
                            event.target.value = item[field];
                        }
                    }
                }

                const getNumber = value =>
                    Number(String(value || '').replace(/,/g, '')) || 0;

                const sum = getNumber(item.item1) + getNumber(item.item2) + getNumber(item.item3);
                item.item4 = sum ? sum.toLocaleString('ko-KR') : '0';

                this.saveData();
            },

            saveData() {
                if (this.store?.cost) {
                    this.store._saveData(this.store.cost);
                }
            },


            get columns() {
                if (this.viewMode === 'option2') {
                    return [{ label: '비고', key: 'item9', readonly: false }];
                }

                return [
                    { label: '재료비', key: 'item1', readonly: false },
                    { label: '노무비', key: 'item2', readonly: false },
                    { label: '경비', key: 'item3', readonly: false },
                    { label: '단가합계', key: 'item4', readonly: true }
                ];
            },

            get rows() {
                if (!this.store || !this.activeProject) return [];

                const project = this.store.cost?.[this.activeProject];
                const data = project?.공종별내역서;
                if (!data || typeof data !== 'object') return [];

                const groupNames = project?.옵션?.그룹명 || [];
                const grouped = new Map();

                const categoryOf = type => {
                    const value = String(type || '').trim();

                    if (['자재', '재료', '자재비', '재료비'].includes(value)) return '자재';
                    if (['노무', '노무비'].includes(value)) return '노무';
                    if (value === '경비') return '경비';
                    if (value === '손료') return '손료';

                    return '';
                };

                const addItem = (item, groupName, groupIndex, subGroup) => {
                    const type = String(item?.type ?? '').trim();
                    const category = categoryOf(type) || (this.costFilter ? '' : type || '미분류');

                    if (this.costFilter && this.costFilter !== category) return;

                    const key = JSON.stringify([
                        category,
                        item.name ?? '',
                        item.spec ?? '',
                        item.unit ?? '',
                        item.item1 ?? '',
                        item.item2 ?? '',
                        item.item3 ?? ''
                    ]);

                    let row = grouped.get(key);

                    if (!row) {
                        row = {
                            key,
                            category,
                            item,
                            count: 0,
                            locations: []
                        };
                        grouped.set(key, row);
                    }

                    row.count++;

                    if (!row.locations.includes(groupName)) {
                        row.locations.push(groupName);
                    }
                };

                const visit = (item, groupName, groupIndex, subGroup) => {
                    if (!item || typeof item !== 'object') return;

                    if (item.type === '일위대가') {
                        if (Array.isArray(item.children)) {
                            item.children.forEach(child =>
                                visit(child, groupName, groupIndex, subGroup)
                            );
                        }
                        return;
                    }

                    addItem(item, groupName, groupIndex, subGroup);
                };

                Object.entries(data).forEach(([groupKey, level1List]) => {
                    if (!Array.isArray(level1List)) return;

                    const groupIndex = Number(groupKey);
                    if (this.activeGroup !== '' && this.activeGroup !== String(groupIndex)) return;

                    const groupName = groupNames[groupIndex] || groupKey;

                    level1List.forEach(level1 => {
                        if (!Array.isArray(level1?.children)) return;

                        level1.children.forEach(item =>
                            visit(item, groupName, groupIndex, level1.name || '')
                        );
                    });
                });

                return [...grouped.values()];
            },

            get statusMessage() {
                if (!this.activeProject) return '프로젝트를 선택해 주세요.';
                if (this.costFilter === '손료' && !this.rows.length) return '손료 데이터가 없습니다.';
                return this.rows.length
                    ? `${this.costFilter || '전체'} ${this.rows.length}건`
                    : '선택한 조건에 해당하는 항목이 없습니다.';
            },

            get statusMessage() {
                if (!this.activeProject) {
                    return '프로젝트를 선택해 주세요.';
                }

                if (this.costFilter === 'hand') {
                    return '손료 데이터가 없습니다.';
                }

                if (this.rows.length) {
                    const filterLabel = {
                        item1: '재료비',
                        item2: '노무비',
                        item3: '경비'
                    }[this.costFilter] || '전체';

                    return `${filterLabel} 일위대가 ${this.rows.length}건`;
                }

                return '선택한 조건에 해당하는 일위대가 항목이 없습니다.';
            }
        };
    }
</script>
