<style>
    .unit-price-list {
        color: #333;
        font-size: 13px;
        text-align: right;
    }

    .unit-price-list .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: Arial, sans-serif;
        margin: 16px 0;

        padding: 8px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background-color: rgba(249, 249, 249, 0.9);
    }

    .unit-price-list select {

        min-width: 180px;
        padding: 5px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: white;
        font-family: inherit;
        font-size: inherit;
    }

    .unit-price-list .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 12px 0;
    }

    .unit-price-list .status {
        color: #6b7280;
        font-weight: 500;
    }

    .unit-price-list .view-options {
        display: flex;
        gap: 16px;
        margin-left: 50px;
        align-items: center;
    }

    .unit-price-list .view-options label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        color: #374151;
    }


    .unit-price-list table {
        width: 100%;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
        font-size: inherit;
    }

    .unit-price-list thead th {
        font-weight: normal;
        text-align: center;
        background-color: #f8f9fa;


        border-bottom: none;
    }

    .unit-price-list td {
        text-align: left;

        white-space: nowrap;
        color: #4b5563;
        font-style: italic;

    }

    .unit-price-list tbody td {
        padding-top: 0;
        padding-bottom: 0;
        line-height: 18px;
    }

    .unit-price-list thead th,
    .unit-price-list thead td {
        text-align: center !important;
        font-style: normal !important;

    }

    .unit-price-list .field-input {
        border: none;
        border-bottom: 1px solid #ccc;
        background: transparent;
        font-family: inherit;
        font-size: inherit;
        font-style: inherit;
        height: 18px;
        line-height: 18px;
        outline: none;
        color: #4b5563;
        padding: 0 8px;
        box-sizing: border-box;
    }

    .unit-price-list .field-input:focus {
        border-bottom: 1px solid #2563eb;
    }

    .unit-price-list .field-input[readonly] {
        border-bottom: 1px solid #e5e7eb;
        color: #4b5563;
    }

    .unit-price-list .text-center {
        text-align: center;
    }

    .unit-price-list .text-right {
        text-align: right;
    }

    .unit-price-list .text-left {
        text-align: left;
    }

    .unit-price-list .field-wide {
        width: 100%;
    }

    .unit-price-list .field-unit {
        width: 35px;
    }

    .unit-price-list .field-money {
        width: 100px;
        color: #4b5563;
    }

    .unit-price-list table.basic-view {
        table-layout: fixed;
    }

    .unit-price-list .basic-view th.col-category {
        width: 70px;
    }

    .unit-price-list .basic-view th.col-unit {
        width: 50px;
    }

    .unit-price-list .basic-view th.col-amount {
        width: 110px;
    }

    .unit-price-list .col-remark {
        width: 200px;
    }

    .unit-price-list .select-cell {
        width: 24px;
        min-width: 24px;
        padding: 0;
        text-align: center !important;
        cursor: pointer;
        user-select: none;
    }

    .unit-price-list tr.is-selected,
    .unit-price-list tr.is-selected input {
        background-color: #e8f1ff;

    }

    .unit-price-list .selected-json {
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        margin-top: 40px;
        color: #1f2937;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
        
        font-size: inherit;
    }
</style>



<div class="unit-price-list" x-data="unitPriceList()" x-init="init()" id="print-container">
    <h1>단가 목록표</h1>
    <div class="toolbar">
        <label for="unitPriceProject">프로젝트:</label>
        <select id="unitPriceProject" x-model="activeProject" @change="saveActiveProject()">
            <option value="">프로젝트 선택</option>
            <template x-for="project in projectList" :key="project">
                <option :value="project" x-text="project"></option>
            </template>
        </select>

        <label for="unitPriceGroup">대분류:</label>
        <select id="unitPriceGroup" x-model="activeGroup">
            <option value="">전체</option>
            <template x-for="(group, index) in groupList" :key="index">
                <option :value="String(index)" x-text="group"></option>
            </template>
        </select>

        <label for="unitPriceCost">비용 구분:</label>
        <select id="unitPriceCost" x-model="costFilter">
            <option value="">전체</option>
            <option value="자재">자재</option>
            <option value="노무">노무</option>
            <option value="경비">경비</option>
            <option value="도급자관급">도급자관급</option>
            <option value="손료">손료</option>
        </select>
    </div>

    <div class="status-bar">
        <div class="status" x-text="statusMessage"></div>
        <div class="view-options" x-show="rows.length > 0">
            <label>
                <input type="radio" name="unitPriceViewMode" value="option1" x-model="viewMode"> 기본사항
            </label>
            <label>
                <input type="radio" name="unitPriceViewMode" value="option2" x-model="viewMode"> 단가/비고
            </label>
        </div>
    </div>

    <div x-show="rows.length > 0">
        <table :class="{ 'basic-view': viewMode === 'option1' }">
            <thead>
                <tr>
                    <template x-for="col in columns" :key="col.key">
                        <th :class="{
                                'col-remark': col.key === '비고',
                                'select-cell': col.kind === 'selector',
                                'col-category': col.kind === 'category',
                                'col-unit': col.key === '단위',
                                'col-amount': col.key === '합계'
                            }"
                            x-text="col.label"></th>
                    </template>
                </tr>
            </thead>

            <tbody>
                <template x-for="row in rows" :key="row.key">
                    <tr :class="{ 'is-selected': isSelected(row) }">
                        <template x-for="col in columns" :key="col.key">
                            <td :class="{
                                'col-remark': col.key === '비고',
                                'select-cell': col.kind === 'selector'
                            }" :role="col.kind === 'selector' ? 'button' : null"
                                :tabindex="col.kind === 'selector' ? 0 : null"
                                :aria-pressed="col.kind === 'selector' ? isSelected(row) : null"
                                @click="col.kind === 'selector' && toggleRow(row)"
                                @keydown.enter.space.prevent="col.kind === 'selector' && toggleRow(row)">
                                <template x-if="col.kind === 'input'">
                                    <input type="text" :class="col.inputClass" :value="getRowValue(row, col)"
                                        :readonly="col.readonly"
                                        @input="!col.readonly && updateGroupedField(row, col, $event)">
                                </template>
                                <template x-if="col.kind !== 'input' && col.kind !== 'selector'">
                                    <span x-text="getColumnValue(row, col)"></span>
                                </template>
                            </td>
                        </template>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <pre class="selected-json" x-text="selectedJson"></pre>
</div>

<script>
    function unitPriceList() {
        return {
            projectList: [],
            activeProject: '',
            activeGroup: '',
            costFilter: '',
            costData: {},
            viewMode: 'option1',
            jsonExcludeKeys: ['children', 'showCost', 'selected', '수량', '재료비', '노무비', '경비', '합계'],
            selectedRowKey: '',

            init() {
                const rawCost = localStorage.getItem('cost');
                try {
                    this.costData = rawCost ? JSON.parse(rawCost) || {} : {};
                } catch (e) {
                    console.error('COST 로컬스토리지 파싱 실패:', e);
                    this.costData = {};
                }

                const option = JSON.parse(localStorage.getItem('option') || '{}');
                this.projectList = Array.isArray(option.projectList)
                    ? option.projectList
                    : Object.keys(this.costData);

                this.activeProject = option.activeProject || '';
                if (!this.projectList.includes(this.activeProject)) {
                    this.activeProject = this.projectList[0] || '';
                }
            },

            get groupList() {
                return this.costData?.[this.activeProject]?.옵션?.그룹명 || [];
            },

            saveActiveProject() {
                this.selectedRowKey = '';
                const option = JSON.parse(localStorage.getItem('option') || '{}');
                option.activeProject = this.activeProject;
                localStorage.setItem('option', JSON.stringify(option));
                this.activeGroup = '';
            },

            saveData() {
                localStorage.setItem('cost', JSON.stringify(this.costData));
            },

            isSelected(row) {
                return this.selectedRowKey === row.key;
            },

            toggleRow(row) {
                this.selectedRowKey = this.isSelected(row) ? '' : row.key;
            },

            // 아이템의 특정 필드 값을 가져오는 함수
            itemValue(item, key) {
                return item?.[key] ?? '';
            },

            numberValue(value) {
                return Number(String(value ?? '').replace(/,/g, '').trim()) || 0;
            },

            formatNumber(value) {
                return value ? value.toLocaleString('ko-KR') : '0';
            },

            getRowValue(row, column) {
                if (column.key === '합계') {
                    const total = row.items.reduce(
                        (sum, item) => sum + this.numberValue(item.합계),
                        0
                    );
                    return this.formatNumber(total);
                }
                return this.itemValue(row.item, column.key);
            },

            getColumnValue(row, column) {
                if (column.kind === 'category') return row.category;
                return '';
            },


            updateItemField(item, column, event) {
                const value = event.target.value;

                if (column.type === 'text') {
                    item[column.key] = value;
                } else {
                    const rawValue = value.replace(/,/g, '');
                    item[column.key] = rawValue === '' || !Number.isFinite(Number(rawValue))
                        ? ''
                        : Number(rawValue).toLocaleString('ko-KR');
                    event.target.value = item[column.key];
                }

                if (['재료비단가', '노무비단가', '경비단가'].includes(column.key)) {
                    const quantity = this.numberValue(item.수량);
                    const material = this.numberValue(item.재료비단가);
                    const labor = this.numberValue(item.노무비단가);
                    const expense = this.numberValue(item.경비단가);
                    const materialAmount = material * quantity;
                    const laborAmount = labor * quantity;
                    const expenseAmount = expense * quantity;

                    item.단가합계 = this.formatNumber(material + labor + expense);
                    item.재료비 = this.formatNumber(materialAmount);
                    item.노무비 = this.formatNumber(laborAmount);
                    item.경비 = this.formatNumber(expenseAmount);
                    item.합계 = this.formatNumber(materialAmount + laborAmount + expenseAmount);
                }
            },

            updateGroupedField(row, column, event) {
                row.items.forEach(item => this.updateItemField(item, column, event));
                this.saveData();
            },

            extractAllItems(data, path = []) {
                if (!data) return [];

                if (Array.isArray(data)) {
                    return data.flatMap((item, index) =>
                        this.extractAllItems(item, [...path, index])
                    );
                }

                if (typeof data !== 'object') return [];

                const items = [{ item: data, path }];
                if (Array.isArray(data.children)) {
                    items.push(...this.extractAllItems(data.children, path));
                }
                return items;
            },

            get columns() {
                const option1 = [
                    { label: '품명', key: '품목', type: 'text', readonly: false, inputClass: 'field-input field-wide text-left' },
                    { label: '규격', key: '규격', type: 'text', readonly: false, inputClass: 'field-input field-wide text-left' },
                    { label: '단위', key: '단위', type: 'text', readonly: false, inputClass: 'field-input field-unit text-center' },
                    { label: '금액', key: '합계', type: 'number', readonly: true, inputClass: 'field-input field-money text-right' },
                ];

                const option2 = [
                    { label: '재료비', key: '재료비단가', type: 'number', readonly: false, inputClass: 'field-input field-money text-right' },
                    { label: '노무비', key: '노무비단가', type: 'number', readonly: false, inputClass: 'field-input field-money text-right' },
                    { label: '경비', key: '경비단가', type: 'number', readonly: false, inputClass: 'field-input field-money text-right' },
                    { label: '합계', key: '단가합계', type: 'number', readonly: true, inputClass: 'field-input field-money text-right' },
                    { label: '비고', key: '비고', type: 'text', readonly: false, inputClass: 'field-input field-wide text-left' }
                ];

                const fields = this.viewMode === 'option2' ? option2 : option1;
                return [
                    { label: '', key: 'selector', kind: 'selector' },
                    { label: '', key: 'category', kind: 'category' },
                    ...fields.map(column => ({
                        ...column,
                        kind: column.kind || 'input'
                    }))
                ];
            },

            get rows() {
                if (!this.activeProject) return [];

                const project = this.costData?.[this.activeProject];
                const data = project?.공종별내역서;
                if (!data || typeof data !== 'object') return [];

                const grouped = new Map();
                const normalizeText = value => String(value ?? '').trim();

                const addItem = ({ item, path }) => {
                    const groupIndex = Number(path[0]);
                    if (this.activeGroup !== '' && this.activeGroup !== String(groupIndex)) return;

                    const type = String(item?.type ?? '').trim();
                    if (!type && Array.isArray(item?.children)) return;

                    const category = type || '미분류';
                    if (this.costFilter && type !== this.costFilter) return;
                    if (item?.type === '일위대가') return;

                    const key = JSON.stringify([
                        category,
                        normalizeText(this.itemValue(item, '품목')),
                        normalizeText(this.itemValue(item, '규격')),
                        normalizeText(this.itemValue(item, '단위')),
                        this.numberValue(item.재료비단가),
                        this.numberValue(item.노무비단가),
                        this.numberValue(item.경비단가)
                    ]);

                    let row = grouped.get(key);
                    if (!row) {
                        row = {
                            key: JSON.stringify(path),
                            category,
                            item,
                            items: []
                        };
                        grouped.set(key, row);
                    }

                    row.items.push(item);
                };

                this.extractAllItems(data).forEach(addItem);

                return [...grouped.values()];
            },

            get selectedJson() {
                const selectedRow = this.rows.find(row => this.isSelected(row));
                if (!selectedRow) return '';
                const visibleItem = Object.fromEntries(
                    Object.entries(selectedRow.item)
                        .filter(([key]) => !this.jsonExcludeKeys.includes(key))
                );
                return JSON.stringify(visibleItem, null, 2);
            },

            get statusMessage() {
                if (!this.activeProject) return '프로젝트를 선택해 주세요.';
                return this.rows.length
                    ? `${this.costFilter || '전체'} 단가 ${this.rows.length}건`
                    : '선택한 조건에 해당하는 단가 항목이 없습니다.';
            }
        };
    }
</script>
