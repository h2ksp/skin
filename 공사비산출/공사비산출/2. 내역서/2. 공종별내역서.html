<style>
    /* 표 스타일 (.table-container 내부만 적용) */
    .table-container {
        overflow-x: auto;
        margin-top: 15px;

    }

    /* 클릭 가능한 행 스타일 (마우스 호버 효과) */
    .table-container tr.clickable-row {
        cursor: pointer;
    }

    /* 마우스를 올렸을 때 연한 하늘색/배경 변경 */
    .table-container tr.clickable-row:hover {
        background-color: #e0f2fe !important;
        /* 약간 밝은 파란색으로 선택 효과 */
    }

    /* .table-container 안의 table */
    .table-container table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
    }

    /* .table-container 안의 th, td */
    .table-container th,
    .table-container td {
        border-bottom: 1px solid #ddd;
        padding-left: 8px;
    }

    /* .table-container 내부의 text-right 클래스에 우측 정렬 적용 */
    .table-container .text-right {
        text-align: right;
    }

    .mText {
        font-size: 16px;
        font-weight: 700;
        color: #333333;
        font-style: italic;
        padding-left: 10px;
        text-align: left;
    }

    .money-box {
        margin-top: 10px;
    }

    .mText2 {
        border-collapse: collapse;
        font-style: italic;
        font-size: 15px;
    }

    .mText2 td {
        padding: 1px 4px;
        line-height: 1.2;
    }

    .mText2 .align-right {
        width: 100px;
        text-align: right;
    }

    /* 마지막 합계 줄 위쪽 테두리랑 볼드 처리 */
    .mText2 .sum-row td {
        border-top: 1px solid #000;
        padding-top: 3px;
    }

    button {
        cursor: pointer;
    }

    /* 1. 모든 인풋 박스 기본 스타일 (밑줄 형태 + 폰트 설정) */
    #print-container input[type="text"],
    #print-container input[type="number"] {
        font-size: 14px;

        /* 글자 색상 */
        font-style: italic;
        /* 기울임꼴 */
        padding-left: 9px;
        /* 왼쪽 여백 33px */
        text-align: left;

        background: transparent;
        border: none;
        border-bottom: 1px solid #aaa;
        outline: none;
        border-radius: 0;
        /* 기본 모서리 둥글기 제거 */
        box-sizing: border-box;
    }

    /* 포커스(클릭) 시 밑줄 색상 강조 */
    #print-container input[type="text"]:focus,
    #print-container input[type="number"]:focus {
        border-bottom: 1px solid #6c0a0a;
    }

    /* 단위/수량 등 중앙 정렬이 필요한 인풋 처리 */
    #print-container input.text-center {
        text-align: center;
    }

    /* 숫자 입력 화살표(스핀 버튼) 깔끔하게 제거 */
    #print-container input[type="number"]::-webkit-outer-spin-button,
    #print-container input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }


    /* 2. placeholder 힌트 글자 스타일 */
    #print-container input::placeholder {
        color: #d1d5db;
        /* 연한 회색 */
        font-size: 13px;
        font-weight: 400;
        font-style: italic;
    }

    /* 3. 비활성화 링크 스타일 */
    #print-container a.disabled {
        color: #ccc !important;
        cursor: default !important;
        text-decoration: none;
        pointer-events: none;
    }

    /* 4. 콤보박스(select) 투명 스타일 */
    #print-container select {
        border: 1px solid transparent;
        background: transparent;
        outline: none;
        font-size: 12px;
    }

    /* 1. 기본 span 텍스트 스타일 */
    #print-container span {
        font-size: 13px;
        font-weight: 500;
        color: #4b5563;
        /* 가독성 좋은 다크 회색 */
        line-height: 1.4;
        user-select: none;
        /* 선택 영역 방지 (UI 깔끔하게) */
    }

    /* 2. 라벨 영역의 좌측/우측 span (단가:, 재료비:, 단위 등) */
    #print-container label>span {
        color: #374151;
        /* 일반 텍스트보다 살짝 진한 색상 */
        font-size: 13px;
    }

    /* 3. 트리 구조 화살표 및 기호 텍스트 (┕ 등) */
    #print-container .tree-symbol,
    #print-container span:contains("┕") {
        color: #9ca3af;
        /* 옅은 회색으로 주 보조 구분선 느낌 */
        font-weight: normal;
    }

    /* 4. 일반 텍스트 (li, div 등의 기본 텍스트) */
    #print-container {
        color: #333333;
        font-size: 13px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 5. 강조용 span (필요시 class="fw-bold" 적용) */
    #print-container span.fw-bold {
        font-weight: 700;
        color: #111827;
    }

    /* 6. 연한 안내용 span (필요시 class="text-muted" 적용) */
    #print-container span.text-muted {
        color: #9ca3af;
        font-size: 12px;
    }
</style>

<script>
    function appData() {
        const option = JSON.parse(localStorage.getItem('option')) || {};
        const activeProject = option?.activeProject || '';
        const store = JSON.parse(localStorage.getItem('cost')) || {}

        return {
            init() {
                // 1. 뒤로 가기로 돌아올 때 실행될 이벤트 리스너 등록
                window.addEventListener('pageshow', (event) => {
                    if (event.persisted || (window.performance && window.performance.getEntriesByType("navigation")[0]?.type === "back_forward")) {

                        // 2. 로컬스토리지에서 최신 cost 데이터를 다시 싹 긁어옴
                        const freshStore = JSON.parse(localStorage.getItem('cost')) || {};
                        this.store = freshStore;

                        // 3. 현재 활성화된 프로젝트 기준으로 화면에 쓰이는 목록들도 최신화!
                        if (this.activeProject && freshStore[this.activeProject]) {
                            this.groupList = freshStore[this.activeProject]?.옵션?.그룹명 || [];
                            this.subGroupList = freshStore[this.activeProject]?.공종별내역서 || {};
                        }

                        console.log("새로고침 없이 최신 데이터 갱신 완료!");
                    }
                });

            },


            activeProject: activeProject,
            projectList: option?.projectList || [],
            store: store,
            showMoney: false, // 처음에는 숨겨져 있게 시작

            // 현재 프로젝트의 그룹 목록 가져오기
            groupList: (activeProject && store[activeProject]?.옵션?.그룹명) || [],
            activeGroup: (activeProject && store[activeProject]?.옵션?.activeGroup !== undefined)
                ? store[activeProject].옵션.activeGroup : '',

            // 공종별 내역서 데이터 (없으면 빈 객체)
            subGroupList: (activeProject && store[activeProject]?.공종별내역서) || {},

            // [역할] 금액 영역을 토글하면서 전체 공종 합계도 같이 싹 계산하는 함수
            moneyView() {
                this.showMoney = !this.showMoney;

                const getNum = (val) => Number(String(val || 0).replace(/,/g, '')) || 0;

                // 1단계: 대그룹 리스트 순회 (forEach)
                this.subGroupList.forEach(groupList => {
                    if (!groupList) return;

                    // 2단계: 각 공종 그룹 순회
                    groupList.forEach(group => {
                        if (!group || !group.children) return;

                        // 3단계: reduce로 자재들의 재료비, 노무비, 경비를 한 번에 싹 합산
                        const totals = group.children.reduce((acc, c) => {
                            acc.mtrl += getNum(c.재료비 || c.재료비단가 || c.prce);
                            acc.lbr += getNum(c.노무비 || c.노무비단가);
                            acc.exp += getNum(c.경비 || c.경비단가);
                            return acc;
                        }, { mtrl: 0, lbr: 0, exp: 0 });

                        const sumTotal = totals.mtrl + totals.lbr + totals.exp;

                        // 4단계: 포맷팅해서 공종 객체에 바로 꽂아넣기
                        group.재료비 = totals.mtrl ? totals.mtrl.toLocaleString('ko-KR') : '0';
                        group.노무비 = totals.lbr ? totals.lbr.toLocaleString('ko-KR') : '0';
                        group.경비 = totals.exp ? totals.exp.toLocaleString('ko-KR') : '0';
                        group.합계 = sumTotal ? sumTotal.toLocaleString('ko-KR') : '0';
                    });
                });
                this.saveToStore();
            },

            editMode() {
                window.location.href = 'https://study-with-words.blogspot.com/2026/11/blog-post_12.html?group=group3&sub=sub1';
            },

            saveActiveProject() {
                option.activeProject = this.activeProject;
                localStorage.setItem('option', JSON.stringify(option));

                if (this.activeProject && store[this.activeProject]?.옵션?.그룹명) {
                    this.groupList = store[this.activeProject].옵션.그룹명;
                    this.subGroupList = store[this.activeProject].공종별내역서 || {};
                } else {
                    this.groupList = [];
                    this.subGroupList = {};
                }
                this.activeGroup = '';
            },

            // [역할] 현재 변경된 데이터를 스토어에 반영하고 store.save()를 호출해 로컬스토리지에 저장하는 공통 함수
            saveToStore() {
                if (store[this.activeProject]) {
                    if (!store[this.activeProject].옵션) {
                        store[this.activeProject].옵션 = {};
                    }
                    store[this.activeProject].옵션.그룹명 = this.groupList;
                    store[this.activeProject].옵션.activeGroup = this.activeGroup;
                    store[this.activeProject].공종별내역서 = this.subGroupList;

                    localStorage.setItem('cost', JSON.stringify(store));
                    localStorage.setItem('option', JSON.stringify(option));
                }
            },

            // [역할] 타입 변경 시 콘솔 로그를 남기고 스토어에 저장하는 함수
            handleTypeChange(lvl2) {
                console.log("선택된 fg타입:", lvl2);
                this.saveToStore();
            },

            toggleLevel2Selection(gIndex, l1Index, l2Index) {
                const target = this.subGroupList[gIndex]?.[l1Index]?.children?.[l2Index];
                if (!target) return;

                const wasSelected = !!target.selected;
                this.subGroupList.forEach(group => {
                    group?.forEach(level1 => {
                        level1.children?.forEach(level2 => {
                            level2.selected = false;
                        });
                    });
                });
                target.selected = !wasSelected;
            },

            // [역할] 활성 그룹 저장 및 하단 바(Bottom Bar)의 UI 표시 여부를 제어하는 함수
            saveActiveGroup() {
                option.activeGroup = this.activeGroup;
                const bottomBar = this.$refs.bottomBar;

                if (bottomBar) {
                    if (!this.activeGroup && this.activeGroup !== 0) {
                        bottomBar.style.visibility = 'hidden';
                        bottomBar.style.opacity = '0';
                        bottomBar.style.pointerEvents = 'none';
                    } else {
                        bottomBar.style.visibility = 'visible';
                        bottomBar.style.opacity = '1';
                        bottomBar.style.pointerEvents = 'auto';
                    }
                }
                this.saveToStore();
            },

            calcItems(lvl2, field, event) {
                this.showMoney = false;
                // 1. 입력된 값에서 콤마 제거하고 숫자만 추출
                let rawVal = String(event.target.value).replace(/,/g, '');

                // 2. 숫자가 아니면 비우고, 숫자면 천단위 콤마 포맷으로 데이터에만 반영
                if (isNaN(rawVal) || rawVal === '') {
                    lvl2[field] = '';
                } else {
                    // 💡 event.target.value는 건드리지 않고, 알파인 데이터(lvl2[field])만 갱신!
                    lvl2[field] = Number(rawVal).toLocaleString('ko-KR');
                }

                const getNum = (val) => Number(String(val || 0).replace(/,/g, '')) || 0;

                const qty = getNum(lvl2.수량);
                const i1 = getNum(lvl2.재료비단가);
                const i2 = getNum(lvl2.노무비단가);
                const i3 = getNum(lvl2.경비단가);

                const item4Val = i1 + i2 + i3;
                const item5Val = i1 * qty;
                const item6Val = i2 * qty;
                const item7Val = i3 * qty;
                const item8Val = item5Val + item6Val + item7Val;

                // 3. 결과값들도 콤마 포맷으로 데이터에 반영
                lvl2.단가합계 = item4Val ? item4Val.toLocaleString('ko-KR') : '0';
                lvl2.재료비 = item5Val ? item5Val.toLocaleString('ko-KR') : '0';
                lvl2.노무비 = item6Val ? item6Val.toLocaleString('ko-KR') : '0';
                lvl2.경비 = item7Val ? item7Val.toLocaleString('ko-KR') : '0';
                lvl2.합계 = item8Val ? item8Val.toLocaleString('ko-KR') : '0';

                this.saveToStore();
            },

            // [역할] 숫자에 3자리마다 콤마(,)를 찍어주는 포맷터 함수
            formatNumber(val) {
                if (val === null || val === undefined || val === '') return '0';
                return Number(val).toLocaleString('ko-KR');
            },

            // [역할] 1차 항목을 추가하고 하위 합계 계산용 get 속성을 부여하는 함수
            addLevel1(gIndex) {
                if (!this.subGroupList[gIndex]) {
                    this.subGroupList[gIndex] = [];
                }

                this.subGroupList[gIndex].push({
                    재료비: '',
                    노무비: '',
                    경비: '',
                    합계: '',
                    name: '',
                    children: [],
                });

                this.saveToStore();
            },

            // [역할] 특정 1차 항목 아래에 새로운 2차(자식) 항목을 추가하는 함수
            addLevel2(gIndex, l1Index) {
                if (!this.subGroupList[gIndex] || !this.subGroupList[gIndex][l1Index]) return;
                if (!this.subGroupList[gIndex][l1Index].children) {
                    this.subGroupList[gIndex][l1Index].children = [];
                }

                this.subGroupList[gIndex][l1Index].children.push({
                    showCost: false,
                    type: '자재',
                    품목: '',
                    규격: '',
                    단위: '',
                    수량: 0,
                    재료비단가: '',
                    재료비: '',
                    노무비단가: '',
                    노무비: 0,
                    경비단가: '',
                    경비: 0,
                    단가합계: 0,
                    합계: 0,
                    비고: ''
                });

                this.saveToStore();
            },

            // [역할] 특정 2차 항목을 삭제하는 함수
            deleteLevel2(gIndex, l1Index, l2Index) {
                if (!this.subGroupList[gIndex] || !this.subGroupList[gIndex][l1Index]) return;
                this.subGroupList[gIndex][l1Index].children.splice(l2Index, 1);
                this.saveToStore();
            },

            // [역할] 확인 팝업을 띄운 뒤 특정 1차 항목(하위 품목 포함)을 삭제하는 함수
            deleteLevel1(gIndex, l1Index) {
                if (!this.subGroupList[gIndex]) return;
                const targetName = this.subGroupList[gIndex][l1Index]?.name || '1차 하위 항목';
                if (confirm(`'${targetName}' 항목을 삭제하겠습니까?\n(하위 품목도 함께 삭제됩니다)`)) {
                    this.subGroupList[gIndex].splice(l1Index, 1);
                    this.saveToStore();
                }
            },

            // [역할] 그룹의 순서를 위로 한 칸 올리는 함수
            moveUpGroup(gIndex) {
                if (gIndex <= 0) return;
                const tempG = this.groupList[gIndex];
                this.groupList[gIndex] = this.groupList[gIndex - 1];
                this.groupList[gIndex - 1] = tempG;

                const tempSub = this.subGroupList[gIndex];
                this.subGroupList[gIndex] = this.subGroupList[gIndex - 1];
                this.subGroupList[gIndex - 1] = tempSub;

                this.saveToStore();
            },

            // [역할] 그룹의 순서를 아래로 한 칸 내리는 함수
            moveDownGroup(gIndex) {
                if (gIndex >= this.groupList.length - 1) return;
                const tempG = this.groupList[gIndex];
                this.groupList[gIndex] = this.groupList[gIndex + 1];
                this.groupList[gIndex + 1] = tempG;

                const tempSub = this.subGroupList[gIndex];
                this.subGroupList[gIndex] = this.subGroupList[gIndex + 1];
                this.subGroupList[gIndex + 1] = tempSub;

                this.saveToStore();
            },

            // [역할] 1차 항목의 순서를 위로 한 칸 올리는 함수
            moveUpLevel1(gIndex, l1Index) {
                if (l1Index <= 0) return;
                const targetList = this.subGroupList[gIndex];
                const temp = targetList[l1Index];
                targetList[l1Index] = targetList[l1Index - 1];
                targetList[l1Index - 1] = temp;
                this.saveToStore();
            },

            // [역할] 1차 항목의 순서를 아래로 한 칸 내리는 함수
            moveDownLevel1(gIndex, l1Index) {
                const targetList = this.subGroupList[gIndex];
                if (l1Index >= targetList.length - 1) return;
                const temp = targetList[l1Index];
                targetList[l1Index] = targetList[l1Index + 1];
                targetList[l1Index + 1] = temp;
                this.saveToStore();
            },

            // [역할] 2차 항목의 순서를 위로 한 칸 올리는 함수
            moveUpLevel2(gIndex, l1Index, l2Index) {
                if (l2Index <= 0) return;
                const targetList = this.subGroupList[gIndex][l1Index].children;
                const temp = targetList[l2Index];
                targetList[l2Index] = targetList[l2Index - 1];
                targetList[l2Index - 1] = temp;
                this.saveToStore();
            },

            // [역할] 2차 항목의 순서를 아래로 한 칸 내리는 함수
            moveDownLevel2(gIndex, l1Index, l2Index) {
                const targetList = this.subGroupList[gIndex][l1Index].children;
                if (l2Index >= targetList.length - 1) return;
                const temp = targetList[l2Index];
                targetList[l2Index] = targetList[l2Index + 1];
                targetList[l2Index + 1] = temp;
                this.saveToStore();
            },


            // [역할] 프롬프트 창을 띄워 공종명 목록을 콤마(,) 기준으로 수정하는 함수
            editGroups() {
                const currentStr = this.groupList.join(', ');
                const userInput = prompt('공종명 목록을 콤마(,)로 구분해서 수정해 주세요:', currentStr);
                if (userInput !== null) {
                    const newList = userInput.split(',')
                        .map(item => item.trim())
                        .filter(item => item.length > 0);
                    this.groupList = newList;
                    this.activeGroup = '';
                    this.saveToStore();
                }
            }
        };
    }
</script>
