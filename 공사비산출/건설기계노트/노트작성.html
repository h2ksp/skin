<div x-data="sketchNoteApp()">
    <div>
        <input type="text" x-model="inputQuery" @keyup="handleKeyup" @keydown.enter="handleEnterKey"
            placeholder="ID 입력 후 스페이스 2번 또는 엔터 (예: 1)">
    </div>

    <hr>

    <div>
        <template x-for="(item, index) in items">
            <div>
                <div>
                    <span x-text="'ID: ' + item.id"></span> |
                    <span x-text="'품명: ' + item.품명"></span> |
                    <span x-text="'규격: ' + item.규격"></span> |
                    <span x-text="'수량: ' + item.unit"></span>

                    <span>
                        <template x-for="btn in item.buttons">
                            <a :href="getLinkWithParams(btn.link)" x-text="btn.name"></a>
                        </template>

                        <button @click="toggleOpen(item)" x-text="item.isOpen ? '접기' : '상세'"></button>
                        <button @click="deleteItem(index)">삭제</button>
                    </span>
                </div>

                <div x-show="item.isOpen">
                    <template x-for="line in item.detailLines">
                        <div x-text="line"></div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</div>

            init() {
                // 1. 페이지가 처음 뜰 때 모드 설정 및 데이터 로드
                const urlParams = new URLSearchParams(window.location.search);
                const siteParam = urlParams.get('sub');
                this.currentSiteMode = (siteParam === 'sub3') ? 'site' : 'cost';

                this.loadFromLocalStorage();

                // 2. 다른 링크로 갔다가 뒤로가기로 돌아왔을 때(캐시 복원 시) 최신 데이터를 강제로 다시 로드
                window.addEventListener('pageshow', (event) => {
                    // 브라우저 캐시(BFCache)에서 살아 돌아왔거나 페이지가 다시 보일 때
                    if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                        // 주소창의 쿼리스트링이 혹시 바뀌었을 수도 있으니 모드도 다시 체크
                        const currentParams = new URLSearchParams(window.location.search);
                        const currentSiteParam = currentParams.get('site');

                        if (currentSiteParam === 'cost' || currentSiteParam === 'site') {
                            this.currentSiteMode = currentSiteParam;
                        }

                        // 최신 로컬 스토리지 데이터를 다시 불러와서 화면 갱신!
                        this.loadFromLocalStorage();
                    }
                });
            },

            loadFromLocalStorage() {
                switch (this.currentSiteMode) {
                    case 'site': {
                        let parsedSite = JSON.parse(localStorage.getItem('site') || '{}');

                        parsedSite['건설기계'] ??= {};
                        parsedSite['건설기계']['산출노트'] ??= [];

                        localStorage.setItem('site', JSON.stringify(parsedSite));
                        this.items = parsedSite['건설기계']['산출노트'];
                        break;
                    }
                    case 'cost': {
                        const activeProjectKey = localStorage.getItem('activeproject') || 'projectA';
                        let parsedCost = JSON.parse(localStorage.getItem('cost') || '{}');

                        if (!parsedCost[activeProjectKey]) parsedCost[activeProjectKey] = {};
                        if (!parsedCost[activeProjectKey]['산출노트']) parsedCost[activeProjectKey]['산출노트'] = {};
                        if (!parsedCost[activeProjectKey]['산출노트'][this.currentNoteId]) {
                            parsedCost[activeProjectKey]['산출노트'][this.currentNoteId] = [];
                        }

                        localStorage.setItem('cost', JSON.stringify(parsedCost));
                        this.items = parsedCost[activeProjectKey]['산출노트'][this.currentNoteId];
                        break;
                    }
                    default:
                        break;
                }
            },

            saveToLocalStorage() {
                switch (this.currentSiteMode) {
                    case 'site': {
                        let parsedSite = JSON.parse(localStorage.getItem('site') || '{}');

                        parsedSite['건설기계'] ??= {};
                        parsedSite['건설기계']['산출노트'] = this.items;

                        localStorage.setItem('site', JSON.stringify(parsedSite));
                        break;
                    }
                    case 'cost': {
                        const activeProjectKey = localStorage.getItem('activeproject') || 'projectA';
                        let parsedCost = JSON.parse(localStorage.getItem('cost') || '{}');

                        if (!parsedCost[activeProjectKey]) parsedCost[activeProjectKey] = {};
                        if (!parsedCost[activeProjectKey]['산출노트']) parsedCost[activeProjectKey]['산출노트'] = {};

                        parsedCost[activeProjectKey]['산출노트'][this.currentNoteId] = this.items;
                        localStorage.setItem('cost', JSON.stringify(parsedCost));
                        break;
                    }
                    default:
                        break;
                }
            },

            handleKeyup(e) {
                if (e.key === ' ') {
                    const val = this.inputQuery;
                    if (val.endsWith('  ')) {
                        this.processRegistration();
                    }
                }
            },

            handleEnterKey() {
                this.processRegistration();
            },

            processRegistration() {
                const queryId = this.inputQuery.trim();
                const matchedMaster = this.validMasterItems.find(m => String(m.id).trim() === queryId);

                if (!matchedMaster) {
                    this.inputQuery = '';
                    return;
                }

                this.items.push(JSON.parse(JSON.stringify(matchedMaster)));

                this.inputQuery = '';
                this.saveToLocalStorage();
            },

            deleteItem(index) {
                if (confirm('삭제하시겠습니까?')) {
                    this.items.splice(index, 1);
                    this.saveToLocalStorage();
                }
            },

            // 자세히/접기 버튼을 누를 때 상태를 반전시키고 바로 로컬 스토리지에 저장
            toggleOpen(item) {
                item.isOpen = !item.isOpen;

                this.saveToLocalStorage();
            },

            getLinkWithParams(link) {
                // SITE 값이 'cost'일 경우만 파라미터 붙이되, 문자열로 직접 더해서 대소문자 변조 방지
                if (this.currentSiteMode === 'cost') {
                    // 이미 쿼리스트링(?)이 포함된 주소인지 확인 후 처리
                    const separator = link.includes('?') ? '&' : '?';
                    return `${link}${separator}site=cost`;
                }

                return link;
            }
        }));
