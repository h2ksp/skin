<script>
    document.addEventListener('alpine:init', () => {
        async function sendItemToEstimate(item) {
            if (typeof BroadcastChannel === 'undefined' || !globalThis.crypto?.randomUUID) {
                throw new Error('이 브라우저에서는 화면 간 항목 추가를 지원하지 않습니다.');
            }
            const channel = new BroadcastChannel('cost-estimate-add');
            try {
                const requestId = crypto.randomUUID();
                const targets = new Set();
                channel.onmessage = event => {
                    if (event.data?.type === 'available' && event.data.requestId === requestId) {
                        targets.add(event.data.targetId);
                    }
                };
                channel.postMessage({ type: 'discover', requestId });
                await new Promise(resolve => setTimeout(resolve, 500));
                if (!targets.size) throw new Error('항목추가 화면을 열고 프로젝트와 공종그룹을 선택해 주세요.');
                if (targets.size > 1) throw new Error('항목추가 화면이 여러 개 열려 있습니다. 추가할 화면 하나만 남겨 주세요.');
                const targetId = [...targets][0];
                const response = await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('추가 결과를 확인하지 못했습니다. 다시 시도하기 전에 내역서를 확인해 주세요.')), 5000);
                    channel.onmessage = event => {
                        if (event.data?.type !== 'result' || event.data.requestId !== requestId || event.data.targetId !== targetId) return;
                        clearTimeout(timeout);
                        resolve(event.data);
                    };
                    try {
                        channel.postMessage({ type: 'add', requestId, targetId, item: JSON.parse(JSON.stringify(item)) });
                    } catch (error) {
                        clearTimeout(timeout);
                        reject(error);
                    }
                });
                if (!response.success) throw new Error(response.error);
            } finally {
                channel.close();
            }
        }

        const categories = ['토목', '건축', '기계', '전기', '통신'];
        const resultModes = [
            {
                id: 'basic', label: '기본',
                columns: [
                    { key: '품명', label: '품명' },
                    { key: '규격', label: '규격' },
                    { key: '단위', label: '단위', class: 'center' },
                    { key: '합계', label: '금액', class: 'number', number: true },


                ]
            },
            {
                id: 'extra', label: '추가정보',
                columns: [
                    { key: '일위대가코드', label: '일위대가코드' },
                    { key: '재료비', label: '재료비 단가', class: 'number', number: true },
                    { key: '노무비', label: '노무비 단가', class: 'number', number: true },
                    { key: '경비', label: '경비 단가', class: 'number', number: true },
                    { key: '비고', label: '비고' }
                ]
            }
        ];

        const detailColumns = [
            { key: '자원구분', label: '구분', class: 'center' },
            { key: '품명', label: '품명' },
            { key: '규격', label: '규격' },
            { key: '단위', label: '단위', class: 'center' },
            { key: '재료비', label: '재료비 단가', class: 'number', number: true },
            { key: '노무비', label: '노무비 단가', class: 'number', number: true },
            { key: '경비', label: '경비 단가', class: 'number', number: true },
        ];

        const detailJsonExcludedKeys = [
            '계산제외', '손료코드군', '손료계산비목구분',
            '손료결과비목구분', '손료적용요율', '비고', '기타'
        ];

        Alpine.data('standardEstimateSearch', () => ({
            resultModes,
            detailColumns,
            categories,
            selectedCategory: '전체',
            query: '',
            showHelp: false,
            resultMode: 'basic',
            statusMessage: '데이터 로딩 중...',
            loading: false,
            allItems: [],
            filteredItems: [],
            pageSize: 50,
            currentPage: 1,
            openIndex: null,
            openDetailIndex: null,
            selectedIndex: null,
            requestId: 0,
            sendingToEstimate: false,

            init() {
                this.loadData();
            },

            openPopup() {
                const url = new URL(window.location.href);
                url.searchParams.set('estimatePopup', '1');
                const popup = window.open(url.href, '_blank', 'popup=yes,width=1200,height=800');
                if (!popup) {
                    alert('팝업이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요.');
                    return;
                }
                popup.opener = null;
            },

            get totalPages() {
                return Math.ceil(this.filteredItems.length / this.pageSize);
            },

            get currentColumns() {
                const columns = this.resultModes.find(mode => mode.id === this.resultMode).columns;
                return this.selectedCategory === '전체'
                    ? [{ key: '_estimateCategory', label: '분류', class: 'center' }, ...columns]
                    : columns;
            },

            get selectedItem() {
                return this.selectedIndex === null ? null : this.filteredItems[this.selectedIndex] ?? null;
            },

            get pageStartIndex() {
                return (this.currentPage - 1) * this.pageSize;
            },

            get paginatedItems() {
                return this.filteredItems.slice(this.pageStartIndex, this.pageStartIndex + this.pageSize);
            },

            async loadData() {
                const requestId = ++this.requestId;
                const selectedCategories = this.selectedCategory === '전체'
                    ? this.categories
                    : [this.selectedCategory];
                this.loading = true;
                this.statusMessage = '데이터 요청 중...';
                this.allItems = [];
                this.filteredItems = [];
                this.currentPage = 1;
                this.openIndex = null;
                this.selectedIndex = null;
                this.resultMode = 'basic';

                try {
                    const results = await Promise.all(selectedCategories.map(async category => {
                        const fileName = `2026년 ${category}공사 표준일위대가(업데이트_26년상).json`;
                        const url = `https://raw.githubusercontent.com/h2ksp/skin/refs/heads/main/data/${encodeURIComponent('표준품셈')}/${encodeURIComponent(fileName)}`;
                        try {
                            const response = await fetch(url);
                            if (!response.ok) throw new Error(`HTTP ${response.status}`);
                            const data = await response.json();
                            const items = data?.공사원가호환규정?.공사내역서?.단일공사내역서?.일위대가;
                            if (!Array.isArray(items)) throw new Error('일위대가 데이터 형식이 올바르지 않습니다.');
                            return items.map(item => ({ ...item, _estimateCategory: category }));
                        } catch (error) {
                            throw new Error(`${category}공사: ${error.message}`);
                        }
                    }));
                    if (requestId !== this.requestId) return;
                    this.allItems = results.flat();
                    if (this.query.trim()) {
                        this.filterItems();
                    } else {
                        this.statusMessage = `표준품셈 / 데이터 준비 완료`;
                    }
                } catch (error) {
                    if (requestId !== this.requestId) return;
                    console.error('표준일위대가 로드 실패:', error);
                    this.statusMessage = `데이터 로드 실패: ${error.message}`;
                } finally {
                    if (requestId === this.requestId) this.loading = false;
                }
            },

            filterItems() {
                const text = this.query.trim();
                this.currentPage = 1;
                this.openIndex = null;
                this.selectedIndex = null;
                if (Array.from(text).length < 2) {
                    this.filteredItems = [];
                    this.statusMessage = '검색어를 2글자 이상 입력해 주세요.';
                    return;
                }
                const search = text.toLowerCase();
                this.filteredItems = this.allItems.filter(item =>
                    [item.품명, item.규격].some(value =>
                        value != null && String(value).toLowerCase().includes(search))
                );
                this.statusMessage = `총 ${this.filteredItems.length.toLocaleString('ko-KR')}건 검색 완료 (전체 ${this.allItems.length.toLocaleString('ko-KR')}건 중)`;
            },

            showAllItems() {
                this.query = '';
                this.filteredItems = this.allItems;
                this.currentPage = 1;
                this.openIndex = null;
                this.selectedIndex = null;
                this.statusMessage = `전체 ${this.allItems.length.toLocaleString('ko-KR')}건 표시`;
            },

            selectPage(page) {
                if (page < 1 || page > this.totalPages || page === this.currentPage) return;
                this.currentPage = page;
                this.openIndex = null;
                this.selectedIndex = null;
            },

            toggleItem(index) {
                this.selectedIndex = index;
                this.openIndex = this.openIndex === index ? null : index;
                this.openDetailIndex = null;
            },

            toggleDetail(index) {
                this.openDetailIndex = this.openDetailIndex === index ? null : index;
            },

            makeEstimateItem(item) {
                const byCode = new Map(this.allItems
                    .filter(entry => entry._estimateCategory === item._estimateCategory)
                    .map(entry => [entry.일위대가코드, entry]));
                const makeChildren = (estimate, ancestors) => this.details(estimate).map(detail => {
                    const child = {
                        ...detail,
                        type: detail.자원구분 === '기계경비' ? '건설기계' : detail.자원구분
                    };
                    if (detail.자원구분 === '일위대가') {
                        const referenced = byCode.get(detail.자원코드);
                        if (!referenced) throw new Error(`일위대가 ${detail.자원코드}를 찾을 수 없습니다.`);
                        if (ancestors.has(detail.자원코드)) throw new Error(`일위대가 ${detail.자원코드}가 순환 참조됩니다.`);
                        child.children = makeChildren(referenced, new Set([...ancestors, detail.자원코드]));
                    }
                    return child;
                });
                return {
                    type: '일위대가',
                    일위대가코드: item.일위대가코드,
                    품명: item.품명,
                    규격: item.규격 ?? '',
                    단위: item.단위 ?? '',
                    수량: 1,
                    재료비단가: item.재료비,
                    노무비단가: item.노무비,
                    경비단가: item.경비,
                    비고: item.비고 ?? '',
                    children: makeChildren(item, new Set([item.일위대가코드]))
                };
            },

            registerItem() {
                const item = this.selectedItem;
                if (!item || !confirm(`'${item.품명}${item.규격 ? ` (${item.규격})` : ''}' 일위대가를 나의데이터에 등록하시겠습니까?`)) return;

                try {
                    const customItem = this.makeEstimateItem(item);
                    const option = JSON.parse(localStorage.getItem('option') || '{}');
                    if (!option || typeof option !== 'object' || Array.isArray(option)) {
                        throw new Error('option 데이터 형식이 올바르지 않습니다.');
                    }
                    const myData = option['나의데이터'] ?? [];
                    if (!Array.isArray(myData)) throw new Error('나의데이터가 배열이 아닙니다.');
                    option['나의데이터'] = [...myData, customItem];
                    localStorage.setItem('option', JSON.stringify(option));
                    this.statusMessage = `'${item.품명}' 일위대가를 나의데이터에 등록했습니다.`;
                } catch (error) {
                    console.error('나의데이터 등록 실패:', error);
                    alert(`나의데이터 등록에 실패했습니다: ${error.message}`);
                }
            },

            async addToEstimate() {
                const item = this.selectedItem;
                if (!item || this.sendingToEstimate) return;
                this.sendingToEstimate = true;
                try {
                    await sendItemToEstimate(this.makeEstimateItem(item));
                    this.statusMessage = `'${item.품명}' 일위대가를 내역서에 추가했습니다.`;
                } catch (error) {
                    console.error('내역서 항목 추가 실패:', error);
                    alert(`내역서 항목 추가에 실패했습니다: ${error.message}`);
                } finally {
                    this.sendingToEstimate = false;
                }
            },

            details(item) {
                const value = item.일위대가상세;
                if (Array.isArray(value)) return value;
                return value ? [value] : [];
            },

            formatDetailJson(detail) {
                return JSON.stringify(detail, (key, value) =>
                    key && detailJsonExcludedKeys.includes(key) ? undefined : value, 2);
            },

            columnValue(item, column) {
                if (column.key === '합계') {
                    const costs = ['재료비', '노무비', '경비']
                        .map(key => item[key])
                        .filter(value => value !== null && value !== undefined && value !== '')
                        .map(value => Number(String(value).replace(/,/g, '')))
                        .filter(Number.isFinite);
                    return costs.length ? this.formatNumber(costs.reduce((sum, value) => sum + value, 0)) : '';
                }
                const value = item[column.key];
                return column.number ? this.formatNumber(value) : value ?? '';
            },

            formatNumber(value) {
                if (value === null || value === undefined || value === '') return '';
                const text = String(value);
                if (!/^[+-]?\d+(?:\.\d+)?$/.test(text)) return text;
                const parts = text.split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                return parts.join('.');
            }
        }));
    });
</script>
