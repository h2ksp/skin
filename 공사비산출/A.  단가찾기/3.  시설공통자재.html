<script>
    document.addEventListener('alpine:init', () => {
        async function sendItemToEstimate(item) {
            if (typeof BroadcastChannel === 'undefined' || !globalThis.crypto?.randomUUID) {
                throw new Error('이 브라우저에서는 화면 간 항목 추가를 지원하지 않습니다.');
            }
            const channel = new BroadcastChannel('cost-estimate-add');
            try {
                const requestId = crypto.randomUUID();
                const targets = new Set();
                channel.onmessage = event => {
                    if (event.data?.type === 'available' && event.data.requestId === requestId) {
                        targets.add(event.data.targetId);
                    }
                };
                channel.postMessage({ type: 'discover', requestId });
                await new Promise(resolve => setTimeout(resolve, 500));
                if (!targets.size) throw new Error('항목추가 화면을 열고 프로젝트와 공종그룹을 선택해 주세요.');
                if (targets.size > 1) throw new Error('항목추가 화면이 여러 개 열려 있습니다. 추가할 화면 하나만 남겨 주세요.');
                const targetId = [...targets][0];
                const response = await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('추가 결과를 확인하지 못했습니다. 다시 시도하기 전에 내역서를 확인해 주세요.')), 5000);
                    channel.onmessage = event => {
                        if (event.data?.type !== 'result' || event.data.requestId !== requestId || event.data.targetId !== targetId) return;
                        clearTimeout(timeout);
                        resolve(event.data);
                    };
                    try {
                        channel.postMessage({ type: 'add', requestId, targetId, item: JSON.parse(JSON.stringify(item)) });
                    } catch (error) {
                        clearTimeout(timeout);
                        reject(error);
                    }
                });
                if (!response.success) throw new Error(response.error);
            } finally {
                channel.close();
            }
        }

        const commonResultModes = [
            {
                id: "No1", label: "기본",
                columns: [
                    { key: "nticeDt", label: "공고일시", class: "cell-center" },
                    { key: "prdctClsfcNoNm", label: "품명" },
                    { key: "krnPrdctNm", label: "규격" },
                    { key: "unit", label: "단위", width: "30px", class: "cell-center" },
                    { key: "prce", label: "가격(원)", width: "80px", class: "cell-right" },
                ]
            },
            {
                id: "No2", label: "추가정보",
                columns: [
                    { key: "vatYnNm", label: "부가세 여부", class: "cell-center" },
                    { key: "prdctClsfcNo", label: "분류번호", class: "cell-center" },
                    { key: "prdctIdntNo", label: "식별번호", class: "cell-center" },
                    { key: "dlvryCndtnNm", label: "납품조건", class: "cell-center" },
                    { key: "prceDiv", label: "가격구분", class: "cell-center" },
                    { key: "invstDeptNm", label: "부서명", class: "cell-center" },
                    { key: "invstDeptTelNo", label: "전화번호", width: "100px" },
                    { key: "invstOfclNm", label: "담당자", width: "60px", class: "cell-center" },
                ]
            }
        ];

        const categories = [
            { label: '토목', file: '토목' },
            { label: '건축', file: '건축' },
            { label: '기계설비', file: '기계설비' },
            { label: '전기, 정보통신', file: '전기정보통신' }
        ];
        const dataUrl = 'https://raw.githubusercontent.com/h2ksp/skin/refs/heads/main/data/';
        const commonApi = {
            searchKey: 'prdctClsfcNoNm',
            defaultResultMode: 'No1',
            resultModes: commonResultModes
        };
        const apiList = [
            { id: 'all', name: '전체', ...commonApi },
            ...categories.map((category, index) => {
                const number = index + 1;
                const fileName = `${number}.시설공통자재(${category.file})가격정보.json`;
                return {
                    id: `civil${number}`,
                    name: `${category.label} `,
                    url: `${dataUrl}${encodeURIComponent('조달청 가격정보현황')}/${encodeURIComponent(fileName)}`,
                    hasSub: false,
                    ...commonApi
                };
            })
        ];

        Alpine.data('materialSearch', () => ({
            showSearchBar: true,
            selectedApiId: "all",
            selectedRegType: "No1",

            searchNm: "",
            selectedRowIndex: null, // 👈 어떤 행이

            selectedRegTypes: {},
            statusMessage: "데이터 로딩 중...",
            loading: false,
            sendingToEstimate: false,
            allItems: [],
            filteredItems: [],
            pageSize: 50,
            currentPage: 1,
            requestId: 0,

            apiList,

            init() {
                this.loadData();
            },

            get selectedItem() {
                return this.selectedRowIndex === null
                    ? null
                    : this.filteredItems[this.selectedRowIndex] ?? null;
            },

            get totalPages() {
                return Math.ceil(this.filteredItems.length / this.pageSize);
            },

            get pageStartIndex() {
                return (this.currentPage - 1) * this.pageSize;
            },

            get paginatedItems() {
                return this.filteredItems.slice(this.pageStartIndex, this.pageStartIndex + this.pageSize);
            },

            selectPage(page) {
                if (page === this.currentPage || page < 1 || page > this.totalPages) return;
                this.currentPage = page;
                this.selectedRowIndex = null;
            },

            // 현재 선택된 API 객체 반환
            get currentApi() {
                return this.apiList.find(api => api.id === this.selectedApiId) || this.apiList[0];
            },

            get currentRegType() {
                return this.selectedRegTypes[this.currentApi.id]
                    || this.currentApi.defaultResultMode
                    || this.currentApi.resultModes[0]?.id;
            },

            get currentResultMode() {
                return this.currentApi.resultModes.find(mode => mode.id === this.selectedRegType)
                    || this.currentApi.resultModes[0];
            },

            setRegType(type) {
                this.selectedRegTypes[this.currentApi.id] = type;
            },

            shouldShowRadioBar() {
                return this.showSearchBar && this.currentApi.resultModes.length > 0;
            },

            openPopup() {
                const url = new URL(window.location.href);
                url.searchParams.set('materialPopup', '1');
                const popup = window.open(url.href, '_blank', 'popup=yes,width=1200,height=800');
                if (!popup) {
                    alert('팝업이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요.');
                    return;
                }
                popup.opener = null;
            },

            help_message() {
                const banner = document.getElementById('noticeBanner');
                if (!banner) return;
                banner.style.display = banner.style.display === 'none' || banner.style.display === ''
                    ? 'flex'
                    : 'none';
            },

            getHeaders() {
                const columns = this.currentResultMode?.columns || [];
                return this.selectedApiId === 'all' && this.selectedRegType === 'No1'
                    ? [{ key: '_sourceCategory', label: '분류', class: 'cell-center' }, ...columns]
                    : columns;
            },

            // 각 항목의 행 데이터를 생성하는 함수
            getMaterialRow(item) {
                const columns = this.getHeaders();
                if (columns.length) {
                    return columns.map(column => {
                        let val = column.getValue ? column.getValue(item) : item[column.key];
                        if (column.key === 'nticeDt') {
                            val = val ? String(val).split(' ')[0] : '';
                        } else if (column.key === 'prce') {
                            const price = Number(val);
                            val = (val === undefined || val === null || val === '' || isNaN(price)) ? (val || '') : price.toLocaleString('ko-KR');
                        } else {
                            val = val ?? '';
                        }
                        return { class: column.class || '', val };
                    });
                }
                return [];
            },

            async loadData() {
                const api = this.currentApi;
                const requestId = ++this.requestId;
                const sources = api.id === 'all'
                    ? this.apiList.filter(source => source.id !== 'all')
                    : [api];
                if (api && api.resultModes && api.resultModes.length > 0) {
                    this.selectedRegType = api.resultModes[0].id; // 👈 API 바뀔 때 첫 번째 모드로 자동 선택
                }

                this.loading = true;
                this.statusMessage = "데이터 요청 중...";
                this.allItems = [];
                this.filteredItems = [];
                this.currentPage = 1;
                this.selectedRowIndex = null; // 데이터 새로 불러올 때 선택 초기화

                try {
                    const results = await Promise.all(sources.map(async source => {
                        const cleanUrl = encodeURI(decodeURI(source.url));
                        const targetUrl = `${cleanUrl}?v=${new Date().getTime()}`;
                        try {
                            const response = await fetch(targetUrl);
                            if (!response.ok) throw new Error(`HTTP ${response.status}`);
                            const jsonObj = await response.json();
                            const rawItems = jsonObj?.response?.body?.items || jsonObj || [];
                            if (!rawItems || (Array.isArray(rawItems) && rawItems.length === 0)) {
                                throw new Error('데이터가 비어 있습니다.');
                            }
                            const items = Array.isArray(rawItems) ? rawItems : [rawItems];
                            return items.map(item => ({ ...item, _sourceCategory: source.name }));
                        } catch (error) {
                            throw new Error(`${source.name}: ${error.message}`);
                        }
                    }));
                    if (requestId !== this.requestId) return;
                    this.allItems = results.flat();

                    if (this.searchNm.trim() !== "") {
                        this.filterItems();
                    } else {
                        this.statusMessage = "조달청 시설공통자재 / 데이터 준비 완료";
                    }
                } catch (error) {
                    if (requestId !== this.requestId) return;
                    console.error("오류 발생:", error);
                    this.statusMessage = "데이터 로드 실패: " + error.message;
                } finally {
                    if (requestId === this.requestId) this.loading = false;
                }
            },
            showAllItems() {
                this.searchNm = '';
                this.filteredItems = [...this.allItems];
                this.currentPage = 1;
                this.selectedRowIndex = null;
                this.statusMessage = this.allItems.length
                    ? `전체 ${this.allItems.length.toLocaleString('ko-KR')}건 표시`
                    : '표시할 데이터가 없어.';
            },
            filterItems() {
                this.currentPage = 1;
                this.selectedRowIndex = null;
                if (this.allItems.length === 0) return;
                const searchText = this.searchNm.trim();

                if (!searchText) {
                    this.filteredItems = [];
                    this.statusMessage = "검색어를 입력해줘.";
                    return;
                }

                if (Array.from(searchText).length < 2) {
                    this.filteredItems = [];
                    this.statusMessage = "검색어를 2글자 이상 입력.";
                    return;
                }

                const query = searchText.toLowerCase();
                const searchKey = this.currentApi.searchKey;
                this.filteredItems = this.allItems.filter(item => {
                    const values = [item[searchKey] || item.prdctClsfcNoNm || item.품명, item.krnPrdctNm || item.규격];
                    return values.some(value => value != null && String(value).toLowerCase().includes(query));
                });

                if (this.filteredItems.length === 0) {
                    this.statusMessage = `'${query}' 검색 결과가 없어.`;
                    return;
                }

                this.statusMessage = `총 ${this.filteredItems.length.toLocaleString('ko-KR')}건 검색 완료 (전체 ${this.allItems.length.toLocaleString('ko-KR')}건 중)`;
            },

            makeMaterialItem(item) {
                const title = item.prdctClsfcNoNm || item.품명 || item.명칭 || '해당 자재';
                const price = Number(String(item.prce ?? '').replace(/,/g, ''));
                return {
                    고시일시: item.nticeDt ? item.nticeDt.split(' ')[0] : '',
                    분류번호: item.prdctClsfcNo,
                    식별번호: item.prdctIdntNo,
                    type: '자재',
                    품명: title,
                    규격: item.krnPrdctNm || item.규격 || '',
                    단위: item.unit || item.단위 || '',
                    수량: 1,
                    재료비단가: Number.isFinite(price) ? price : 0,
                };
            },

            registerFinalItem(item) {
                if (!item) return;
                const customItem = this.makeMaterialItem(item);
                const title = customItem.품명;
                const spec = customItem.규격 ? ` (${customItem.규격})` : '';

                if (!confirm(`'${title}${spec}' 자재를 나의데이터에 등록하시겠습니까?`)) {
                    return;
                }

                try {
                    const option = JSON.parse(localStorage.getItem('option') || '{}');
                    if (!option || typeof option !== 'object' || Array.isArray(option)) {
                        throw new Error('option 데이터 형식이 올바르지 않습니다.');
                    }
                    const myData = option['나의데이터'] ?? [];
                    if (!Array.isArray(myData)) {
                        throw new Error('나의데이터가 배열이 아닙니다.');
                    }
                    option['나의데이터'] = [...myData, customItem];
                    localStorage.setItem('option', JSON.stringify(option));
                    this.statusMessage = `'${title}' 자재를 나의데이터에 등록했습니다.`;
                } catch (error) {
                    console.error('나의데이터 등록 실패:', error);
                    alert('나의데이터 등록에 실패했습니다.');
                }
            },

            async addToEstimate() {
                const item = this.selectedItem;
                if (!item || this.sendingToEstimate) return;
                this.sendingToEstimate = true;
                try {
                    const customItem = this.makeMaterialItem(item);
                    await sendItemToEstimate(customItem);
                    this.statusMessage = `'${customItem.품명}' 자재를 내역서에 추가했습니다.`;
                } catch (error) {
                    console.error('내역서 항목 추가 실패:', error);
                    alert(`내역서 항목 추가에 실패했습니다: ${error.message}`);
                } finally {
                    this.sendingToEstimate = false;
                }
            },
        }));
    });
</script>
