<style>
    .unit-price-list {
        color: #333;
        font-size: 13px;
        text-align: right;
    }

    .unit-price-list .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0;
        padding: 8px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background-color: rgba(249, 249, 249, 0.9);
    }

    .unit-price-list select {
        min-width: 240px;
        padding: 5px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: white;
        font-size: inherit;
    }

    .unit-price-list .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 12px 0;
    }

    .unit-price-list .status {
        color: #6b7280;
        font-weight: 500;
    }

    .unit-price-list .view-options {
        display: flex;
        gap: 16px;
        margin-left: 50px;
        align-items: center;
    }

    .unit-price-list .view-options label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        color: #374151;
    }


    .unit-price-list table {
        display: table;
        width: 100%;
        border-collapse: collapse;
        font-size: inherit;
    }

    .unit-price-list thead {
        display: table-header-group;
    }

    .unit-price-list thead th {
        font-weight: normal;
        text-align: center;
        background-color: #f8f9fa;

        border-bottom: none;
    }

    .unit-price-list tbody {
        display: table-row-group;
    }

    .unit-price-list tbody td {
        padding-top: 0;
        padding-bottom: 0;
        line-height: 20px;
    }

    .unit-price-list td {
        text-align: left;
        white-space: nowrap;


    }

    .unit-price-list thead td {
        text-align: center !important;

    }

    .unit-price-list .field-input {
        border: none;
        border-bottom: 1px solid #ccc;
        background: transparent;
        font-size: inherit;
        font-style: italic;
        height: 18px;
        line-height: 18px;
        outline: none;
        padding: 0 8px;
        box-sizing: border-box;
        color: #4b5563;
    }

    .unit-price-list .field-input:focus {
        border-bottom: 1px solid #2563eb;
    }

    .unit-price-list .field-input[readonly] {
        border-bottom: 1px solid #e5e7eb;
        color: #4b5563;
    }

    .unit-price-list .text-center {
        text-align: center;
    }

    .unit-price-list .text-right {
        text-align: right;
    }

    .unit-price-list .text-left {
        text-align: left;
    }

    .unit-price-list .field-wide {
        width: 90%;
    }

    .unit-price-list .field-unit {
        width: 45px;
    }

    .unit-price-list .field-money {
        width: 120px;
        color: #4b5563;
        font-style: italic;
    }

    .unit-price-list .col-remark {
        width: 200px;
    }

    .unit-price-list .col-remark .field-input {
        width: 90%;
    }

    .unit-price-list .edit-btn {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
    }

    .unit-price-list .select-cell {
        width: 24px;
        min-width: 24px;
        padding: 0;
        text-align: center !important;
        cursor: pointer;
        user-select: none;
    }

    .unit-price-list tr.is-selected,
    .unit-price-list tr.is-selected input {
        background-color: #e8f1ff;
    }

    .unit-price-list .selected-json {
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        font-size: inherit;
        margin-top: 40px;
        color: #1f2937;
        text-align: left;
        /* font-style: italic; */
        white-space: pre-wrap;
        word-break: break-all;
    }
</style>



<div x-data="unitPriceList()" x-init="init()" id="print-container">

    <div class="unit-price-list">
        <h1>일위대가 목록</h1>
        <div class="toolbar">
            <label for="unitPriceProject">프로젝트 선택:</label>
            <select id="unitPriceProject" x-model="activeProject" @change="saveActiveProject()">
                <option value="">프로젝트 선택</option>
                <template x-for="project in projectList" :key="project">
                    <option :value="project" x-text="project"></option>
                </template>
            </select>
        </div>

        <!-- 상태 바: 건수 표시 및 보기 옵션 -->
        <div class="status-bar">
            <div class="status" x-text="statusMessage"></div>
            <div class="view-options" x-show="rows.length > 0">
                <label>
                    <input type="radio" name="viewMode" value="option1" x-model="viewMode"> 기본사항
                </label>
                <label>
                    <input type="radio" name="viewMode" value="option2" x-model="viewMode"> 재료비단가/노무비단가/경비단가
                </label>
            </div>
        </div>

        <!-- 데이터 테이블 -->
        <div x-show="rows.length > 0">
            <table>
                <thead>
                    <tr>
                        <th class="select-cell"></th>
                        <template x-for="col in columns" :key="col.key">
                            <th :class="{ 'col-remark': col.key === '비고' }" x-text="col.label"></th>
                        </template>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="row in rows" :key="row.key">
                        <tr :class="{ 'is-selected': isSelected(row) }">
                            <td class="select-cell" role="button" tabindex="0" :aria-pressed="isSelected(row)"
                                @click="toggleRow(row)" @keydown.enter.space.prevent="toggleRow(row)">- </td>

                            <template x-for="col in columns" :key="col.key">
                                <td :class="{
                                'col-remark': col.key === '비고',
                                'text-center': col.kind === 'count'
                            }">
                                    <template x-if="col.kind === 'count'">
                                        <span x-text="getColumnValue(row, col)"></span>
                                    </template>
                                    <template x-if="col.kind !== 'count'">
                                        <input type="text" :class="col.inputClass" :value="getRowValue(row, col)"
                                            :readonly="col.readonly"
                                            @input="!col.readonly && calcRow(row, col.key, $event, col.type)">
                                    </template>
                                </td>
                            </template>

                            <!-- 수정 버튼 -->
                            <td class="text-center">
                                <a href="#" class="edit-btn" x-show="row.item.type && row.item.type !== '일반'"
                                    @click.prevent="handleOptionLink(row)">
                                    ✎ &nbsp;
                                </a>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <pre class="selected-json" x-text="selectedJson"></pre>
    </div>
</div>

<script>
    function unitPriceList() {
        return {
            projectList: [],
            activeProject: '',
            costData: {},
            viewMode: 'option1',
            filterTypes: ['일위대가'],
            jsonExcludeKeys: ['children', 'showCost', 'selected', '수량', '재료비', '노무비', '경비', '합계'],
            selectedRowKey: '',

            init() {
                const rawCost = localStorage.getItem('cost');
                let parsedCost = {};

                if (rawCost) {
                    try {
                        parsedCost = JSON.parse(rawCost) || {};
                    } catch (e) {
                        console.error('COST 로컬스토리지 파싱 실패:', e);
                        parsedCost = {};
                    }
                }

                this.costData = parsedCost;

                const option = JSON.parse(localStorage.getItem('option') || '{}');
                const projects = Array.isArray(option.projectList)
                    ? option.projectList
                    : Object.keys(this.costData);

                this.projectList = projects;
                this.activeProject = option.activeProject || '';

                if (!this.projectList.includes(this.activeProject)) {
                    this.activeProject = this.projectList[0] || '';
                }
            },

            saveActiveProject() {
                this.selectedRowKey = '';
                const option = JSON.parse(localStorage.getItem('option') || '{}');
                option.activeProject = this.activeProject;
                localStorage.setItem('option', JSON.stringify(option));
            },

            saveCostData() {
                localStorage.setItem('cost', JSON.stringify(this.costData));
            },

            isSelected(row) {
                return this.selectedRowKey === row.key;
            },

            toggleRow(row) {
                this.selectedRowKey = this.isSelected(row) ? '' : row.key;
            },

            numberValue(value) {
                return Number(String(value ?? '').replace(/,/g, '').trim()) || 0;
            },

            formatNumber(value) {
                return value ? value.toLocaleString('ko-KR') : '0';
            },

            getRowValue(row, column) {
                if (column.key === '합계') {
                    const total = row.items.reduce(
                        (sum, item) => sum + this.numberValue(item.합계),
                        0
                    );
                    return this.formatNumber(total);
                }
                return row.item?.[column.key] ?? '';
            },

            getColumnValue(row, column) {
                if (column.kind === 'count') return row.count > 1 ? row.count : '-';
                return '';
            },

            recalculateItemAmounts(item) {
                const quantity = this.numberValue(item.수량);
                const material = this.numberValue(item.재료비단가);
                const labor = this.numberValue(item.노무비단가);
                const expense = this.numberValue(item.경비단가);
                const materialAmount = material * quantity;
                const laborAmount = labor * quantity;
                const expenseAmount = expense * quantity;

                item.단가합계 = this.formatNumber(material + labor + expense);
                item.재료비 = this.formatNumber(materialAmount);
                item.노무비 = this.formatNumber(laborAmount);
                item.경비 = this.formatNumber(expenseAmount);
                item.합계 = this.formatNumber(materialAmount + laborAmount + expenseAmount);
            },

            calcRow(row, field, event, type = 'number') {
                let value = event.target.value;
                if (type !== 'text') {
                    const rawValue = value.replace(/,/g, '');
                    value = rawValue === '' || !Number.isFinite(Number(rawValue))
                        ? ''
                        : Number(rawValue).toLocaleString('ko-KR');
                    event.target.value = value;
                }

                row.items.forEach(item => {
                    item[field] = value;
                    if (['재료비단가', '노무비단가', '경비단가'].includes(field)) {
                        this.recalculateItemAmounts(item);
                    }
                });

                this.saveCostData();
            },


            handleOptionLink(row) {
                const option = JSON.parse(localStorage.getItem('option') || '{}');
                option.activeProject = this.activeProject;
                option.comboboxsave = {
                    projectKey: this.activeProject,
                    categoryKey: row.categoryKey,
                    subItemKey: row.subItemKey
                };
                localStorage.setItem('option', JSON.stringify(option));

                window.location.href = 'https://study-with-words.blogspot.com/2026/11/blog-post_12.html?group=group3&sub=sub1';
            },

            extractAllItems(data, path = []) {
                const items = [];
                if (!data) return items;

                if (Array.isArray(data)) {
                    data.forEach((item, index) =>
                        items.push(...this.extractAllItems(item, [...path, index]))
                    );
                    return items;
                }

                if (typeof data !== 'object') return items;

                items.push({ item: data, path });

                if (Array.isArray(data.children) && data.children.length > 0) {
                    items.push(...this.extractAllItems(data.children, path));
                }

                return items;
            },

            getItemsByType(data, targetTypes) {
                const items = this.extractAllItems(data);
                const types = Array.isArray(targetTypes) ? targetTypes : [targetTypes];

                return types.flatMap(targetType =>
                    items.filter(entry => entry.item?.type === targetType)
                );
            },

            get columns() {
                const option1 = [
                    { label: '품명', key: '품명', type: 'text', readonly: false, inputClass: 'field-input field-wide text-left' },
                    { label: '규격', key: '규격', type: 'text', readonly: false, inputClass: 'field-input field-wide text-left' },
                    { label: '단위', key: '단위', type: 'text', readonly: false, inputClass: 'field-input field-unit text-center' },
                    { label: '금액', key: '단가합계', type: 'number', readonly: true, inputClass: 'field-input field-money text-right' },
                ];

                const option2 = [
                    { label: '재료비', key: '재료비단가', type: 'number', readonly: false, inputClass: 'field-input field-money text-right' },
                    { label: '노무비', key: '노무비단가', type: 'number', readonly: false, inputClass: 'field-input field-money text-right' },
                    { label: '경비', key: '경비단가', type: 'number', readonly: false, inputClass: 'field-input field-money text-right' },
                    { label: '합계', key: '단가합계', type: 'number', readonly: true, inputClass: 'field-input field-money text-right' },
                    { label: '비고', key: '비고', type: 'text', readonly: false, inputClass: 'field-input field-wide text-left' },
                ];

                const fields = this.viewMode === 'option2' ? option2 : option1;
                return fields.map(column => ({
                    ...column,
                    kind: column.kind || 'input'
                }));
            },

            get rows() {
                if (!this.activeProject) return [];

                const project = this.costData?.[this.activeProject];
                const data = project?.공종별내역서;
                if (!data || typeof data !== 'object') return [];

                const grouped = new Map();
                const normalizeText = value => String(value ?? '').trim();

                this.getItemsByType(data, this.filterTypes).forEach(({ item, path }) => {
                    const key = JSON.stringify([
                        item.type,
                        normalizeText(item.품명),
                        normalizeText(item.규격),
                        normalizeText(item.단위),
                        this.numberValue(item.재료비단가),
                        this.numberValue(item.노무비단가),
                        this.numberValue(item.경비단가)
                    ]);

                    let row = grouped.get(key);
                    if (!row) {
                        row = {
                            item,
                            items: [],
                            count: 0,
                            key: JSON.stringify(path),
                            categoryKey: path.slice(0, 2).join('-'),
                            subItemKey: path.slice(2).join('-')
                        };
                        grouped.set(key, row);
                    }

                    row.items.push(item);
                    row.count++;
                });

                return [...grouped.values()];
            },

            get selectedJson() {
                const selectedRow = this.rows.find(row => this.isSelected(row));
                if (!selectedRow) return '';

                const visibleItem = Object.fromEntries(
                    Object.entries(selectedRow.item)
                        .filter(([key]) => !this.jsonExcludeKeys.includes(key))
                );

                return JSON.stringify(visibleItem, null, 2);
            },

            get statusMessage() {
                if (!this.activeProject) return '프로젝트를 선택해 주세요.';
                const data = this.costData?.[this.activeProject]?.공종별내역서;
                return this.filterTypes
                    .map(type => `${type} ${this.getItemsByType(data || {}, type).length}건`)
                    .join('│ ');
            }
        };
    }
</script>
