<style>
    .cost-calculator {
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.85rem;
        text-align: left;
    }

    .cost-calculator table {
        border-collapse: collapse;
        width: 100%;
        padding: 0;
        font-family: inherit;
    }

    .cost-calculator th {
        font-weight: normal;
        text-align: center;
        background-color: #f8fafc;
        border-bottom: none;
        font-size: 13px;
    }

    .cost-calculator td {
        border: none;
        font-size: 0.9rem;
        font-weight: normal;
        font-style: normal;
        white-space: nowrap;
        padding: 0 2px 0 0;
    }

    .cost-calculator .text-left {
        text-align: left;
    }

    .cost-calculator .text-center {
        text-align: center;
    }

    .cost-calculator .text-right {
        text-align: right;
    }

    .cost-calculator input[type="text"],
    .cost-calculator select {
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: normal;
        font-style: normal;
        color: inherit;
        width: 100%;
        padding: 5px 8px;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background: #fff;
    }

    .cost-calculator input[type="text"] {
        padding: 3px 8px;
    }

    .cost-calculator input[type="text"]:focus,
    .cost-calculator select:focus {
        outline: 2px solid #93c5fd;
        outline-offset: 1px;
    }

    .cost-calculator input::placeholder {
        color: #94a3b8;
        font-size: 13px;
        font-weight: 400;
    }

    .cost-calculator input.text-left,
    .cost-calculator select.text-left {
        text-align: left;
    }

    .cost-calculator input.text-center,
    .cost-calculator select.text-center {
        text-align: center;
    }

    .cost-calculator input.text-right,
    .cost-calculator select.text-right {
        text-align: right;
    }

    .cost-calculator button {
        cursor: pointer;
    }

    .select-cell {
        cursor: pointer;
        width: 5px;
        text-align: center;
        background-color: transparent;
    }

    .cost-calculator .table-container tbody tr:hover {
        background: #f1f5f9;
    }

    .cost-calculator tr.selected-row>td {
        background-color: #dbeafe;
    }

    .cost-calculator .table-container th,
    .cost-calculator .table-container td {
        border: 1px solid #cbd5e1;
    }

    .cost-calculator .table-container th {
        padding: 0 8px;
        font-size: 0.85rem;
    }

    .cost-calculator .table-container th.select-header,
    .cost-calculator .table-container th.action-header {
        padding: 0;
    }

    .cost-calculator .table-container th.select-header {
        width: 5px;
    }

    .cost-calculator .table-container td {
        padding: 0;
    }

    .cost-calculator .table-container tbody input[type="text"],
    .cost-calculator .table-container tbody select {
        padding: 3px 8px;
        border: 0;
        border-radius: 0;
        background: transparent;
    }

    .cost-calculator .table-container tbody input[type="text"]:focus,
    .cost-calculator .table-container tbody select:focus {
        outline-offset: -2px;
    }

    .cost-calculator .table-container tbody td > div,
    .cost-calculator .table-container tfoot td {
        padding-left: 8px;
        padding-right: 8px;
    }

    .explorer-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0;
        background: #f9f9f9e7;
        padding: 5px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
    }

    /* 중첩 상태일 때 보여지는 부모 품목 정보 바 스타일 */
    .nested-info-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;

        padding: 10px 14px;
        align-items: center;
    }

    .nested-parent-fields {
        display: flex;
        gap: 10px;
        font-size: 16px;
        flex: 1;
    }

    .nested-parent-field {
        background: #fff;
    }

    .nested-parent-unit,
    .nested-parent-qty {
        width: 60px;
    }

    .nested-parent-unit {
        text-align: center;
    }

    .nested-parent-qty {
        text-align: right;
    }

    .my-data-item {
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        cursor: pointer;
        /* font-style: italic; */
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 80%;
        box-sizing: border-box;
    }

    .my-data-item.is-selected {
        background-color: #dbeafe;
    }

    .my-data-item:hover {
        background-color: #f1f5f9;
    }

    .my-data-item.is-selected:hover {
        background-color: #dbeafe;
    }

    .top-bar {
        margin-bottom: 8px;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 20px;
    }

    .radio-group {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .radio-group label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        white-space: nowrap;
    }

    .table-container {
        width: 100%;
        overflow-x: auto;
    }

    .cost-calculator .json-editor {
        position: relative;
        margin: 14px 0 24px;
    }

    .cost-calculator .json-editor-actions {
        position: absolute;
        top: 0;
        right: 20px;
        display: flex;
        gap: 6px;
    }

    .cost-calculator .json-editor textarea,
    .cost-calculator .json-editor pre {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 190px;
        margin: 0;
        padding: 12px 50px 332px 12px;
        border: 0;
        font: 14px monospace;
    }

    .cost-calculator .json-editor pre {
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.5;
    }

    .cost-calculator .json-editor textarea {
        overflow-y: hidden;
        resize: none;
    }

    .cost-calculator .json-editor textarea:focus-visible {
        background: #f1f5f9;
    }

    .cost-calculator .json-editor-message {
        color: #64748b;
        padding: 12px 0;
    }

    .cost-calculator .json-editor-error {
        color: #b91c1c;
    }

    @media (max-width: 480px) {
        .cost-calculator .json-editor-actions {
            position: static;
            justify-content: flex-end;
        }

        .cost-calculator .json-editor textarea,
        .cost-calculator .json-editor pre {
            padding-right: 2px;
        }
    }

    pre {
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        color: #333333;
        /* font-style: italic; */
        font-size: 14px;
    }
</style>

<br>

<div class="cost-calculator" x-data="costCalculator()" style="margin-left: -40px;width: calc(100% + 140px);">

    <!-- 젤 상단 탐색기 스타일 콤보박스 2개 -->
    <div class="explorer-bar">
        <div class="explorer-field">
            <select x-model="selectedProjectKey" @change="onProjectChange()">
                <option value="">-- 프로젝트를 선택하세요 --</option>
                <template x-for="projKey in projectKeys" :key="projKey">
                    <option :value="projKey" x-text="projKey"></option>
                </template>
            </select>
        </div>
        <div class="explorer-field">
            <select x-model="selectedCategoryKey" @change="onCategoryChange()" :disabled="!selectedProjectKey">
                <option value="">-- 공종그룹을 선택하세요 --</option>
                <template x-for="catOpt in availableCategories" :key="catOpt.key">
                    <option :value="catOpt.key" x-text="catOpt.label"></option>
                </template>
            </select>
        </div>
        <button type="button" @click="goBack()" :disabled="!canGoBack">
            ↑ 위로
        </button>
        <button type="button" @click="editSelected()" :disabled="!canEnterSelected">세부항목</button>
        <span x-text="nestingDepthNumber"></span>
        <div style="margin-left: auto; display: flex; gap: 7px; flex-shrink: 0;">
            <button type="button" @click="toggleDataPanel('project')">프로젝트 데이터</button>
            <button type="button" @click="toggleDataPanel('cart')">나의데이터</button>
        </div>
    </div>



    <div class="top-bar">
        <div>
            <button type="button" @click="moveSelected(-1)"
                :disabled="selectedIndex === null || selectedIndex === 0">위로</button>
            <button type="button" @click="moveSelected(1)"
                :disabled="selectedIndex === null || selectedIndex === rows.length - 1">아래로</button>
            <button type="button" @click="addRow()">항목추가</button>
        </div>

        <div class="radio-group">
            <template x-for="(view, key) in views" :key="key">
                <label>
                    <input type="radio" name="costView" :value="key" x-model="currentView">
                    <span x-text="view.label"></span>
                </label>
            </template>
        </div>
    </div>


    <!-- 최상위가 아닐 때 부모 항목의 정보가 실시간으로 바인딩되어 표시되는 영역 -->
    <div class="nested-info-bar" x-show="canGoBack && parentItem">
        <div class="nested-parent-fields" x-if="parentItem">
            <input type="text" placeholder="품명" x-model="parentItem.품명" @input="saveCostData()"
                class="nested-parent-field">
            <input type="text" placeholder="규격" x-model="parentItem.규격" @input="saveCostData()"
                class="nested-parent-field">
            <input type="text" placeholder="단위" x-model="parentItem.단위" @input="saveCostData()"
                class="nested-parent-field nested-parent-unit">
        </div>
    </div>

    <div class="table-container">
        <table x-ref="costTable">
            <thead>
                <tr>
                    <th class="select-header"></th>
                    <template x-for="col in currentColumns">
                        <th :style="'width: ' + col.width" :class="{ 'action-header': col.type === 'action' }" x-text="col.title"></th>
                    </template>
                </tr>
            </thead>
            <tbody>
                <template x-for="(row, index) in rows" :key="index">
                    <tr :class="{ 'selected-row': selectedIndex === index }">

                        <!-- 행 선택 시 나의데이터 창이 켜져있다면 자동으로 닫힘(!showMyData) -->
                        <td class="select-cell"
                            @click.stop="selectRow(index)">
                        </td>

                        <template x-for="col in currentColumns">
                            <td :class="col.alignClass">
                                <!-- 1. 콤보박스(select) 타입 -->
                                <template x-if="col.type === 'select'">
                                    <select x-model="row[col.key]" @change="saveCostData()" :class="col.alignClass">
                                        <template x-for="opt in (col.options || [])">
                                            <option :value="opt.value" x-text="opt.label"></option>
                                        </template>
                                    </select>
                                </template>

                                <!-- 2. 일반 텍스트 인풋 타입 -->
                                <template x-if="col.type === 'input-text'">
                                    <input type="text" x-model="row[col.key]" @input="saveCostData()"
                                        :class="col.alignClass">
                                </template>

                                <!-- 3. 숫자 입력 타입 -->
                                <template x-if="col.type === 'input-num'">
                                    <input type="text" inputmode="decimal" :value="getDisplayValue(row[col.key])"
                                        @input="formatInput($event, row, col.key)" :class="col.alignClass">
                                </template>

                                <!-- 4. 계산식 타입 -->
                                <template x-if="col.type === 'calc'">
                                    <div x-text="formatNum(col.calcFn(row), col.key === '합계' || col.key === '단가합계')"
                                        :class="col.alignClass"></div>
                                </template>

                                <!-- 5. 삭제 액션 타입 -->
                                <template x-if="col.type === 'action'">
                                    <a type="button" @click.stop="removeRow(index)"
                                        style="cursor: pointer; color: #999; font-size: 11px;">X</a>
                                </template>
                            </td>
                        </template>

                    </tr>
                </template>
            </tbody>
            <tfoot>
                <tr>
                    <td></td>
                    <!-- 앞의 4개 열을 제외한 열마다 합계 행의 셀을 만듭니다. -->
                    <template x-for="(col, idx) in currentColumns">
                        <td :class="col.alignClass" style="padding-top: 8px;">
                            <template x-if="col.type === 'calc'">
                                <!-- calc 열은 해당 열의 totalFn()으로 계산한 합계를 표시합니다. -->
                                <div x-text="formatNum(rows.reduce((sum, row) => sum + (Number(col.calcFn(row)) || 0), 0), true)"
                                    :class="col.alignClass"></div>
                            </template>
                            <template x-if="col.type !== 'calc'">
                                <!-- 계산 열이 아니면 합계를 표시하지 않고 '-'를 표시합니다. -->
                                <div :class="col.alignClass">-</div>
                            </template>
                        </td>
                    </template>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- 하단 '나의 데이터' 영역 -->
    <div style="margin-top: 64px; margin-left: 24px;" x-show="(showMyData || showCart) && selectedIndex === null" x-cloak
        @click="selectedMyDataIndex = null" @click.outside="selectedMyDataIndex = null">

        <div style="margin-bottom: 10px;" x-show="showMyData">
            <label style="display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;">
                조회할 프로젝트　-　&nbsp;
                <select x-model="sourceProjectKey" @change="updateCurrentCycleItems()" style="width: auto;">
                    <option value="">전체 프로젝트</option>
                    <template x-for="projKey in projectKeys" :key="projKey">
                        <option :value="projKey" x-text="projKey"></option>
                    </template>
                </select>
            </label>
        </div>

        <div x-show="!_targetContainer" style="margin-bottom: 10px; color: #777;">
            항목을 추가할 프로젝트와 공종그룹을 선택하세요.
        </div>
        <div x-show="dataPanelError" x-text="dataPanelError" style="margin-bottom: 10px; color: #b91c1c;"></div>

        <!-- 1. 일위대가, 노무, 자재 등을 텍스트와 '/' 구분자로 나열 -->
        <div
            style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; font-size: 0.85rem;">
            <template x-for="(typeName, idx) in availableCycleTypes" :key="typeName">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <a href="#" @click.prevent="changeCycleType(typeName)" :style="{
                       textDecoration: 'none',
                       fontWeight: currentCycleTypeName === typeName ? 'bold' : 'normal'
                    }"
                        x-text="typeName + ' (' + (classifiedItems[typeName] ? classifiedItems[typeName].length : 0) + ')'">
                    </a>
                    <span x-show="idx < availableCycleTypes.length - 1" style="color: #ccc;">/</span>
                </div>
            </template>
            &nbsp;&nbsp;&nbsp;
            <button type="button" @click.stop="addSelectedMyItem()" :disabled="selectedMyDataIndex === null || !_targetContainer">
                항목추가
            </button>
        </div>



        <template x-for="(item, index) in currentCycleItems" :key="index">
            <div class="my-data-item" :class="{ 'is-selected': selectedMyDataIndex === index }"
                @click.stop="selectedMyDataIndex = selectedMyDataIndex === index ? null : index">
                <span
                    x-text="(showMyData && !sourceProjectKey ? '[' + item.sourceProjectKey + '] ' : '') + '- ' + (item.data.품명 || '품명없음') + ' / 규격: ' + (item.data.규격 || '-') + ' / 단위: ' + (item.data.단위 || '-')"></span>
            </div>
        </template>
        <template x-if="currentCycleItems.length === 0 && !dataPanelError">
            <div
                style="color: #999; text-align: center; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 4px;">
                <span x-text="showCart ? '해당 타입의 장바구니 항목이 없습니다.' : (projectKeys.length ? '선택한 범위에 해당 타입의 항목이 없습니다.' : '프로젝트가 없습니다.')"></span>
            </div>
        </template>

    </div>

    <!-- 하단 JSON 상세 보기 영역 -->
    <div class="json-editor" x-show="selectedIndex !== null && rows[selectedIndex] && !showMyData && !showCart"
        x-cloak @resize.window="jsonEditing && resizeJsonEditor($refs.jsonEditor)">
        <div class="json-editor-actions">
            <button type="button" x-show="!jsonEditing" @click="startJsonEdit()">수정하기</button>
            <button type="button" x-show="jsonEditing" @click="saveJsonEdit()">저장하기</button>
            <button type="button" x-show="jsonEditing" @click="resetJsonEditor()">취소</button>
        </div>
        <pre x-show="!jsonEditing" x-text="jsonPreview"></pre>
        <textarea x-ref="jsonEditor" aria-label="JSON 편집" x-show="jsonEditing" x-model="jsonDraft"
            @input="resizeJsonEditor($el)" spellcheck="false"></textarea>
        <div class="json-editor-message json-editor-error" x-show="jsonEditError" x-text="jsonEditError" role="alert"></div>
        <div class="json-editor-message" x-show="jsonSaveMessage" x-text="jsonSaveMessage" role="status"></div>
    </div>

</div>

<script>
    function costNumber(value) {
        return Number(String(value ?? '').replace(/,/g, '')) || 0;
    }

    function costCalculator() {
        const cycleTypes = [
            '자재', '노무', '경비', '손료', '일위대가', '건설기계', '표준시장단가',
            '간접재료비', '작업설, 부산물', '추가경비', '부가세 미포함', '부가세 포함',
            '견적단가', '외주비', '도급자관급', '관급자관급'
        ];

        return {
            currentView: 'view1',
            rows: [],
            selectedIndex: null,
            jsonEditing: false,
            jsonDraft: '',
            jsonOriginal: '',
            jsonEditError: '',
            jsonSaveMessage: '',
            showMyData: false,
            showCart: false,
            cartItems: [],
            dataPanelError: '',
            selectedMyDataIndex: null,
            currentCycleItems: [],
            classifiedItems: {},
            sourceProjectKey: '',
            _availableProjects: null,
            _targetContainer: null,
            _storedCostSnapshot: null,
            currentProjectKey: null,

            projectKeys: [],
            selectedProjectKey: '',
            availableCategories: [],
            selectedCategoryKey: '',
            subItemKey: '',
            parentItem: null,

            cycleTypes,
            cycleIndex: 0,

            get currentCycleTypeName() {
                return this.cycleTypes[this.cycleIndex];
            },

            get availableCycleTypes() {
                return this.cycleTypes.filter(type => this.classifiedItems[type]?.length > 0);
            },

            toggleDataPanel(panel) {
                this.resetJsonEditor();
                const isOpen = panel === 'cart' ? this.showCart : this.showMyData;
                this.showMyData = panel === 'project' && !isOpen;
                this.showCart = panel === 'cart' && !isOpen;
                this.selectedIndex = null;
                this.selectedMyDataIndex = null;
                this.dataPanelError = '';

                if (this.showCart) {
                    try {
                        const option = JSON.parse(localStorage.getItem('option') || '{}');
                        const items = option?.['나의데이터'];
                        if (items != null && !Array.isArray(items)) {
                            throw new Error('나의데이터가 배열이 아닙니다.');
                        }
                        this.cartItems = items || [];
                    } catch (error) {
                        console.error('장바구니를 불러오지 못했습니다.', error);
                        this.cartItems = [];
                        this.dataPanelError = '장바구니를 불러오지 못했습니다.';
                    }
                }
                this.updateCurrentCycleItems();
            },

            updateCurrentCycleItems() {
                this.classifiedItems = this.getProjectClassifiedItems();
                if (!this.classifiedItems[this.currentCycleTypeName]?.length && this.availableCycleTypes.length) {
                    this.cycleIndex = this.cycleTypes.indexOf(this.availableCycleTypes[0]);
                }
                this.currentCycleItems = this.classifiedItems[this.currentCycleTypeName] || [];
                this.selectedMyDataIndex = null;
            },

            changeCycleType(typeName) {
                const idx = this.cycleTypes.indexOf(typeName);
                if (idx !== -1) {
                    this.cycleIndex = idx;
                    this.selectedMyDataIndex = null;
                    this.updateCurrentCycleItems();
                }
            },

            cycleBottomType() {
                const types = this.availableCycleTypes;
                if (!types.length) return;
                const next = (types.indexOf(this.currentCycleTypeName) + 1) % types.length;
                this.changeCycleType(types[next]);
            },

            addSelectedMyItem() {
                if (this.selectedMyDataIndex === null || !this.currentCycleItems[this.selectedMyDataIndex]) return;
                const entry = this.currentCycleItems[this.selectedMyDataIndex];
                this.addItemToCurrent(entry.data, entry.type);
            },

            get canGoBack() {
                return this.subItemKey !== "" && this.subItemKey != null && this.subItemKey !== "null" && this.subItemKey !== "undefined";
            },

            get canEnterSelected() {
                if (this.selectedIndex === null || !this.rows[this.selectedIndex]) return false;
                const row = this.rows[this.selectedIndex];
                const t = String(row.type || row.타입 || row.구분 || '').trim();
                return t.includes('일위대가') || t.includes('건설기계');
            },

            get jsonPreview() {
                const row = this.rows[this.selectedIndex];
                if (!row) return '';
                if (row.type !== '건설기계') return JSON.stringify(row, null, 2);
                const preview = JSON.parse(JSON.stringify(row));
                const hideDetails = value => {
                    if (!value || typeof value !== 'object') return;
                    for (const key of Object.keys(value)) {
                        if (key === 'detail' && typeof value[key] === 'string' && value[key]) {
                            value[key] = '[...]';
                        } else {
                            hideDetails(value[key]);
                        }
                    }
                };
                hideDetails(preview.children);
                return JSON.stringify(preview, null, 2);
            },

            get nestingDepthNumber() {
                if (!this.subItemKey || this.subItemKey === "") return "";
                const depth = String(this.subItemKey).split('-').length;
                return `(${depth})`;
            },

            views: {
                view1: {
                    label: '기본사항',
                    columns: [
                        {

                                costNumber(r.노무비단가) +

                            ),
                            totalFn: () => '-'
                        },

                    ]
                },
                view2: {
                    label: '단가입력 및 금액보기',
                    columns: [
                        { key: '수량', title: '수량', type: 'input-num', width: '40px', alignClass: 'text-right' },
                        { key: '재료비단가', title: '재료비단가', type: 'input-num', width: '65px', alignClass: 'text-right' },
                        { key: '노무비단가', title: '노무비단가', type: 'input-num', width: '65px', alignClass: 'text-right' },
                        { key: '경비단가', title: '경비단가', type: 'input-num', width: '65px', alignClass: 'text-right' },
                        {
                            key: '재료비', title: '재료비', type: 'calc', width: '65px', alignClass: 'text-right',
                            calcFn: r => costNumber(r.수량) * costNumber(r.재료비단가),
                            totalFn: () => '-'
                        },
                        {
                            key: '노무비', title: '노무비', type: 'calc', width: '65px', alignClass: 'text-right',
                            calcFn: r => costNumber(r.수량) * costNumber(r.노무비단가),
                            totalFn: () => '-'
                        },
                        {
                            key: '경비', title: '경비', type: 'calc', width: '65px', alignClass: 'text-right',
                            calcFn: r => costNumber(r.수량) * costNumber(r.경비단가),
                            totalFn: () => '-'
                        },
                        {
                            key: '단가합계', title: '단가합계', type: 'calc', width: '65px', alignClass: 'text-right',
                            calcFn: r => costNumber(r.재료비단가) + costNumber(r.노무비단가) + costNumber(r.경비단가),
                            totalFn: () => '-'
                        },
                        {
                            key: '합계', title: '합계', type: 'calc', width: '65px', alignClass: 'text-right',
                            calcFn: r => costNumber(r.수량) * (
                                costNumber(r.재료비단가) +
                                costNumber(r.노무비단가) +
                                costNumber(r.경비단가)
                            ),
                            totalFn: () => '-'
                        },
                        { key: 'action', title: '-', type: 'action', width: '12px', alignClass: 'text-center' }
                    ]
                },
            },

            get currentColumns() {
                return this.views[this.currentView].columns;
            },

            init() {
                this.loadProjectsList();
                this.loadDataFromOption();
                this.sourceProjectKey = this.currentProjectKey || '';
                this.updateCurrentCycleItems();
                if (typeof BroadcastChannel !== 'undefined' && globalThis.crypto?.randomUUID) {
                    const targetId = crypto.randomUUID();
                    const channel = new BroadcastChannel('cost-estimate-add');
                    channel.onmessage = event => {
                        const message = event.data;
                        switch (message?.type) {
                            case 'discover':
                                if (this._targetContainer) {
                                    channel.postMessage({ type: 'available', requestId: message.requestId, targetId });
                                }
                                break;
                            case 'add':
                                if (message.targetId === targetId) {
                                    try {
                                        this.addExternalEstimate(message.item);
                                        channel.postMessage({ type: 'result', requestId: message.requestId, targetId, success: true });
                                    } catch (error) {
                                        console.error('내역서 항목 추가 실패:', error);
                                        channel.postMessage({ type: 'result', requestId: message.requestId, targetId, success: false, error: error.message });
                                    }
                                }
                                break;
                        }
                    };
                }
            },

            loadProjectsList() {
                try {
                    const projects = JSON.parse(localStorage.getItem("cost") || "{}");
                    this.projectKeys = Object.keys(projects);
                } catch (e) {
                    this.projectKeys = [];
                }
            },

            onProjectChange() {
                this.resetJsonEditor();
                this.sourceProjectKey = this.selectedProjectKey || '';
                this.selectedMyDataIndex = null;
                this.selectedCategoryKey = '';
                this.subItemKey = '';
                this.parentItem = null;
                this.rows = [];
                this._targetContainer = null;
                this.updateAvailableCategories();

                try {
                    const optData = JSON.parse(localStorage.getItem("option") || "{}");
                    optData.comboboxsave = {
                        projectKey: this.selectedProjectKey,
                        categoryKey: '',
                        subItemKey: ''
                    };
                    localStorage.setItem("option", JSON.stringify(optData));
                } catch (e) { }

                this.loadDataFromOption();
            },

            updateAvailableCategories(projects) {
                this.availableCategories = [];
                if (!this.selectedProjectKey) return;

                try {
                    projects = projects || JSON.parse(localStorage.getItem("cost") || "{}");
                    this._availableProjects = projects; // 여기도 안전하게 추가
                    const proj = projects[this.selectedProjectKey];
                    if (!proj || !proj.공종별내역서) return;

                    let list = [];
                    proj.공종별내역서.forEach((group, gIdx) => {
                        if (Array.isArray(group)) {
                            group.forEach((cat, cIdx) => {
                                if (cat) {
                                    let groupName = cat.품명 || cat.name || cat.title || cat.공종 || cat.구분 || `공종그룹 ${gIdx}-${cIdx}`;
                                    list.push({
                                        key: `${gIdx}-${cIdx}`,
                                        label: `건축 / ${groupName}`
                                    });
                                }
                            });
                        }
                    });
                    this.availableCategories = list;
                } catch (e) { }
            },

            onCategoryChange() {
                this.resetJsonEditor();
                this.subItemKey = '';
                this.parentItem = null;
                try {
                    const optData = JSON.parse(localStorage.getItem("option") || "{}");
                    if (optData.comboboxsave) {
                        optData.comboboxsave.categoryKey = this.selectedCategoryKey;
                        optData.comboboxsave.subItemKey = '';
                        localStorage.setItem("option", JSON.stringify(optData));
                    }
                } catch (e) { }

                this.loadDataFromOption();
            },

            loadDataFromOption() {
                try {
                    this._storedCostSnapshot = localStorage.getItem("cost");
                    const projects = JSON.parse(this._storedCostSnapshot || "{}");
                    this._availableProjects = projects; // 👈 💡 [핵심 수정] 프로젝트 데이터를 함수 시작하자마자 무조건 담아줌!

                    const opt = JSON.parse(localStorage.getItem("option") || "{}")?.comboboxsave;

                    if (opt?.projectKey) {
                        this.selectedProjectKey = opt.projectKey;
                        this.currentProjectKey = opt.projectKey;
                        this.updateAvailableCategories(projects);
                    } else {
                        this.selectedProjectKey = '';
                        this.currentProjectKey = null;
                        this.availableCategories = [];
                    }

                    if (!opt?.projectKey || !opt?.categoryKey) {
                        this.selectedCategoryKey = opt?.categoryKey || '';
                        this.subItemKey = '';
                        this.parentItem = null;
                        this.rows = [];
                        this._targetContainer = null;
                        this.updateCurrentCycleItems(); // 이제 _availableProjects가 있으므로 나의 데이터가 정상 작동함!
                        return;
                    }

                    this.selectedCategoryKey = opt.categoryKey;
                    this.subItemKey = opt.subItemKey || '';

                    const [gIdx, cIdx] = String(opt.categoryKey).split('-').map(Number);
                    const cat = projects[opt.projectKey]?.공종별내역서?.[gIdx]?.[cIdx];

                    if (!cat) {
                        this.rows = [];
                        this.parentItem = null;
                        this._targetContainer = null;
                        this.updateCurrentCycleItems();
                        return;
                    }

                    cat.children ??= [];
                    let target = cat.children;
                    let currentParent = null;

                    const subKey = this.subItemKey;
                    if (subKey !== "" && subKey != null && subKey !== "null" && subKey !== "undefined") {
                        const indices = String(subKey).split('-').map(Number);
                        for (let idx of indices) {
                            if (target[idx]) {
                                currentParent = target[idx];
                                currentParent.children ??= [];
                                target = currentParent.children;
                            } else {
                                target = [];
                                currentParent = null;
                                break;
                            }
                        }
                    }

                    this._targetContainer = target;
                    this.rows = target;
                    this.parentItem = currentParent;
                    this.updateCurrentCycleItems();
                } catch (e) {
                    this.rows = [];
                    this.parentItem = null;
                    this._targetContainer = null;
                    this.updateCurrentCycleItems();
                }
            },

            saveCostData() {
                try {
                    if (this._availableProjects) {
                        const serialized = JSON.stringify(this._availableProjects);
                        localStorage.setItem("cost", serialized);
                        this._storedCostSnapshot = serialized;
                        this.updateCurrentCycleItems();
                    }
                } catch (e) {
                    console.error('공사비 데이터를 저장하지 못했습니다.', e);
                }
            },

            selectRow(index) {
                this.resetJsonEditor();
                this.selectedIndex = this.selectedIndex === index ? null : index;
                this.showMyData = false;
                this.showCart = false;
            },

            resetJsonEditor() {
                this.jsonEditing = false;
                this.jsonDraft = '';
                this.jsonOriginal = '';
                this.jsonEditError = '';
                this.jsonSaveMessage = '';
            },

            resizeJsonEditor(element) {
                if (!element) return;
                element.style.height = 'auto';
                element.style.height = `${element.scrollHeight}px`;
            },

            startJsonEdit() {
                if (this.selectedIndex === null || !this.rows[this.selectedIndex]) return;
                if (this.rows[this.selectedIndex].type === '건설기계') {
                    this.openMachineEditor();
                    return;
                }
                this.jsonOriginal = JSON.stringify(this.rows[this.selectedIndex]);
                this.jsonDraft = JSON.stringify(this.rows[this.selectedIndex], null, 2);
                this.jsonEditError = '';
                this.jsonSaveMessage = '';
                this.jsonEditing = true;
                this.$nextTick(() => this.resizeJsonEditor(this.$refs.jsonEditor));
            },

            openMachineEditor() {
                this.jsonEditError = '';
                try {
                    if (!this._targetContainer || localStorage.getItem('cost') !== this._storedCostSnapshot) {
                        throw new Error('내역서가 변경되었습니다. 새로고침 후 다시 수정해 주세요.');
                    }
                    const item = this._targetContainer[this.selectedIndex];
                    if (!item || item.type !== '건설기계') {
                        throw new Error('수정할 건설기계 항목을 찾을 수 없습니다.');
                    }
                    const option = JSON.parse(localStorage.getItem('option') || '{}');
                    if (!option || typeof option !== 'object' || Array.isArray(option)) {
                        throw new Error('option 데이터 형식이 올바르지 않습니다.');
                    }
                    const machineData = option.machineData ?? {};
                    if (typeof machineData !== 'object' || Array.isArray(machineData)) {
                        throw new Error('기계 데이터 형식이 올바르지 않습니다.');
                    }
                    option.machineData = {
                        ...machineData,
                        activeMode: 'edit-estimate',
                        edit: { ...item },
                        estimateEdit: {
                            projectKey: this.selectedProjectKey,
                            categoryKey: this.selectedCategoryKey,
                            subItemKey: this.canGoBack ? this.subItemKey : '',
                            rowIndex: this.selectedIndex,
                            original: JSON.stringify(item)
                        }
                    };
                    delete option.machineData.activeSource;
                    delete option.machineData.editOriginPath;
                    option.redirect = window.location.href;
                    const editUrl = new URL('https://study-with-words.blogspot.com/2026/10/blog-post_12.html?group=group3&sub=sub3');
                    editUrl.searchParams.set('edit', 'estimate');
                    localStorage.setItem('option', JSON.stringify(option));
                    window.location.href = editUrl.href;
                } catch (error) {
                    console.error('건설기계 수정 준비 실패:', error);
                    this.jsonEditError = `수정 화면을 열지 못했습니다: ${error.message}`;
                }
            },

            saveJsonEdit() {
                this.jsonEditError = '';
                this.jsonSaveMessage = '';
                let edited;
                try {
                    edited = JSON.parse(this.jsonDraft);
                } catch (error) {
                    console.error('JSON 문법 오류:', error);
                    this.jsonEditError = 'JSON 문법이 올바르지 않습니다. 따옴표, 쉼표, 콜론과 괄호를 확인해 주세요.';
                    return;
                }
                if (!edited || typeof edited !== 'object' || Array.isArray(edited)) {
                    this.jsonEditError = '항목은 JSON 객체여야 합니다.';
                    return;
                }
                window.migrateItemNames(edited);

                let projects, target, parents, serialized;
                try {
                    if (this.selectedIndex === null || !this._targetContainer ||
                        JSON.stringify(this._targetContainer[this.selectedIndex]) !== this.jsonOriginal) {
                        throw new Error('선택한 항목이 변경되었습니다. 다시 선택한 후 수정해 주세요.');
                    }
                    if (localStorage.getItem('cost') !== this._storedCostSnapshot) {
                        throw new Error('다른 화면에서 내역서가 변경되었습니다. 새로고침 후 다시 수정해 주세요.');
                    }
                    projects = JSON.parse(JSON.stringify(this._availableProjects));
                    ({ target, parents } = this.resolveCurrentTarget(projects));
                    if (JSON.stringify(target[this.selectedIndex]) !== this.jsonOriginal) {
                        throw new Error('선택한 항목이 변경되었습니다. 다시 선택한 후 수정해 주세요.');
                    }
                    target[this.selectedIndex] = edited;
                    this.recalculateEstimateParents(parents);
                    serialized = JSON.stringify(projects);
                    localStorage.setItem('cost', serialized);
                } catch (error) {
                    console.error('JSON 항목 저장 실패:', error);
                    this.jsonEditError = `항목을 저장하지 못했습니다: ${error.message}`;
                    return;
                }
                this._storedCostSnapshot = serialized;
                this._availableProjects = projects;
                this._targetContainer = target;
                this.rows = target;
                this.parentItem = parents.length ? parents[parents.length - 1] : null;
                this.updateCurrentCycleItems();
                this.jsonEditing = false;
                this.jsonSaveMessage = '저장했습니다.';
            },

            addRow() {
                if (!this._targetContainer) return;
                this.resetJsonEditor();
                this._targetContainer.push({
                    type: '자재',
                    품명: '',
                    규격: '',
                    단위: '',
                    수량: 0,
                    재료비: '0',
                    노무비: '0',
                    경비: '0',
                });
                this.rows = this._targetContainer;
                this.selectedIndex = this.rows.length - 1;
                this.showMyData = false;
                this.showCart = false;
                this.saveCostData();
            },

            editSelected() {
                if (!this.canEnterSelected) return;
                this.resetJsonEditor();
                const selectedRow = this.rows[this.selectedIndex];
                selectedRow.children ??= [];

                try {
                    const optData = JSON.parse(localStorage.getItem("option") || "{}");
                    if (optData.comboboxsave) {
                        const currentSubKey = optData.comboboxsave.subItemKey;
                        if (currentSubKey === "" || currentSubKey == null || currentSubKey === "null" || currentSubKey === "undefined") {
                            optData.comboboxsave.subItemKey = String(this.selectedIndex);
                        } else {
                            optData.comboboxsave.subItemKey = currentSubKey + "-" + this.selectedIndex;
                        }

                        this.subItemKey = optData.comboboxsave.subItemKey;
                        localStorage.setItem("option", JSON.stringify(optData));
                        this.loadDataFromOption();
                        this.selectedIndex = null;
                    }
                } catch (e) { }
            },

            goBack() {
                this.resetJsonEditor();
                try {
                    const optData = JSON.parse(localStorage.getItem("option") || "{}");
                    if (optData.comboboxsave && optData.comboboxsave.subItemKey) {
                        const parts = String(optData.comboboxsave.subItemKey).split('-');
                        parts.pop();
                        optData.comboboxsave.subItemKey = parts.length > 0 ? parts.join('-') : "";

                        this.subItemKey = optData.comboboxsave.subItemKey;
                        localStorage.setItem("option", JSON.stringify(optData));
                        this.loadDataFromOption();
                        this.selectedIndex = null;
                    }
                } catch (e) { }
            },

            createItemFields(item, type) {
                return {
                    type,
                    품명: item.품명 || '',
                    규격: item.규격 || '',
                    단위: item.단위 || '',
                    수량: 1,
                    재료비단가: item.재료비단가 ?? item.재료비 ?? 0,
                    노무비단가: item.노무비단가 ?? item.노무비 ?? 0,
                    경비단가: item.경비단가 ?? item.경비 ?? 0
                };
            },

            addItemToCurrent(item, type) {
                if (!this._targetContainer) return;
                const newItem = { ...JSON.parse(JSON.stringify(item)), ...this.createItemFields(item, type) };
                this.updateRowCosts(newItem);
                this._targetContainer.push(newItem);
                this.rows = this._targetContainer;
                this.saveCostData();
            },

            resolveCurrentTarget(projects) {
                const [groupIndex, categoryIndex] = this.selectedCategoryKey.split('-').map(Number);
                const category = projects[this.selectedProjectKey]?.공종별내역서?.[groupIndex]?.[categoryIndex];
                if (!category || !Array.isArray(category.children)) {
                    throw new Error('선택한 공종그룹을 찾을 수 없습니다.');
                }
                let target = category.children;
                const parents = [];
                if (this.canGoBack) {
                    for (const index of this.subItemKey.split('-').map(Number)) {
                        const parent = target[index];
                        if (!parent || !Array.isArray(parent.children)) {
                            throw new Error('선택한 세부항목을 찾을 수 없습니다.');
                        }
                        parents.push(parent);
                        target = parent.children;
                    }
                }
                return { target, parents };
            },

            recalculateEstimateParents(parents) {
                for (let i = parents.length - 1; i >= 0; i--) {
                    const parent = parents[i];
                    for (const key of ['재료비단가', '노무비단가', '경비단가']) {
                        parent[key] = parent.children.reduce((sum, child) =>
                            sum + costNumber(child.수량) * costNumber(child[key]), 0);
                    }
                    this.updateRowCosts(parent);
                }
            },

            addExternalEstimate(item) {
                if (!this._targetContainer || !this._availableProjects) {
                    throw new Error('항목추가 화면에서 프로젝트와 공종그룹을 선택해 주세요.');
                }
                if (!item || !['일위대가', '자재'].includes(item.type)) {
                    throw new Error('추가할 항목 데이터가 올바르지 않습니다.');
                }
                if (localStorage.getItem('cost') !== this._storedCostSnapshot) {
                    throw new Error('다른 화면에서 내역서가 변경되었습니다. 항목추가 화면을 새로고침한 후 다시 시도해 주세요.');
                }

                const projects = JSON.parse(JSON.stringify(this._availableProjects));
                const { target, parents } = this.resolveCurrentTarget(projects);
                const newItem = { ...item, ...this.createItemFields(item, item.type) };
                this.updateRowCosts(newItem);
                target.push(newItem);
                this.recalculateEstimateParents(parents);
                const serialized = JSON.stringify(projects);
                localStorage.setItem('cost', serialized);
                this._storedCostSnapshot = serialized;
                this._availableProjects = projects;
                this._targetContainer = target;
                this.rows = target;
                this.parentItem = parents.length ? parents[parents.length - 1] : null;
                this.updateCurrentCycleItems();
            },

            removeRow(index) {
                if (!this._targetContainer) return;
                const item = this._targetContainer[index];
                const message = `'${item.품명 || '선택한 항목'}'을(를) 삭제하시겠습니까?` +
                    (item.children?.length ? '\n하위 항목도 함께 삭제됩니다.' : '');
                if (!confirm(message)) return;
                if (this.selectedIndex === index) this.resetJsonEditor();
                this._targetContainer.splice(index, 1);
                this.rows = this._targetContainer;
                if (this.selectedIndex === index) {
                    this.selectedIndex = null;
                } else if (this.selectedIndex > index) {
                    this.selectedIndex--;
                }
                this.saveCostData();
            },

            moveSelected(direction) {
                if (this.selectedIndex === null || !this._targetContainer) return;
                const targetIndex = this.selectedIndex + direction;
                if (targetIndex < 0 || targetIndex >= this.rows.length) return;

                this.resetJsonEditor();
                const item = this._targetContainer.splice(this.selectedIndex, 1)[0];
                this._targetContainer.splice(targetIndex, 0, item);
                this.rows = this._targetContainer;
                this.selectedIndex = targetIndex;
                this.saveCostData();
            },

            getProjectClassifiedItems() {
                const classified = {};
                this.cycleTypes.forEach(t => classified[t] = []);

                if (this.showCart) {
                    for (const item of this.cartItems) {
                        if (!item || typeof item !== 'object' || Array.isArray(item)) continue;
                        const type = String(item.type || item.타입 || item.구분 || '자재').trim();
                        if (!classified[type]) classified[type] = [];
                        classified[type].push({ data: item, type });
                    }
                    return classified;
                }

                if (!this._availableProjects) return classified;

                const sourceKeys = this.sourceProjectKey
                    ? [this.sourceProjectKey]
                    : Object.keys(this._availableProjects);

                const traverseNet = (items, sourceProjectKey) => {
                    if (!Array.isArray(items)) return;
                    for (let item of items) {
                        if (item && (item.품명 || item.규격 || item.수량 !== undefined)) {
                            let t = item.type || item.타입 || item.구분 || '자재';
                            t = String(t).trim();

                            if (!classified[t]) {
                                classified[t] = [];
                            }

                            classified[t].push({ data: item, type: t, sourceProjectKey });
                        }
                        if (item && item.children) {
                            traverseNet(item.children, sourceProjectKey);
                        }
                    }
                };

                for (const sourceProjectKey of sourceKeys) {
                    const proj = this._availableProjects[sourceProjectKey];
                    if (!proj) continue;

                    if (proj.공종별내역서) {
                        for (let group of proj.공종별내역서) {
                            if (Array.isArray(group)) {
                                for (let cat of group) {
                                    if (cat && cat.children) traverseNet(cat.children, sourceProjectKey);
                                }
                            } else if (group && group.children) {
                                traverseNet(group.children, sourceProjectKey);
                            }
                        }
                    }

                    if (proj.일위대가 && Array.isArray(proj.일위대가)) {
                        if (!classified['일위대가']) classified['일위대가'] = [];
                        for (let item of proj.일위대가) {
                            if (item && (item.품명 || item.규격 || item.수량 !== undefined)) {
                                classified['일위대가'].push({ data: item, type: '일위대가', sourceProjectKey });
                            }
                        }
                    }
                }
                return classified;
            },

            updateParentCosts() {
                if (!this.parentItem || !this.selectedCategoryKey) return;
                try {
                    const [groupIndex, categoryIndex] = this.selectedCategoryKey.split('-').map(Number);
                    let items = this._availableProjects[this.selectedProjectKey]?.공종별내역서?.[groupIndex]?.[categoryIndex]?.children;
                    if (!items) return;

                    const parents = this.subItemKey.split('-').map(index => {
                        const parent = items[Number(index)];
                        items = parent?.children || [];
                        return parent;
                    });

                    for (let i = parents.length - 1; i >= 0; i--) {
                        const parent = parents[i];
                        if (!parent || !parent.children) continue;

                        for (const key of ['재료비단가', '노무비단가', '경비단가']) {
                            parent[key] = parent.children.reduce((sum, item) => {
                                return sum + costNumber(item.수량) * costNumber(item[key]);
                            }, 0);
                        }
                        this.updateRowCosts(parent);
                    }
                } catch (e) { }
            },

            updateRowCosts(row) {
                for (const key of ['재료비', '노무비', '경비']) {
                    row[key] = (costNumber(row.수량) * costNumber(row[key + '단가']))
                        .toLocaleString('ko-KR', { maximumFractionDigits: 20 });
                }

                row.단가합계 = (
                    costNumber(row.재료비단가) +
                    costNumber(row.노무비단가) +
                    costNumber(row.경비단가)
                ).toLocaleString('ko-KR', { maximumFractionDigits: 20 });
                row.합계 = (
                    costNumber(row.재료비) +
                    costNumber(row.노무비) +
                    costNumber(row.경비)
                ).toLocaleString('ko-KR', { maximumFractionDigits: 20 });
            },

            formatInput(event, row, key) {
                let val = event.target.value.replace(/[^0-9.]/g, '');
                row[key] = val === '' ? 0 : Number(val);
                this.updateRowCosts(row);
                this.updateParentCosts();
                this.saveCostData();
            },

            getDisplayValue(val) {
                if (val === '-' || isNaN(val) || val === '' || val == 0) return val || '';
                return Number(val).toLocaleString();
            },

            formatNum(val, isTotal = false) {
                if (val === '-' || isNaN(val)) return '-';
                return isTotal
                    ? Number(val || 0).toLocaleString('ko-KR', { maximumFractionDigits: 2 })
                    : Number(val || 0).toLocaleString();
            }
        };
    }
</script>
