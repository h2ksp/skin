<style>
    #print-container {
        position: relative;
        z-index: 200;
    }

    .unit-price-list {
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.85rem;
        text-align: left;
    }

    .unit-price-list .estimate-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        background: #f9f9f9e7;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 5px 16px;
        margin: 16px 0;
    }

    .unit-price-list .major-group-totals {
        margin-left: auto;
        margin-right: 16px;
        color: #475569;
        font-size: 15px;
        font-weight: 400;
        text-align: right;
        white-space: nowrap;
    }

    .unit-price-list .amount-display-options {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin: 0;
    }

    .unit-price-list .amount-display-options label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
    }

    .unit-price-list .amount-display-options input {
        margin: 0;
    }

    .unit-price-list .level1-amount-summary {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
    }

    .unit-price-list .level1-amount-summary-move-spacer {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        font-size: 11px;
        visibility: hidden;
    }

    .unit-price-list .level1-amount-summary-label {
        flex: 0 0 63px;
        text-align: right;
        white-space: nowrap;
    }

    .unit-price-list .level1-amount-summary-spacer {
        flex: 0 0 auto;
    }

    #print-container .unit-price-list input.item-amount-display {
        flex-shrink: 0;
        width: 110px;
        text-align: right;
    }

    #print-container .unit-price-list input.level1-amount-display {
        flex-shrink: 0;
        width: 110px;
        text-align: right;
    }

    .unit-price-list .estimate-item-row:hover {
        background: #f1f5f9;
    }

    .unit-price-list .estimate-item-row.is-selected {
        background: #dbeafe;
    }

    .unit-price-list .move-arrow {
        font-size: 11px;
    }

    /* 표 스타일 (.table-container 내부만 적용) */
    .table-container {
        overflow-x: auto;
        margin-top: 15px;

    }

    /* 클릭 가능한 행 스타일 (마우스 호버 효과) */
    .table-container tr.clickable-row {
        cursor: pointer;
    }

    /* 마우스를 올렸을 때 연한 하늘색/배경 변경 */
    .table-container tr.clickable-row:hover {
        background-color: #e0f2fe !important;
        /* 약간 밝은 파란색으로 선택 효과 */
    }

    /* .table-container 안의 table */
    .table-container table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
    }

    /* .table-container 안의 th, td */
    .table-container th,
    .table-container td {
        border-bottom: 1px solid #ddd;
        padding-left: 8px;
    }

    /* .table-container 내부의 text-right 클래스에 우측 정렬 적용 */
    .table-container .text-right {
        text-align: right;
    }

    .mText {
        font-size: 16px;
        font-weight: 700;
        color: #333333;
        font-style: italic;
        padding-left: 10px;
        text-align: left;
    }

    button {
        cursor: pointer;
    }

    #print-container input[type="text"],
    #print-container input[type="number"] {
        padding: 5px 8px;
        text-align: left;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-size: 0.9rem;
        box-sizing: border-box;
    }

    #print-container input[type="text"]:focus,
    #print-container input[type="number"]:focus {
        outline: 2px solid #93c5fd;
        outline-offset: 1px;
    }

    /* 단위/수량 등 중앙 정렬이 필요한 인풋 처리 */
    #print-container input.text-center {
        text-align: center;
    }

    /* 숫자 입력 화살표(스핀 버튼) 깔끔하게 제거 */
    #print-container input[type="number"]::-webkit-outer-spin-button,
    #print-container input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }


    /* 2. placeholder 힌트 글자 스타일 */
    #print-container input::placeholder {
        color: #94a3b8;
        font-size: 13px;
        font-weight: 400;
    }

    /* 3. 비활성화 링크 스타일 */
    #print-container a.disabled {
        color: #ccc !important;
        cursor: default !important;
        text-decoration: none;
        pointer-events: none;
    }

    #print-container select {
        padding: 5px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background: #fff;
        font-size: 0.9rem;
    }

    /* 1. 기본 span 텍스트 스타일 */
    #print-container span {
        font-size: 13px;
        font-weight: 500;
        color: #4b5563;
        /* 가독성 좋은 다크 회색 */
        line-height: 1.4;
        user-select: none;
        /* 선택 영역 방지 (UI 깔끔하게) */
    }

    /* 2. 라벨 영역의 좌측/우측 span (단가:, 재료비:, 단위 등) */
    #print-container label>span {
        color: #374151;
        /* 일반 텍스트보다 살짝 진한 색상 */
        font-size: 13px;
    }

    /* 3. 트리 구조 화살표 및 기호 텍스트 (┕ 등) */
    #print-container .tree-symbol,
    #print-container span:contains("┕") {
        color: #9ca3af;
        /* 옅은 회색으로 주 보조 구분선 느낌 */
        font-weight: normal;
    }

    /* 4. 일반 텍스트 (li, div 등의 기본 텍스트) */
    /* #print-container {
        color: #333333;
        font-size: 13px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    } */

    /* 5. 강조용 span (필요시 class="fw-bold" 적용) */
    #print-container span.fw-bold {
        font-weight: 700;
        color: #111827;
    }

    /* 6. 연한 안내용 span (필요시 class="text-muted" 적용) */
    #print-container span.text-muted {
        color: #9ca3af;
        font-size: 12px;
    }
</style>


<div id="print-container" x-data="appData()" x-init="init()" style="margin-left: -190px;width: calc(100% + 190px)">


    <div class="unit-price-list" style="width: 100%; margin-bottom: 800px;">

        <!-- 최상단 컨트롤 영역 -->
        <div class="estimate-toolbar">
            <label for="costEstimateProject">공종별 내역서 :</label>
            <select id="costEstimateProject" x-model="activeProject" @change="saveActiveProject()"
                style="width: 300px;">
                <option value="">프로젝트 선택</option>
                <template x-for="proj in projectList" :key="proj">
                    <option :value="proj" x-text="proj" :selected="proj === activeProject"></option>
                </template>
            </select>
            <select x-model="activeGroup" @change="saveActiveGroup()" style="width: 150px;">
                <option value="">전체보기</option>
                <template x-for="(group, idx) in groupList" :key="idx">
                    <option :value="idx" x-text="group"></option>
                </template>
            </select>
            <div class="amount-display-options" role="radiogroup" aria-label="항목 금액 표시">
                <label><input type="radio" name="amountDisplayField" value="재료비"
                        x-model="amountDisplayField">재료비</label>
                <label><input type="radio" name="amountDisplayField" value="노무비"
                        x-model="amountDisplayField">노무비</label>
                <label><input type="radio" name="amountDisplayField" value="경비"
                        x-model="amountDisplayField">경비</label>
                <label><input type="radio" name="amountDisplayField" value="합계"
                        x-model="amountDisplayField">합계</label>
            </div>
            <div style="display: flex; gap: 8px; margin-left: auto;">
                <button type="button" @click="editGroups()">그룹편집</button>
                <button type="button" @click="showMoveButtons = !showMoveButtons"

            </div>

        </div>

        <ul id="group-list" style="margin-left: 0; padding-left: 0; list-style: none;">
            <template x-for="(groupName, gIndex) in groupList" :key="gIndex">
                <li x-show="activeGroup === '' || Number(activeGroup) === gIndex">

                    <div style="display: flex; align-items: center;">
                        <div id="title" x-text="groupName"></div>
                        <div class="major-group-totals" x-text="formatMajorGroupTotals(gIndex)"
                            aria-label="대분류 합계"></div>

                        <!-- 우측 정렬 컨트롤 -->
                        <div style="display: flex; align-items: center; gap: 11px; font-size: 13px;">
                            <a href="#" class="move-arrow" x-show="showMoveButtons" aria-label="그룹 위로 이동"
                                @click.prevent="if (gIndex > 0) moveUpGroup(gIndex)"
                                :class="{ 'disabled': gIndex === 0 }">▲</a>
                            <a href="#" class="move-arrow" x-show="showMoveButtons" aria-label="그룹 아래로 이동"
                                @click.prevent="if (gIndex < groupList.length - 1) moveDownGroup(gIndex)"
                                :class="{ 'disabled': gIndex === (groupList.length - 1) }">▼</a>
                            <a href="#" @click.prevent="addLevel1(gIndex)" style="font-weight: 500;">+ 공종 추가</a>
                        </div>
                    </div>
                    <hr style="margin-bottom: 8px;">

                    <ul style="margin-bottom: 120px; padding-left: 0; list-style: none;">
                        <template x-for="(lvl1, l1Index) in (subGroupList[gIndex] || [])" :key="l1Index">
                            <li>
                                <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
                                    <input type="text" x-model="lvl1.name" @input="saveToStore()"
                                        placeholder="1차 하위 항목 입력" style="width: 350px;">
                                    <a href="#" class="move-arrow" x-show="showMoveButtons" aria-label="공종 위로 이동"
                                        @click.prevent="if (l1Index > 0) moveUpLevel1(gIndex, l1Index)"
                                        :class="{ 'disabled': l1Index === 0 }">▲</a>
                                    <a href="#" class="move-arrow" x-show="showMoveButtons" aria-label="공종 아래로 이동"
                                        @click.prevent="if (l1Index < subGroupList[gIndex].length - 1) moveDownLevel1(gIndex, l1Index)"
                                        :class="{ 'disabled': l1Index === (subGroupList[gIndex].length - 1) }">▼</a>
                                    <a href="#" @click.prevent="addLevel2(gIndex, l1Index)"> + 추가 </a>
                                    <a href="#" @click.prevent="deleteLevel1(gIndex, l1Index)"
                                        style="color: #dc2626; font-weight: 500; margin-left: 4px; text-decoration: none;">x</a>
                                </div>

                                <ul style="margin-left: 0; margin-bottom: 50px;"
                                    :style="{ paddingLeft: showMoveButtons ? '16px' : '0' }">

                                    <template x-for="(lvl2, l2Index) in (lvl1.children || [])" :key="l2Index">
                                        <div class="estimate-item-row" :class="{ 'is-selected': lvl2.selected }">
                                            <div style="display: flex; align-items: center; gap: 6px;">
                                                <div x-show="showMoveButtons"
                                                    style="display: flex; align-items: center; gap: 6px; font-size: 11px; flex-shrink: 0;">
                                                    <a href="#" class="move-arrow" aria-label="항목 위로 이동"
                                                        @click.prevent="if (l2Index > 0) moveUpLevel2(gIndex, l1Index, l2Index)"
                                                        :class="{ 'disabled': l2Index === 0 }">▲</a>
                                                    <a href="#" class="move-arrow" aria-label="항목 아래로 이동"
                                                        @click.prevent="if (l2Index < lvl1.children.length - 1) moveDownLevel2(gIndex, l1Index, l2Index)"
                                                        :class="{ 'disabled': l2Index === (lvl1.children.length - 1) }">▼</a>
                                                </div>

                                                <!-- 밑줄 스타일 일괄 적용 영역 -->
                                                <input type="text" x-model="lvl2.품명" @input="saveToStore()"
                                                    style="width: 320px;" placeholder="품명">
                                                <input type="text" x-model="lvl2.규격" @input="saveToStore()"
                                                    style="width: 330px;" placeholder="규격">
                                                <input type="text" class="text-center" x-model="lvl2.단위"
                                                    @input="saveToStore()" style="width: 50px;" placeholder="단위">

                                                <input type="text" class="text-center" x-model="lvl2.수량"
                                                    @input="calcItems(lvl2, '수량', $event)" style="width: 65px;"
                                                    placeholder="수량">
                                                <input type="text" class="item-amount-display"
                                                    :value="lvl2[amountDisplayField] || '0'" readonly
                                                    :aria-label="amountDisplayField" :title="amountDisplayField">

                                                <div
                                                    style="margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; flex-shrink: 0;">
                                                    <select x-model="lvl2.type" @change="handleTypeChange(lvl2)"
                                                        style="width: 100px;">
                                                        <option value="자재">자재</option>
                                                        <option value="노무">노무</option>
                                                        <option value="경비">경비</option>
                                                        <option value="손료">손료</option>
                                                        <option value="일위대가">일위대가</option>
                                                        <option value="건설기계">건설기계</option>
                                                        <option value="표준시장단가">표준시장단가</option>

                                                        <option value="간접재료비">간접재료비</option>
                                                        <option value="작업설, 부산물">작업설, 부산물</option>
                                                        <option value="추가경비">추가경비</option>
                                                        <option value="부가세 미포함">부가세 미포함</option>
                                                        <option value="부가세 포함">부가세 포함</option>

                                                        <option value="견적단가">견적단가</option>
                                                        <option value="외주비">외주비</option>
                                                        <option value="도급자관급">도급자관급</option>
                                                        <option value="관급자관급">관급자관급</option>


                                                    </select>
                                                    <a href="#"
                                                        @click.prevent="lvl2.showCost = !lvl2.showCost; saveToStore()"
                                                        style="text-decoration: none; font-weight: 500;">
                                                        상세 &nbsp;<span x-text="lvl2.showCost ? '▲' : '▼'"
                                                            style="font-size: 11px;"></span>
                                                    </a>
                                                    <a href="#"
                                                        @click.prevent="confirm('삭제하시겠습니까?') && deleteLevel2(gIndex, l1Index, l2Index)"
                                                        style="color: #dc2626; text-decoration: none; font-weight: 500;">x</a>
                                                </div>
                                            </div>


                                            <!-- 금액 입력 단가 그리드 영역 -->
                                            <div x-show="lvl2.showCost" style="margin-bottom: 116px;">
                                                <div
                                                    style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 16px; align-items: center; margin-top: 9px;">
                                                    <label
                                                        style="display: flex; align-items: center; gap: 6px; width: 100%;">
                                                        <span style="width: 65px; flex-shrink: 0; text-align: right;">단가
                                                            :</span>
                                                        <input type="text" :value="lvl2.재료비단가"
                                                            @input="calcItems(lvl2, '재료비단가', $event)" placeholder="0"
                                                            style="text-align: right; width: 100%;">
                                                    </label>
                                                    <label
                                                        style="display: flex; align-items: center; gap: 6px; width: 100%;">
                                                        <span style="width: 65px; flex-shrink: 0; text-align: right;">단가
                                                            :</span>
                                                        <input type="text" :value="lvl2.노무비단가"
                                                            @input="calcItems(lvl2, '노무비단가', $event)" placeholder="0"
                                                            style="text-align: right; width: 100%;">
                                                    </label>
                                                    <label
                                                        style="display: flex; align-items: center; gap: 6px; width: 100%;">
                                                        <span style="width: 65px; flex-shrink: 0; text-align: right;">단가
                                                            :</span>
                                                        <input type="text" :value="lvl2.경비단가"
                                                            @input="calcItems(lvl2, '경비단가', $event)" placeholder="0"
                                                            style="text-align: right; width: 100%;">
                                                    </label>
                                                    <label
                                                        style="display: flex; align-items: center; gap: 6px; width: 100%;">
                                                        <span
                                                            style="width: 75px; flex-shrink: 0; text-align: right;">단가합계
                                                            :</span>
                                                        <input type="text" :value="lvl2.단가합계"
                                                            @input="calcItems(lvl2, '단가합계', $event)" placeholder="0"
                                                            style="text-align: right; width: 100%;">
                                                    </label>

                                                    <label
                                                        style="display: flex; align-items: center; gap: 6px; width: 100%;">
                                                        <span
                                                            style="width: 65px; flex-shrink: 0; text-align: right;">재료비
                                                            :</span>
                                                        <input type="text" :value="lvl2.재료비"
                                                            @input="calcItems(lvl2, '재료비', $event)" placeholder="0"
                                                            style="text-align: right; width: 100%;">
                                                    </label>
                                                    <label
                                                        style="display: flex; align-items: center; gap: 6px; width: 100%;">
                                                        <span
                                                            style="width: 65px; flex-shrink: 0; text-align: right;">노무비
                                                            :</span>
                                                        <input type="text" :value="lvl2.노무비"
                                                            @input="calcItems(lvl2, '노무비', $event)" placeholder="0"
                                                            style="text-align: right; width: 100%;">
                                                    </label>
                                                    <label
                                                        style="display: flex; align-items: center; gap: 6px; width: 100%;">
                                                        <span style="width: 65px; flex-shrink: 0; text-align: right;">경비
                                                            :</span>
                                                        <input type="text" :value="lvl2.경비" placeholder="0"
                                                            style="text-align: right; width: 100%;" readonly>
                                                    </label>
                                                    <label
                                                        style="display: flex; align-items: center; gap: 6px; width: 100%;">
                                                        <span style="width: 75px; flex-shrink: 0; text-align: right;">합계
                                                            :</span>
                                                        <input type="text" :value="lvl2.합계" placeholder="0"
                                                            style="text-align: right; width: 100%;" readonly>
                                                    </label>
                                                    <label

                                                        <input type="text" x-model="lvl2.비고" @input="saveToStore()"

                                                    </label>
                                                </div>
                                            </div>


                                        </div>
                                    </template>

                                    <div class="level1-amount-summary">
                                        <div class="level1-amount-summary-move-spacer" x-show="showMoveButtons"
                                            aria-hidden="true">
                                            <a href="#" class="move-arrow" tabindex="-1">▲</a>
                                            <a href="#" class="move-arrow" tabindex="-1">▼</a>
                                        </div>
                                        <span class="level1-amount-summary-spacer" style="width: 320px;"></span>
                                        <span class="level1-amount-summary-spacer" style="width: 330px;"></span>
                                        <span class="level1-amount-summary-spacer" style="width: 50px;"></span>
                                        <span class="level1-amount-summary-label">합계 : </span>
                                        <input type="text" class="level1-amount-display"
                                            :value="getLevel1Amount(lvl1)" readonly
                                            :aria-label="`${amountDisplayField} 합계`">
                                    </div>

                                </ul>


                            </li>
                        </template>
                    </ul>


                </li>
            </template>

        </ul>


    </div>

</div>

<script>
    function appData() {
        const option = JSON.parse(localStorage.getItem('option')) || {};
        const activeProject = option?.activeProject || '';
        const store = JSON.parse(localStorage.getItem('cost')) || {}

        return {
            init() {
                // 1. 뒤로 가기로 돌아올 때 실행될 이벤트 리스너 등록
                window.addEventListener('pageshow', (event) => {
                    if (event.persisted || (window.performance && window.performance.getEntriesByType("navigation")[0]?.type === "back_forward")) {

                        // 2. 로컬스토리지에서 최신 cost 데이터를 다시 싹 긁어옴
                        const freshStore = JSON.parse(localStorage.getItem('cost')) || {};
                        this.store = freshStore;

                        // 3. 현재 활성화된 프로젝트 기준으로 화면에 쓰이는 목록들도 최신화!
                        if (this.activeProject && freshStore[this.activeProject]) {
                            this.groupList = freshStore[this.activeProject]?.옵션?.그룹명 || [];
                            this.subGroupList = freshStore[this.activeProject]?.공종별내역서 || {};
                        }

                        console.log("새로고침 없이 최신 데이터 갱신 완료!");
                    }
                });

            },


            activeProject: activeProject,
            projectList: option?.projectList || [],
            store: store,
            showMoveButtons: false,

            // 현재 프로젝트의 그룹 목록 가져오기
            groupList: (activeProject && store[activeProject]?.옵션?.그룹명) || [],
            activeGroup: (activeProject && store[activeProject]?.옵션?.activeGroup !== undefined)
                ? store[activeProject].옵션.activeGroup : '',
            amountDisplayField: '합계',

            // 공종별 내역서 데이터 (없으면 빈 객체)
            subGroupList: (activeProject && store[activeProject]?.공종별내역서) || {},

            getCostTotals(levels) {
                const getNum = (val) => Number(String(val || 0).replace(/,/g, '')) || 0;
                const totals = { 재료비: 0, 노무비: 0, 경비: 0 };

                levels.forEach(level => {
                    (level?.children || []).forEach(item => {
                        totals.재료비 += getNum(item.재료비 || item.재료비단가 || item.prce);
                        totals.노무비 += getNum(item.노무비 || item.노무비단가);
                        totals.경비 += getNum(item.경비 || item.경비단가);
                    });
                });

                totals.합계 = totals.재료비 + totals.노무비 + totals.경비;
                return totals;
            },

            formatMajorGroupTotals(gIndex) {
                const format = value => value.toLocaleString('ko-KR');
                const totals = this.getCostTotals(this.subGroupList[gIndex] || []);
                return `재료비: ${format(totals.재료비)}　노무비: ${format(totals.노무비)}　경비: ${format(totals.경비)}　합계: ${format(totals.합계)}`;
            },

            getLevel1Amount(level1) {
                return this.getCostTotals([level1])[this.amountDisplayField].toLocaleString('ko-KR');
            },

            saveActiveProject() {
                option.activeProject = this.activeProject;
                localStorage.setItem('option', JSON.stringify(option));

                if (this.activeProject && store[this.activeProject]?.옵션?.그룹명) {
                    this.groupList = store[this.activeProject].옵션.그룹명;
                    this.subGroupList = store[this.activeProject].공종별내역서 || {};
                } else {
                    this.groupList = [];
                    this.subGroupList = {};
                }
                this.activeGroup = '';
            },

            // [역할] 현재 변경된 데이터를 스토어에 반영하고 store.save()를 호출해 로컬스토리지에 저장하는 공통 함수
            saveToStore() {
                if (store[this.activeProject]) {
                    if (!store[this.activeProject].옵션) {
                        store[this.activeProject].옵션 = {};
                    }
                    store[this.activeProject].옵션.그룹명 = this.groupList;
                    store[this.activeProject].옵션.activeGroup = this.activeGroup;
                    store[this.activeProject].공종별내역서 = this.subGroupList;

                    localStorage.setItem('cost', JSON.stringify(store));
                    localStorage.setItem('option', JSON.stringify(option));
                }
            },

            // [역할] 타입 변경 시 콘솔 로그를 남기고 스토어에 저장하는 함수
            handleTypeChange(lvl2) {
                console.log("선택된 fg타입:", lvl2);
                this.saveToStore();
            },

            toggleLevel2Selection(gIndex, l1Index, l2Index) {
                const target = this.subGroupList[gIndex]?.[l1Index]?.children?.[l2Index];
                if (!target) return;

                const wasSelected = !!target.selected;
                this.subGroupList.forEach(group => {
                    group?.forEach(level1 => {
                        level1.children?.forEach(level2 => {
                            level2.selected = false;
                        });
                    });
                });
                target.selected = !wasSelected;
            },

            // [역할] 활성 그룹 저장 및 하단 바(Bottom Bar)의 UI 표시 여부를 제어하는 함수
            saveActiveGroup() {
                option.activeGroup = this.activeGroup;
                const bottomBar = this.$refs.bottomBar;

                if (bottomBar) {
                    if (!this.activeGroup && this.activeGroup !== 0) {
                        bottomBar.style.visibility = 'hidden';
                        bottomBar.style.opacity = '0';
                        bottomBar.style.pointerEvents = 'none';
                    } else {
                        bottomBar.style.visibility = 'visible';
                        bottomBar.style.opacity = '1';
                        bottomBar.style.pointerEvents = 'auto';
                    }
                }
                this.saveToStore();
            },

            calcItems(lvl2, field, event) {
                // 1. 입력된 값에서 콤마 제거하고 숫자만 추출
                let rawVal = String(event.target.value).replace(/,/g, '');

                // 2. 숫자가 아니면 비우고, 숫자면 천단위 콤마 포맷으로 데이터에만 반영
                if (isNaN(rawVal) || rawVal === '') {
                    lvl2[field] = '';
                } else {
                    // 💡 event.target.value는 건드리지 않고, 알파인 데이터(lvl2[field])만 갱신!
                    lvl2[field] = Number(rawVal).toLocaleString('ko-KR');
                }

                const getNum = (val) => Number(String(val || 0).replace(/,/g, '')) || 0;

                const qty = getNum(lvl2.수량);
                const i1 = getNum(lvl2.재료비단가);
                const i2 = getNum(lvl2.노무비단가);
                const i3 = getNum(lvl2.경비단가);

                const item4Val = i1 + i2 + i3;
                const item5Val = i1 * qty;
                const item6Val = i2 * qty;
                const item7Val = i3 * qty;
                const item8Val = item5Val + item6Val + item7Val;

                // 3. 결과값들도 콤마 포맷으로 데이터에 반영
                lvl2.단가합계 = item4Val ? item4Val.toLocaleString('ko-KR') : '0';
                lvl2.재료비 = item5Val ? item5Val.toLocaleString('ko-KR') : '0';
                lvl2.노무비 = item6Val ? item6Val.toLocaleString('ko-KR') : '0';
                lvl2.경비 = item7Val ? item7Val.toLocaleString('ko-KR') : '0';
                lvl2.합계 = item8Val ? item8Val.toLocaleString('ko-KR') : '0';

                this.saveToStore();
            },

            // [역할] 숫자에 3자리마다 콤마(,)를 찍어주는 포맷터 함수
            formatNumber(val) {
                if (val === null || val === undefined || val === '') return '0';
                return Number(val).toLocaleString('ko-KR');
            },

            // [역할] 1차 항목을 추가하고 하위 합계 계산용 get 속성을 부여하는 함수
            addLevel1(gIndex) {
                if (!this.subGroupList[gIndex]) {
                    this.subGroupList[gIndex] = [];
                }

                this.subGroupList[gIndex].push({
                    재료비: '',
                    노무비: '',
                    경비: '',
                    합계: '',
                    name: '',
                    children: [],
                });

                this.saveToStore();
            },

            // [역할] 특정 1차 항목 아래에 새로운 2차(자식) 항목을 추가하는 함수
            addLevel2(gIndex, l1Index) {
                if (!this.subGroupList[gIndex] || !this.subGroupList[gIndex][l1Index]) return;
                if (!this.subGroupList[gIndex][l1Index].children) {
                    this.subGroupList[gIndex][l1Index].children = [];
                }

                this.subGroupList[gIndex][l1Index].children.push({
                    showCost: false,
                    type: '자재',
                    품명: '',
                    규격: '',
                    단위: '',
                    수량: 0,
                    재료비단가: '',
                    재료비: '',
                    노무비단가: '',
                    노무비: 0,
                    경비단가: '',
                    경비: 0,
                    단가합계: 0,
                    합계: 0,
                    비고: ''
                });

                this.saveToStore();
            },

            // [역할] 특정 2차 항목을 삭제하는 함수
            deleteLevel2(gIndex, l1Index, l2Index) {
                if (!this.subGroupList[gIndex] || !this.subGroupList[gIndex][l1Index]) return;
                this.subGroupList[gIndex][l1Index].children.splice(l2Index, 1);
                this.saveToStore();
            },

            // [역할] 확인 팝업을 띄운 뒤 특정 1차 항목(하위 품목 포함)을 삭제하는 함수
            deleteLevel1(gIndex, l1Index) {
                if (!this.subGroupList[gIndex]) return;
                const targetName = this.subGroupList[gIndex][l1Index]?.name || '1차 하위 항목';
                if (confirm(`'${targetName}' 항목을 삭제하겠습니까?\n(하위 품목도 함께 삭제됩니다)`)) {
                    this.subGroupList[gIndex].splice(l1Index, 1);
                    this.saveToStore();
                }
            },

            // [역할] 그룹의 순서를 위로 한 칸 올리는 함수
            moveUpGroup(gIndex) {
                if (gIndex <= 0) return;
                const tempG = this.groupList[gIndex];
                this.groupList[gIndex] = this.groupList[gIndex - 1];
                this.groupList[gIndex - 1] = tempG;

                const tempSub = this.subGroupList[gIndex];
                this.subGroupList[gIndex] = this.subGroupList[gIndex - 1];
                this.subGroupList[gIndex - 1] = tempSub;

                this.saveToStore();
            },

            // [역할] 그룹의 순서를 아래로 한 칸 내리는 함수
            moveDownGroup(gIndex) {
                if (gIndex >= this.groupList.length - 1) return;
                const tempG = this.groupList[gIndex];
                this.groupList[gIndex] = this.groupList[gIndex + 1];
                this.groupList[gIndex + 1] = tempG;

                const tempSub = this.subGroupList[gIndex];
                this.subGroupList[gIndex] = this.subGroupList[gIndex + 1];
                this.subGroupList[gIndex + 1] = tempSub;

                this.saveToStore();
            },

            // [역할] 1차 항목의 순서를 위로 한 칸 올리는 함수
            moveUpLevel1(gIndex, l1Index) {
                if (l1Index <= 0) return;
                const targetList = this.subGroupList[gIndex];
                const temp = targetList[l1Index];
                targetList[l1Index] = targetList[l1Index - 1];
                targetList[l1Index - 1] = temp;
                this.saveToStore();
            },

            // [역할] 1차 항목의 순서를 아래로 한 칸 내리는 함수
            moveDownLevel1(gIndex, l1Index) {
                const targetList = this.subGroupList[gIndex];
                if (l1Index >= targetList.length - 1) return;
                const temp = targetList[l1Index];
                targetList[l1Index] = targetList[l1Index + 1];
                targetList[l1Index + 1] = temp;
                this.saveToStore();
            },

            // [역할] 2차 항목의 순서를 위로 한 칸 올리는 함수
            moveUpLevel2(gIndex, l1Index, l2Index) {
                if (l2Index <= 0) return;
                const targetList = this.subGroupList[gIndex][l1Index].children;
                const temp = targetList[l2Index];
                targetList[l2Index] = targetList[l2Index - 1];
                targetList[l2Index - 1] = temp;
                this.saveToStore();
            },

            // [역할] 2차 항목의 순서를 아래로 한 칸 내리는 함수
            moveDownLevel2(gIndex, l1Index, l2Index) {
                const targetList = this.subGroupList[gIndex][l1Index].children;
                if (l2Index >= targetList.length - 1) return;
                const temp = targetList[l2Index];
                targetList[l2Index] = targetList[l2Index + 1];
                targetList[l2Index + 1] = temp;
                this.saveToStore();
            },


            // [역할] 프롬프트 창을 띄워 공종명 목록을 콤마(,) 기준으로 수정하는 함수
            editGroups() {
                const currentStr = this.groupList.join(', ');
                const userInput = prompt('공종명 목록을 콤마(,)로 구분해서 수정해 주세요:', currentStr);
                if (userInput !== null) {
                    const newList = userInput.split(',')
                        .map(item => item.trim())
                        .filter(item => item.length > 0);
                    this.groupList = newList;
                    this.activeGroup = '';
                    this.saveToStore();
                }
            }
        };
    }
</script>
