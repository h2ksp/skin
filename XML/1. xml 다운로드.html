<style>
    .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0;
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background-color: #f8fafc;
        max-width: 900px;
    }

    .toolbar label {
        font-size: 14px;
        font-weight: 400;
        color: #334155;
    }

    .toolbar select {
        min-width: 200px;
        padding: 6px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background: #ffffff;
        font-size: 14px;
        font-weight: 400;
        color: #334155;
    }
</style>


<div id="title">XML 다운로드</div>

<div class="toolbar" x-data="xmlDownloaderComponent()" x-init="init()">
    <label for="xmlProjectSelect">문서 선택:</label>
    <select id="xmlProjectSelect" x-model="activeProject" @change="onProjectChange()">
        <option value="">프로젝트 선택</option>
        <template x-for="project in projectList" :key="project">
            <option :value="project" x-text="project"></option>
        </template>
    </select>

    <!-- 문서를 선택하지 않았을 때는 버튼 비활성화 (:disabled) -->
    <button type="button" class="download-btn" :disabled="!activeProject" @click="downloadXml()">XML 다운로드</button>
</div>

<ul>
    <li>
        <a href="https://npccs.g2b.go.kr:8785/portal/main/main/portalMainForm.do" target="_blank"
            rel="noopener noreferrer">
            C3R 호환성검증 ↗
        </a>
    </li>
</ul>

<script>

            activeProject: '',

                this.projectList = Object.keys(store.cost || {});
                this.activeProject = option.activeProject || this.projectList[0] || '';
                this.xml = store?.cost?.[this.activeProject]?.xml || {};
            },

            onProjectChange() {

                localStorage.setItem('option', JSON.stringify(option));

                const store = Alpine.store('dbStore');
                this.xml = store?.cost?.[this.activeProject]?.xml || {};
            },

                                <조경면적>${this.xml?.건축공사사업내용?.조경면적 || ''}</조경면적>
                                <지하층연면적>${this.xml?.건축공사사업내용?.지하층연면적 || ''}</지하층연면적>

                                <건폐율>${this.xml?.건축공사사업내용?.건폐율 || ''}</건폐율>
                                <기준층층고>${this.xml?.건축공사사업내용?.기준층층고 || ''}</기준층층고>
                                <최고높이>${this.xml?.건축공사사업내용?.최고높이 || ''}</최고높이>

                                <공사현장주소>${this.xml?.건축공사사업내용?.공사현장주소 || ''}</공사현장주소>
                                <주차대수>${this.xml?.건축공사사업내용?.주차대수 || ''}</주차대수>
                                <외피면적>${this.xml?.건축공사사업내용?.외피면적 || ''}</외피면적>
                                <주요외부마감재>${this.xml?.건축공사사업내용?.주요외부마감재 || ''}</주요외부마감재>
                                <전용면적>${this.xml?.건축공사사업내용?.전용면적 || ''}</전용면적>

                                <설계특이사항>${this.xml?.건축공사사업내용?.설계특이사항 || ''}</설계특이사항>

                                <시설물유형>${this.xml?.건축공사사업내용?.시설물유형 || ''}</시설물유형>
                                <철거공사포함여부>${this.xml?.건축공사사업내용?.철거공사포함여부 || ''}</철거공사포함여부>
                                <지역구분>${this.xml?.건축공사사업내용?.지역구분 || ''}</지역구분>
                                <지반공사.지반형태>${this.xml?.건축공사사업내용?.지반공사?.지반형태 || ''}</지반공사.지반형태>
                                <지반공사.흙막이공사>${this.xml?.건축공사사업내용?.지반공사?.흙막이공사 || ''}</지반공사.흙막이공사>
                                <구조형식>${this.xml?.건축공사사업내용?.구조형식 || ''}</구조형식>
                                <내진등급>${this.xml?.건축공사사업내용?.내진등급 || ''}</내진등급>
                                <건축물인증.신재생에너지>${this.xml?.건축공사사업내용?.건축물인증?.신재생에너지 || ''}</건축물인증.신재생에너지>
                                <건축물인증.녹색건축인증>${this.xml?.건축공사사업내용?.건축물인증?.녹색건축인증 || ''}</건축물인증.녹색건축인증>

                            \n</건축공사사업내용>

                const blob = new Blob([masterXml], { type: 'application/xml;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;

                // 2. 선택한 프로젝트명으로 파일명 지정
                link.download = `${this.activeProject}.xml`;

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }

</script>
