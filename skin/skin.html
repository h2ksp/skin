  <!-- API 노무비, 연료단가 -->
  <script>
    (async () => {
      const CACHE_KEY = 'api_data';
      const targetDate = new Date(Date.now() - 32400000).toISOString().split('T')[0];
      let cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');

      if (cache.savedDate !== targetDate || !cache.data?.labor || !cache.data?.oil) {
        const [laborRes, oilRes] = await Promise.all([
          fetch('https://script.google.com/macros/s/AKfycbz0A2XWL2fZjTxq50oKdwDwEDl1cDylHeeoMvDYZ1qdH60vlOoNrPm-XRZf4tzDmVFDLQ/exec?mode=lober').then(r => r.json()),
          fetch('https://script.google.com/macros/s/AKfycbz0A2XWL2fZjTxq50oKdwDwEDl1cDylHeeoMvDYZ1qdH60vlOoNrPm-XRZf4tzDmVFDLQ/exec?mode=oil').then(r => r.json())
        ]);

        cache.savedDate = targetDate;
        cache.data = cache.data || {};

        if (laborRes.status === "success") cache.data.labor = laborRes;
        if (oilRes.status === "success") cache.data.oil = oilRes;

        localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
      }
    })();
  </script>

          <script>
            const LOGIN_STORAGE_KEY = "spot_login_return_state";
            const LOGIN_PAGE_URL = "https://study-with-words.blogspot.com/2026/11/blog-post_20.html";
            const AUTH_STATUS_URL = "https://h2ksp3.cafe24.com/accounts/auth-status/";
            const LOGOUT_URL = "https://h2ksp3.cafe24.com/accounts/auth-logout/";

            function readLoginOption() {
              const option = JSON.parse(localStorage.getItem("option") || "{}");
              if (!option || typeof option !== "object" || Array.isArray(option)) {
                throw new Error("로컬 저장소의 option 형식이 올바르지 않습니다.");
              }
              return option;
            }

            function clearLoginReturnState() {
              const option = readLoginOption();
              if (Object.prototype.hasOwnProperty.call(option, LOGIN_STORAGE_KEY)) {
                delete option[LOGIN_STORAGE_KEY];
                localStorage.setItem("option", JSON.stringify(option));
              }
              localStorage.removeItem(LOGIN_STORAGE_KEY);
            }

            function buildLoginPageUrl(group, sub) {
              const target = new URL(LOGIN_PAGE_URL);
              if (group) target.searchParams.set("group", group);
              if (sub) target.searchParams.set("sub", sub);
              return target.toString();
            }

            function loginWidget() {
              return {
                loggedIn: false,
                statusMessage: "",

                async init() {
                  await this.checkAuth();
                },

                async toggleLogin() {
                  if (this.loggedIn) {
                    clearLoginReturnState();
                    try {
                      const res = await fetch(LOGOUT_URL, {
                        method: "GET",
                        credentials: "include",
                      });
                      if (!res.ok) return;
                    } catch (_) {
                      return;
                    }

                    this.loggedIn = false;
                    this.statusMessage = "";
                    await this.checkAuth();
                    return;
                  }

                  const url = new URL(window.location.href);
                  const group = url.searchParams.get("group") || "";
                  const sub = url.searchParams.get("sub") || "";

                  const payload = {
                    options: {
                      key: LOGIN_STORAGE_KEY,
                      redirect: {
                        url: url.toString(),
                        group,
                        sub,
                        scrollX: window.scrollX,
                        scrollY: window.scrollY,
                      },
                    },
                  };

                  const option = readLoginOption();
                  option[LOGIN_STORAGE_KEY] = payload;
                  localStorage.setItem("option", JSON.stringify(option));
                  localStorage.removeItem(LOGIN_STORAGE_KEY);
                  window.location.href = buildLoginPageUrl(group, sub);
                },

                restoreAfterLogin() {
                  const option = readLoginOption();
                  let payload = option[LOGIN_STORAGE_KEY];
                  if (!payload) {
                    const raw = localStorage.getItem(LOGIN_STORAGE_KEY);
                    if (!raw) return false;
                    try {
                      payload = JSON.parse(raw);
                    } catch (_) {
                      localStorage.removeItem(LOGIN_STORAGE_KEY);
                      return false;
                    }
                  }

                  const redirect = payload?.options?.redirect;
                  if (!redirect || !redirect.url) {
                    clearLoginReturnState();
                    return false;
                  }

                  if (window.location.href !== redirect.url) {
                    window.location.replace(redirect.url);
                    return true;
                  }

                  window.scrollTo(redirect.scrollX || 0, redirect.scrollY || 0);
                  clearLoginReturnState();
                  return false;
                },

                async checkAuth() {
                  try {
                    const res = await fetch(AUTH_STATUS_URL, { credentials: "include" });
                    const data = await res.json();

                    if (data?.authenticated) {
                      this.loggedIn = true;
                      this.statusMessage = data.username ? `${data.username}님, 로그인됐어!` : "로그인됐어!";
                      this.restoreAfterLogin();
                    } else {
                      this.loggedIn = false;
                      this.statusMessage = "";
                    }
                  } catch (_) { }
                },
              };
            }
          </script>

            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isMainPage = (window.location.pathname === "/" || window.location.pathname === "") && !urlParams.has("group");

    if (isMainPage) {
      document.body.classList.add("is-main");
      document.body.classList.remove("show-sidebar");
    } else {
      document.body.classList.remove("is-main");
      document.body.classList.add("show-sidebar");
    }

    // 1. 사이드바 및 상태 초기화 함수
    function initSidebar() {
      if (typeof menuData === "undefined" || typeof renderSidebar !== "function") {
        setTimeout(initSidebar, 50);
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const currentGroup = urlParams.get("group") || "group1";
      const currentSub = urlParams.get("sub") || "sub1";

      if (urlParams.has("group")) {
        document.body.classList.add("show-sidebar");
      } else {
        document.body.classList.remove("show-sidebar");
      }

      document.querySelectorAll(".cat-tab").forEach(tab => {
        if (tab.getAttribute("data-target") === currentGroup) {
          tab.classList.add("active");
        } else {
          tab.classList.remove("active");
        }
      });

      renderSidebar(currentGroup, currentSub);
    }


    function renderSidebar(groupKey, subKey) {
      if (typeof menuData === "undefined") return;

      const data = menuData[groupKey];
      if (!data) return;

      const titleElem = document.getElementById("sidebar-category-title");
      const subTabsContainer = document.getElementById("sub-tabs-container");
      const ul = document.getElementById("sidebar-dynamic-list");
      if (!ul) return;

      if (titleElem) titleElem.textContent = data.title;
      ul.innerHTML = "";

      if (!data.hasSubTabs || !subTabsContainer) return;

      subTabsContainer.style.display = "block";
      subTabsContainer.innerHTML = "";

      if (!subKey || !data.subTabs[subKey]) {
        subKey = Object.keys(data.subTabs)[0];
      }

      const searchEnabled = groupKey === "group1" || groupKey === "group2";

      for (const sKey in data.subTabs) {
        const btn = document.createElement("button");
        btn.textContent = data.subTabs[sKey].name;
        btn.style.marginRight = "5px";
        btn.style.cursor = "pointer";

        if (sKey === subKey) {
          btn.style.fontWeight = "bold";
          btn.style.backgroundColor = "#ddd";
        }

        btn.addEventListener("click", function () {
          const newUrl = new URL(window.location);
          newUrl.searchParams.set("group", groupKey);
          newUrl.searchParams.set("sub", sKey);
          window.history.pushState({}, "", newUrl);
          initSidebar();
        });

        subTabsContainer.appendChild(btn);
      }

      let searchInput = null;

      if (searchEnabled) {
        searchInput = document.createElement("input");
        searchInput.type = "search";
        searchInput.placeholder = "목차 검색";
        searchInput.setAttribute("aria-label", "목차 검색");

        searchInput.value = new URLSearchParams(window.location.search).get("search") || "";

        searchInput.style.display = "block";
        searchInput.style.boxSizing = "border-box";
        searchInput.style.width = "88%";
        searchInput.style.marginTop = "8px";
        searchInput.style.padding = "8px 10px";
        searchInput.style.border = "1px solid #ccc";
        searchInput.style.borderRadius = "4px";
        searchInput.style.fontSize = "14px";

        subTabsContainer.appendChild(searchInput);
        subTabsContainer.style.marginBottom = "10px";
      } else {
        subTabsContainer.style.marginBottom = "-20px";
      }

      const subData = data.subTabs[subKey];
      if (!subData || !subData.categories) return;

      const categoryEntries = [];

      subData.categories.forEach(cat => {
        const catLi = document.createElement("li");
        catLi.textContent = "📁 " + cat.catTitle;
        catLi.style.fontWeight = "bold";
        catLi.style.marginTop = "50px";
        catLi.style.color = "#234";
        catLi.style.listStyle = "none";
        catLi.style.paddingLeft = "0";
        ul.appendChild(catLi);

        const categoryEntry = {
          element: catLi,
          sections: []
        };

        cat.sections.forEach(sec => {
          const sectionLi = document.createElement("li");
          sectionLi.textContent = "📂 " + sec.secTitle;
          sectionLi.style.fontWeight = "bold";
          sectionLi.style.marginTop = "5px";
          sectionLi.style.marginLeft = "20px";
          sectionLi.style.color = "#456";
          sectionLi.style.listStyle = "none";
          sectionLi.style.paddingLeft = "0";
          ul.appendChild(sectionLi);

          const sectionEntry = {
            element: sectionLi,
            items: []
          };


          sec.items.forEach(item => {
            const li = document.createElement("li");
            li.style.marginLeft = "45px";

            const a = document.createElement("a");

            let finalItemUrl = item.url;
            if (finalItemUrl && !finalItemUrl.startsWith("#")) {
              const sep = finalItemUrl.includes("?") ? "&" : "?";
              finalItemUrl = `${finalItemUrl}${sep}group=${groupKey}&sub=${subKey}`;
            }

            a.href = finalItemUrl;
            a.textContent = item.text;

            const isNewTab = item.isNewWindow === true;

            a.onclick = function (e) {
              e.preventDefault();
              e.stopPropagation();

              if (finalItemUrl.startsWith("#")) {
                window.location.hash = finalItemUrl;
              } else {
                if (isNewTab) {
                  window.open(finalItemUrl, "_blank");
                } else {
                  window.location.href = finalItemUrl;
                }
              }
            };

            li.appendChild(a);
            ul.appendChild(li);

            const codeMatch = item.text.match(/^\s*(\d+(?:-\d+)*)/);

            sectionEntry.items.push({
              element: li,
              code: codeMatch ? codeMatch[1] : "",
              searchText: `${cat.catTitle} ${sec.secTitle} ${item.text}`.toLowerCase()
            });
          });

          categoryEntry.sections.push(sectionEntry);
        });

        categoryEntries.push(categoryEntry);
      });

      if (searchInput) {
        const applySearch = () => {
          const query = searchInput.value.trim().toLowerCase();
          const isCodeQuery = /^\d+(?:-\d+)*$/.test(query);

          if (!query) {
            categoryEntries.forEach(category => {
              category.element.style.removeProperty("display");

              category.sections.forEach(section => {
                section.element.style.removeProperty("display");

                section.items.forEach(item => {
                  item.element.style.removeProperty("display");
                });
              });
            });

            return;
          }

          categoryEntries.forEach(category => {
            let categoryHasMatch = false;

            category.sections.forEach(section => {
              const sectionHasMatch = section.items.some(item => {
                if (isCodeQuery) {
                  return item.code === query || item.code.startsWith(`${query}-`);
                }

                return item.searchText.includes(query);
              });

              section.items.forEach(item => {
                item.element.style.display = sectionHasMatch ? "" : "none";
              });

              section.element.style.display = sectionHasMatch ? "" : "none";

              if (sectionHasMatch) {
                categoryHasMatch = true;
              }
            });

            category.element.style.display = categoryHasMatch ? "" : "none";
          });
        };

        searchInput.addEventListener("input", applySearch);
        applySearch();
      }
    }
    document.querySelectorAll(".cat-tab").forEach(tab => {
      tab.addEventListener("click", function (e) {
        e.preventDefault();
        const targetGroup = this.getAttribute("data-target");

        const newUrl = new URL(window.location);
        newUrl.searchParams.set("group", targetGroup);
        newUrl.searchParams.set("sub", "sub1");
        window.history.pushState({}, '', newUrl);

        document.body.classList.add("show-sidebar");
        initSidebar();
      });
    });


    // 네이버 아이콘 클릭 시 우측 공간 내용을 전부 날리고 배경과 새 화면으로 교체
    const naverModeBtn = document.getElementById("naver-mode-btn");
    if (naverModeBtn) {
      naverModeBtn.addEventListener("click", (e) => {
        e.preventDefault();
        const rightArea = document.getElementById("right-area");
        if (!rightArea) return;

        // 기존 내용을 전부 없앰
        rightArea.innerHTML = "";
        rightArea.classList.add("naver-mode");

        // 새롭게 대체될 콘텐츠 주입
        const customContent = document.createElement("div");
        customContent.innerHTML = `
          <div style="text-align: center; padding-top: 100px;">
            <h1 style="font-size: 32px; color: #03c75a; margin-bottom: 20px;">커스텀 화면 모드</h1>
            <p style="font-size: 16px; color: #555; margin-bottom: 30px;">기존 요소를 모두 지우고 우측 공간 배경을 새롭게 바꿨어!</p>
            <button onclick="window.location.reload();" style="padding: 10px 20px; cursor: pointer; background: #333; color: #fff; border: none; border-radius: 4px;">원래대로 되돌리기</button>
          </div>
        `;
        rightArea.appendChild(customContent);

        const newUrl = new URL(window.location);
        newUrl.searchParams.set("view", "custom-mode");
        window.history.pushState({}, '', newUrl);
      });
    }

    window.addEventListener("scroll", () => {
      const btn = document.getElementById("workspace-sticky-btn");
      if (!btn) return;

      if (window.scrollY > 120) {
        btn.classList.add("is-fixed");
      } else {
        btn.classList.remove("is-fixed");
      }
    });

    window.addEventListener("popstate", () => {
      initSidebar();
    });

    window.addEventListener("DOMContentLoaded", () => {
      initSidebar();

      const blogIdElem = document.getElementById("meta-blog-id");
      const postIdElem = document.getElementById("meta-post-id");

      if (blogIdElem && postIdElem) {
        const blogId = blogIdElem.textContent.trim();
        const postId = postIdElem.textContent.trim();

        if (blogId && postId) {
          const editBtn = document.getElementById("admin-edit-btn");
          const editLink = document.getElementById("admin-edit-link");
          if (editBtn && editLink) {
            editLink.href = "https://www.blogger.com/blog/post/edit/" + blogId + "/" + postId;
            editBtn.style.display = "block";
          }
        }
      }
    });
  </script>


</body>

</html>
