<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>API 캐시 & 확인창 테스트</title>
    <!-- 알파인.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="p-6 bg-gray-100" x-data="sampleApp()">

    <div class="max-w-md p-6 bg-white rounded-lg shadow-md">
        <h2 class="mb-4 text-xl font-bold">API 데이터 캐시 테스트</h2>
        
        <p class="mb-2 text-sm text-gray-600">
            마지막 저장 날짜: <span class="font-semibold text-blue-600" x-text="savedDate"></span>
        </p>

        <!-- 강제 새로고침 버튼 (confirm 적용) -->
        <button @click="refreshData()" 
                class="px-4 py-2 font-bold text-white bg-blue-500 rounded hover:bg-blue-600">
            데이터 강제 새로고침
        </button>
    </div>

    <!-- 🚀 아까 만든 API 자동 캐싱 스크립트 -->
    <script>
        (async () => {
            const CACHE_KEY = 'api_data';
            const targetDate = new Date(Date.now() - 32400000).toISOString().split('T')[0];
            let cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');

            if (cache.savedDate !== targetDate || !cache.data?.labor || !cache.data?.oil) {
                console.log(`[API 캐시] 갱신 필요 (${targetDate}). 서버에서 데이터 불러오는 중...`);
                
                try {
                    const [laborRes, oilRes] = await Promise.all([
                        fetch('https://script.google.com/macros/s/AKfycbz0A2XWL2fZjTxq50oKdwDwEDl1cDylHeeoMvDYZ1qdH60vlOoNrPm-XRZf4tzDmVFDLQ/exec?mode=lober').then(r => r.json()),
                        fetch('https://script.google.com/macros/s/AKfycbz0A2XWL2fZjTxq50oKdwDwEDl1cDylHeeoMvDYZ1qdH60vlOoNrPm-XRZf4tzDmVFDLQ/exec?mode=oil').then(r => r.json())
                    ]);

                    cache.savedDate = targetDate;
                    cache.data = cache.data || {};
                    
                    let successCount = 0;
                    if (laborRes.status === "success") { cache.data.labor = laborRes; successCount++; }
                    if (oilRes.status === "success") { cache.data.oil = oilRes; successCount++; }

                    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
                    console.log(`[API 캐시] 저장 완료! (성공: ${successCount}/2)`);
                } catch (error) {
                    console.error('[API 캐시] 호출 실패 또는 에러 발생:', error);
                }
            } else {
                console.log(`[API 캐시] 최신 캐시(${targetDate}) 사용 중 - API 호출 생략`);
            }
        })();

        // 알파인 컴포넌트 (화면에 상태 보여주기용)
        function sampleApp() {
            return {
                savedDate: JSON.parse(localStorage.getItem('api_data') || '{}').savedDate || '없음',

                // 버튼 누를 때 confirm 창 띄우고 강제 갱신하는 함수
                async refreshData() {
                    if (confirm("서버에서 최신 데이터를 새로 불러오시겠습니까?")) {
                        // 강제로 캐시 날리고 페이지 새로고침
                        localStorage.removeItem('api_data');
                        alert("캐시가 초기화되었습니다. 페이지를 새로고침합니다.");
                        location.reload();
                    } else {
                        console.log("사용자가 새로고침을 취소했습니다.");
                    }
                }
            }
        }
    </script>
</body>
</html>
